/ I lack both → 1\n    expect(negotiateEnvelopeVersion(mineV1, [['envelope-v3']])).toBe(1);\n    // Solo → 1\n    expect(negotiateEnvelopeVersion(mineV3, [])).toBe(1);\n  });\n\n  it('decoder without resolvePeer returns from=undefined + preserves f', () => {\n    const env = sampleEnv();\n    const bytes = encode(env, { cbor: true, zstd: true, envelope: 3, peerIndex: 42 });\n    const decoded = decode(bytes) as Record<"+"string, unknown>;\n    expect(decoded.from).toBeUndefined();\n    expect(decoded.f).toBe(42);\n    expect(decoded.kind).toBe(env.kind);\n  });\n\n  it('decoder with resolvePeer returning undefined (peer not in map) → from=undefined + f preserved', () => {\n    const env = sampleEnv();\n    const bytes = encode(env, { cbor: true, zstd: true, envelope: 3, peerIndex: 99 });\n    const decoded = decode(bytes, { resolvePeer: () => undefined }) as Record<"+"string, unknown>;\n    expect(decoded.from).toBeUndefined();\n    expect(decoded.f).toBe(99);\n  });\n\n  it('decoder of 0xCA with unknown enum byte returns forward-compat sentinel', async () => {\n    const { Encoder } = await import('cbor-x');\n    const { compress } = await import('@bokuweb/zstd-wasm');\n    const cborEnc = new Encoder({ mapsAsObjects: true, useRecords: false });\n    const bogus = {\n      v: 3,\n      id: new Uint8Array(16),\n      ts: 60_000,\n      f: 0,\n      k: 0xFF,\n      body: 'x',\n    };\n    const cbor = cborEnc.encode(bogus);\n    const zst = compress(cbor, 3);\n    const wire = new Uint8Array(3 + zst.length);\n    wire[0] = 0xCA;\n    wire[1] = 0x00;\n    wire[2] = 0x00;\n    wire.set(zst, 3);\n    const result = decode(asWireBytes(wire), { resolvePeer }) as Record<"+"string, unknown>;\n    expect(result.kind).toBe('chat-unknown-future');\n    expect(result.raw).toBe(0xFF);\n    expect(result.from).toBe(PEER_MAP[0]);\n  });\n\n  it('rejects 0xCA frame whose compressed length exceeds the cap', () => {\n    const big = new Uint8Array(70 * 1024);\n    big[0] = 0xCA;\n    big[1] = 0x00;\n    big[2] = 0x00;\n    expect(() => decode(asWireBytes(big))).toThrow(/exceeds compressed-size cap/);\n  });\n\n  it('rejects 0xCA frame with bomb-shape FCS = 4 GiB', () => {\n    const bomb = new Uint8Array([\n      0x28, 0xb5, 0x2f, 0xfd,\n      0xc0, 0x40,\n      0xff, 0xff, 0xff, 0xff,\n      0x00, 0x00, 0x00, 0x00,\n      0x00, 0x00, 0x00,\n    ]);\n    const wire = new Uint8Array(3 + bomb.length);\n    wire[0] = 0xCA;\n    wire[1] = 0x00;\n    wire[2] = 0x00;\n    wire.set(bomb, 3);\n    expect(() => decode(asWireBytes(wire))).toThrow(/Frame_Content_Size .* exceeds cap/);\n  });\n\n  it('rejects truncated 0xCA frame (<"+" 3 header bytes)', () => {\n    const wire = new Uint8Array([0xCA, 0x00]);\n    expect(() => decode(asWireBytes(wire))).toThrow(/truncated zstd-v3 frame/);\n  });\n\n  it('encoder falls back to v2 when peerIndex is missing', () => {\n    const env = sampleEnv();\n    const bytes = encode(env, { cbor: true, zstd: true, envelope: 3 });\n    expect(bytes[0]).toBe(0xC8);\n  });\n\n  it('encoder falls back to v2 when peerIndex is out of uint8 range', () => {\n    const env = sampleEnv();\n    const bytes = encode(env, { cbor: true, zstd: true, envelope: 3, peerIndex: 256 });\n    expect(bytes[0]).toBe(0xC8);\n  });\n\n  it('encoder falls back to v2 when from is missing (v2 does not require from)', () => {\n    const env = sampleEnv();\n    delete (env as Record<"+"string, unknown>).from;\n    const bytes = encode(env, { cbor: true, zstd: true, envelope: 3, peerIndex: 0 });\n    // v3 requires `from` (to replace with peer-index). v2 does NOT require from\n    // (it keeps from as-is, and missing from is a valid v2 frame). So fallback\n    // goes v3→v2 (0xC8), not v3→v1.\n    expect(bytes[0]).toBe(0xC8);\n  });\n\n  it('encoder falls back to v1 when kind is unknown', () => {\n    const env = sampleEnv({ kind: 'future-kind' });\n    const bytes = encode(env, { cbor: true, zstd: true, envelope: 3, peerIndex: 0 });\n    expect(bytes[0]).toBe(0xC6);\n  });\n\n  it('preserves unknown fields through v3 round-trip', () => {\n    const env = sampleEnv({ futureField: 'survive', nested: { a: 1, b: [1, 2, 3] } });\n    const bytes = encode(env, { cbor: true, zstd: true, envelope: 3, peerIndex: 0 });\n    const decoded = decode(bytes, { resolvePeer }) as Record<"+"string, unknown>;\n    expect(decoded.futureField).toBe('survive');\n    expect(decoded.from).toBe(env.from);\n  });\n\n  it('decoder accepts mixed-roster v3/v2/v1 frames (decoder branches independent of negotiation)', () => {\n    const env = sampleEnv();\n    const v1 = encode(env, { cbor: true, zstd: true, envelope: 1 });\n    const v2 = encode(env, { cbor: true, zstd: true, envelope: 2 });\n    const v3 = encode(env, { cbor: true, zstd: true, envelope: 3, peerIndex: 0 });\n    expect(decode(v1, { resolvePeer })).toEqual(env);\n    expect(decode(v2, { resolvePeer })).toEqual(env);\n    const d3 = decode(v3, { resolvePeer }) as Record<"+"string, unknown>;\n    expect(d3.from).toBe(env.from);\n    expect(d3.kind).toBe(env.kind);\n    expect(d3.body).toBe(env.body);\n  });\n\n  it('0xCA magic byte is distinct from 0xC8 (v2) and 0xC9 (mesh-bundle)', () => {\n    expect(0xCA).not.toBe(0xC8);\n    expect(0xCA).not.toBe(0xC9);\n    // Encode a v3 frame and verify the magic byte.\n    const env = sampleEnv();\n    const bytes = encode(env, { cbor: true, zstd: true, envelope: 3, peerIndex: 0 });\n    expect(bytes[0]).toBe(0xCA);\n  });\n});\n\n// FOLLOWUPS A9 — canonicalizeEnvelope produces byte-identical CBOR for two\n// equivalent objects whose keys were inserted in different orders. Required\n// when a future code path takes a hash over wire bytes (dedup / idempotency\n// / signed-fingerprint AAD).\ndescribe('canonicalizeEnvelope (A9)', () => {\n  it('two key-order permutations encode to identical bytes', () => {\n    const a = { z: 1, a: 'x', m: { b: 2, a: 1 } };\n    const b = { m: { a: 1, b: 2 }, a: 'x', z: 1 };\n    const ea = encode(canonicalizeEnvelope(a), { cbor: true });\n    const eb = encode(canonicalizeEnvelope(b), { cbor: true });\n    expect(ea).toEqual(eb);\n  });\n\n  it('without canonicalization, cbor-x emits insertion order (regression baseline)', () => {\n    const a = { z: 1, a: 2 };\n    const b = { a: 2, z: 1 };\n    const ea = encode(a, { cbor: true });\n    const eb = encode(b, { cbor: true });\n    // If this ever stops differing, cbor-x switched to a deterministic mode\n    // and the canonicalization helper becomes redundant.\n    expect(ea).not.toEqual(eb);\n  });\n\n  it('preserves array order, recurses through nested arrays/objects', () => {\n    const v = canonicalizeEnvelope({ b: [{ y: 1, x: 0 }, { y: 3, x: 2 }], a: 0 });\n    expect(Object.keys(v)).toEqual(['a', 'b']);\n    expect(Object.keys(v.b[0] as object)).toEqual(['x', 'y']);\n    expect((v.b as { x: number }[]).map((e) => e.x)).toEqual([0, 2]);\n  });\n\n  it('passes Uint8Array through unchanged', () => {\n    const u = new Uint8Array([1, 2, 3]);\n    const v = canonicalizeEnvelope({ k: u });\n    expect((v.k as Uint8Array)).toBe(u);\n  });\n});\n"},"src/__tests__/http-body.test.ts":{"tests":[{"id":"69","name":"encodeHttpBody / decodeHttpBody round-trips plain JSON through string input"},{"id":"70","name":"encodeHttpBody / decodeHttpBody round-trips plain JSON bytes (0x7B prefix)"},{"id":"71","name":"encodeHttpBody / decodeHttpBody round-trips 0xC6 dictless: encode → frame[0]=0xC6 → decode → original"},{"id":"72","name":"encodeHttpBody / decodeHttpBody round-trips 0xC7 with ru dict: encode → frame[0]=0xC7, frame[2]=0x01 → decode → original"},{"id":"73","name":"encodeHttpBody / decodeHttpBody 0xC8 throws specific peer envelope-v2 error (not generic unknown magic byte)"}],"source":"/**\n * http-body.test.ts — unit tests for encodeHttpBody / decodeHttpBody.\n *\n * Covers:\n *  - round-trip: dictless 0xC6\n *  - round-trip: dict 0xC7 (ru, fa, en)\n *  - plain JSON pass-through\n *  - 0xC8 produces clear peer-envelope error (not generic \"unknown magic byte\")\n */\nimport { describe, it, expect, beforeAll } from 'vitest';\nimport { readFileSync } from 'node:fs';\nimport { fileURLToPath } from 'node:url';\nimport { join, dirname } from 'node:path';\n\nconst __dirname = dirname(fileURLToPath(import.meta.url));\nconst DICTS_DIR = join(__dirname, '..', '..', 'dicts');\nconst MOCKED_DICTS = ['zstd-dict-ru-v1', 'zstd-dict-fa-v1', 'zstd-dict-en-v1'] as const;\n\nglobalThis.fetch = (async (input: RequestInfo | URL): Promise<"+"Response> => {\n  const url = typeof input === 'string' ? input : input.toString();\n  for (const name of MOCKED_DICTS) {\n    if (url.endsWith(`/dicts/${name}.zstd`)) {\n      const buf = readFileSync(join(DICTS_DIR, `${name}.zstd`));\n      const u8 = new Uint8Array(buf.buffer, buf.byteOffset, buf.byteLength);\n      return new Response(u8, { status: 200 });\n    }\n  }\n  return new Response('not found', { status: 404 });\n}) as typeof fetch;\n\nimport {\n  encodeHttpBody,\n  decodeHttpBody,\n  ensureWireCodecReady,\n} from '../codec.ts';\nimport { asHttpWireBytes } from '../brands.ts';\n\nbeforeAll(async () => {\n  await ensureWireCodecReady();\n});\n\ndescribe('encodeHttpBody / decodeHttpBody', () => {\n  it('round-trips plain JSON through string input', () => {\n    const payload = { v: 1, msg: 'hello' };\n    const jsonStr = JSON.stringify(payload);\n    const result = decodeHttpBody(jsonStr);\n    expect(result).toEqual(payload);\n  });\n\n  it('round-trips plain JSON bytes (0x7B prefix)', () => {\n    const payload = { v: 1, msg: 'hello' };\n    const jsonBytes = new TextEncoder().encode(JSON.stringify(payload));\n    expect(jsonBytes[0]).toBe(0x7b);\n    const result = decodeHttpBody(asHttpWireBytes(jsonBytes));\n    expect(result).toEqual(payload);\n  });\n\n  it('round-trips 0xC6 dictless: encode → frame[0]=0xC6 → decode → original', () => {\n    const payload = { v: 1, kind: 'chat-msg', body: 'test message' };\n    const jsonBytes = new TextEncoder().encode(JSON.stringify(payload));\n    const frame = encodeHttpBody(jsonBytes);\n    expect(frame[0]).toBe(0xc6);\n    const result = decodeHttpBody(frame);\n    expect(result).toEqual(payload);\n  });\n\n  it('round-trips 0xC7 with ru dict: encode → frame[0]=0xC7, frame[2]=0x01 → decode → original', () => {\n    const payload = { v: 1, kind: 'chat-msg', body: 'тест сообщение' };\n    const jsonBytes = new TextEncoder().encode(JSON.stringify(payload));\n    const frame = encodeHttpBody(jsonBytes, 'zstd-dict-ru-v1');\n    expect(frame[0]).toBe(0xc7);\n    expect(frame[1]).toBe(0x00); // high byte of u16 BE\n    expect(frame[2]).toBe(0x01); // ru dict-id\n    const result = decodeHttpBody(frame);\n    expect(result).toEqual(payload);\n  });\n\n  it('0xC8 throws specific peer envelope-v2 error (not generic unknown magic byte)', () => {\n    // 0xC8 is the peer envelope-v2 format (encode() with envelope:2).\n    // decodeHttpBody must reject it with a clear message, not silently throw\n    // \"unknown magic byte 0xc8\" which is hard to diagnose.\n    const peerFrame = new Uint8Array([0xc8, 0x00, 0x01, 0x02, 0x03]);\n    expect(() => decodeHttpBody(asHttpWireBytes(peerFrame))).toThrow(\n      'decodeHttpBody: 0xC8 is the peer envelope-v2 format; use decode() instead.',\n    );\n  });\n});\n"},"src/__tests__/envelope-v3-bench.test.ts":{"tests":[{"id":"74","name":"envelope-v3 realistic bench (random hex pubkeys) dictless v1 vs v2 vs v3 — 2 chars (ок)"},{"id":"75","name":"envelope-v3 realistic bench (random hex pubkeys) dictless v1 vs v2 vs v3 — 10 chars"},{"id":"76","name":"envelope-v3 realistic bench (random hex pubkeys) dictless v1 vs v2 vs v3 — 50 chars"},{"id":"77","name":"envelope-v3 realistic bench (random hex pubkeys) dictless v1 vs v2 vs v3 — 100 chars"},{"id":"78","name":"envelope-v3 realistic bench (random hex pubkeys) dictless v1 vs v2 vs v3 — 200 chars"},{"id":"79","name":"envelope-v3 realistic bench (random hex pubkeys) RU dict v1 vs v2 vs v3 — 2 chars (ок)"},{"id":"80","name":"envelope-v3 realistic bench (random hex pubkeys) RU dict v1 vs v2 vs v3 — 10 chars"},{"id":"81","name":"envelope-v3 realistic bench (random hex pubkeys) RU dict v1 vs v2 vs v3 — 50 chars"},{"id":"82","name":"envelope-v3 realistic bench (random hex pubkeys) RU dict v1 vs v2 vs v3 — 100 chars"},{"id":"83","name":"envelope-v3 realistic bench (random hex pubkeys) RU dict v1 vs v2 vs v3 — 200 chars"},{"id":"84","name":"envelope-v3 realistic bench (random hex pubkeys) FA dict v1 vs v2 vs v3 — 2 chars (ок)"},{"id":"85","name":"envelope-v3 realistic bench (random hex pubkeys) FA dict v1 vs v2 vs v3 — 10 chars"},{"id":"86","name":"envelope-v3 realistic bench (random hex pubkeys) FA dict v1 vs v2 vs v3 — 50 chars"},{"id":"87","name":"envelope-v3 realistic bench (random hex pubkeys) FA dict v1 vs v2 vs v3 — 100 chars"},{"id":"88","name":"envelope-v3 realistic bench (random hex pubkeys) FA dict v1 vs v2 vs v3 — 200 chars"},{"id":"89","name":"envelope-v3 realistic bench (random hex pubkeys) EN dict v1 vs v2 vs v3 — 2 chars (ок)"},{"id":"90","name":"envelope-v3 realistic bench (random hex pubkeys) EN dict v1 vs v2 vs v3 — 10 chars"},{"id":"91","name":"envelope-v3 realistic bench (random hex pubkeys) EN dict v1 vs v2 vs v3 — 50 chars"},{"id":"92","name":"envelope-v3 realistic bench (random hex pubkeys) EN dict v1 vs v2 vs v3 — 100 chars"},{"id":"93","name":"envelope-v3 realistic bench (random hex pubkeys) EN dict v1 vs v2 vs v3 — 200 chars"},{"id":"94","name":"envelope-v3 realistic bench (random hex pubkeys) v3 savings summary across all 5 random pubkeys (dictless, 2-char body)"},{"id":"95","name":"envelope-v3 realistic bench (random hex pubkeys) v3 with dict savings summary (RU dict, 2-char body, 5 random pubkeys)"}],"source":"// envelope-v3-bench.test.ts — realistic benchmark for v1/v2/v3 envelope sizes.\n//\n// The existing wire-codec.bench.test.ts uses `'b'.repeat(64)` for `from` —\n// a repeating single byte that zstd compresses extremely well. Real Ed25519\n// pubkeys are random hex (0-9a-f), which zstd barely compresses. This bench\n// measures the ACTUAL wire savings of v3 (peer-index) vs v2 vs v1 using:\n//\n//   - Realistic random hex pubkeys (64-char, uniform random hex digits)\n//   - Realistic UUIDs (proper format with random hex)\n//   - Each shipped dict (RU/FA/EN) + dictless\n//   - Multiple body sizes (2 chars → 200 chars)\n//\n// The v3 savings should be largest for short messages (where envelope overhead\n// dominates) and smallest for long messages (where body dominates).\n//\n// This is an INFORMATIONAL bench — assertions only check v3 <"+"= v2 <"+"= v1.\n// The absolute numbers are logged for human review.\n\nimport { describe, it, expect, beforeAll } from 'vitest';\nimport { encode, ensureWireCodecReady } from '../codec.ts';\nimport { ROOM_EPOCH } from '../envelope-v2.ts';\n\n// Deterministic PRNG (xorshift32) — reproducible bench runs.\nfunction makeRng(seed: number): () => number {\n\tlet s = seed >>> 0;\n\treturn () => {\n\t\ts ^= s <"+"<"+" 13; s >>>= 0;\n\t\ts ^= s >>> 17;\n\t\ts ^= s <"+"<"+" 5; s >>>= 0;\n\t\treturn s;\n\t};\n}\n\nconst HEX = '0123456789abcdef';\n\nfunction randomHex(rng: () => number, len: number): string {\n\tconst chars: string[] = new Array(len);\n\tfor (let i = 0; i <"+" len; i++) chars[i] = HEX[rng() & 0xf];\n\treturn chars.join('');\n}\n\nfunction randomUuid(rng: () => number): string {\n\t// UUID v4 format: 8-4-4-4-12 with version/variant bits.\n\tconst p = (n: number) => randomHex(rng, n);\n\treturn `${p(8)}-${p(4)}-4${p(3)}-a${p(3)}-${p(12)}`;\n}\n\nbeforeAll(async () => {\n\tawait ensureWireCodecReady();\n});\n\ndescribe('envelope-v3 realistic bench (random hex pubkeys)', () => {\n\t// Generate 5 different realistic envelopes with random pubkeys.\n\tconst samples = Array.from({ length: 5 }, (_, i) => {\n\t\tconst rngLocal = makeRng(0xb3e0c001 + i * 7919);\n\t\treturn {\n\t\t\tuuid: randomUuid(rngLocal),\n\t\t\tfrom: randomHex(rngLocal, 64),\n\t\t\tts: ROOM_EPOCH + 60_000 + i * 1000,\n\t\t};\n\t});\n\n\tconst bodies: Array<"+"{ name: string; body: string }> = [\n\t\t{ name: '2 chars (ок)', body: 'ок' },\n\t\t{ name: '10 chars', body: 'Привет, как дела?' },\n\t\t{ name: '50 chars', body: 'Привет! Я уже еду к тебе, буду примерно через 20 минут, жди' },\n\t\t{ name: '100 chars', body: 'A'.repeat(100) },\n\t\t{ name: '200 chars', body: 'Привет! Это длинное сообщение для теста сжатия. '.repeat(5) },\n\t];\n\n\tconst dicts: Array<"+"{ name: string; dict: undefined | 'zstd-dict-ru-v1' | 'zstd-dict-fa-v1' | 'zstd-dict-en-v1' }> = [\n\t\t{ name: 'dictless', dict: undefined },\n\t\t{ name: 'RU dict', dict: 'zstd-dict-ru-v1' },\n\t\t{ name: 'FA dict', dict: 'zstd-dict-fa-v1' },\n\t\t{ name: 'EN dict', dict: 'zstd-dict-en-v1' },\n\t];\n\n\tfor (const dictCase of dicts) {\n\t\tdescribe(`${dictCase.name}`, () => {\n\t\t\tfor (const bodyCase of bodies) {\n\t\t\t\tconst bodyName = bodyCase.name;\n\t\t\t\tit(`v1 vs v2 vs v3 — ${bodyName}`, () => {\n\t\t\t\t\t// Use first sample envelope (deterministic).\n\t\t\t\t\tconst s = samples[0]!;\n\t\t\t\t\tconst env = {\n\t\t\t\t\t\tv: 1,\n\t\t\t\t\t\tid: s.uuid,\n\t\t\t\t\t\tts: s.ts,\n\t\t\t\t\t\tfrom: s.from,\n\t\t\t\t\t\tkind: 'chat-msg',\n\t\t\t\t\t\tbody: bodyCase.body,\n\t\t\t\t\t};\n\t\t\t\t\tconst opts = { cbor: true, zstd: true } as const;\n\t\t\t\t\tconst v1 = encode(env, { ...opts, envelope: 1, ...(dictCase.dict ? { dict: dictCase.dict } : {}) });\n\t\t\t\t\tconst v2 = encode(env, { ...opts, envelope: 2, ...(dictCase.dict ? { dict: dictCase.dict } : {}) });\n\t\t\t\t\tconst v3 = encode(env, { ...opts, envelope: 3, peerIndex: 0, ...(dictCase.dict ? { dict: dictCase.dict } : {}) });\n\n\t\t\t\t\tconst v2Savings = v1.length - v2.length;\n\t\t\t\t\tconst v3Savings = v1.length - v3.length;\n\t\t\t\t\tconst v3VsV2 = v2.length - v3.length;\n\n\t\t\t\t\t// eslint-disable-next-line no-console\n\t\t\t\t\tconsole.log(\n\t\t\t\t\t\t`[v3-bench] ${dictCase.name.padEnd(10)} ${bodyName.padEnd(20)}: ` +\n\t\t\t\t\t\t`v1=${String(v1.length).padStart(4)}B  ` +\n\t\t\t\t\t\t`v2=${String(v2.length).padStart(4)}B (Δ${v2Savings >= 0 ? '-' : '+'}${Math.abs(v2Savings)}B)  ` +\n\t\t\t\t\t\t`v3=${String(v3.length).padStart(4)}B (Δ${v3Savings >= 0 ? '-' : '+'}${Math.abs(v3Savings)}B vs v1, ${v3VsV2 >= 0 ? '-' : '+'}${Math.abs(v3VsV2)}B vs v2)`,\n\t\t\t\t\t);\n\n\t\t\t\t\t// Assertions: v3 <"+"= v2 <"+"= v1 (envelope compaction never grows).\n\t\t\t\t\texpect(v2.length).toBeLessThanOrEqual(v1.length);\n\t\t\t\t\texpect(v3.length).toBeLessThanOrEqual(v2.length);\n\t\t\t\t\texpect(v3.length).toBeGreaterThan(0);\n\t\t\t\t});\n\t\t\t}\n\t\t});\n\t}\n\n\tit('v3 savings summary across all 5 random pubkeys (dictless, 2-char body)', () => {\n\t\tconst savings: number[] = [];\n\t\tfor (const s of samples) {\n\t\t\tconst env = {\n\t\t\t\tv: 1, id: s.uuid, ts: s.ts, from: s.from,\n\t\t\t\tkind: 'chat-msg', body: 'ок',\n\t\t\t};\n\t\t\tconst v2 = encode(env, { cbor: true, zstd: true, envelope: 2 });\n\t\t\tconst v3 = encode(env, { cbor: true, zstd: true, envelope: 3, peerIndex: 0 });\n\t\t\tsavings.push(v2.length - v3.length);\n\t\t}\n\t\tconst min = Math.min(...savings);\n\t\tconst max = Math.max(...savings);\n\t\tconst avg = (savings.reduce((a, b) => a + b, 0) / savings.length).toFixed(1);\n\t\t// eslint-disable-next-line no-console\n\t\tconsole.log(`[v3-bench-summary] v2→v3 savings (dictless, \"ок\", 5 random pubkeys): min=${min}B max=${max}B avg=${avg}B`);\n\t\t// v3 should save at least 1 byte vs v2 for every random pubkey.\n\t\texpect(Math.min(...savings)).toBeGreaterThan(0);\n\t});\n\n\tit('v3 with dict savings summary (RU dict, 2-char body, 5 random pubkeys)', () => {\n\t\tconst savings: number[] = [];\n\t\tfor (const s of samples) {\n\t\t\tconst env = {\n\t\t\t\tv: 1, id: s.uuid, ts: s.ts, from: s.from,\n\t\t\t\tkind: 'chat-msg', body: 'ок',\n\t\t\t};\n\t\t\tconst v2 = encode(env, { cbor: true, zstd: true, envelope: 2, dict: 'zstd-dict-ru-v1' });\n\t\t\tconst v3 = encode(env, { cbor: true, zstd: true, envelope: 3, peerIndex: 0, dict: 'zstd-dict-ru-v1' });\n\t\t\tsavings.push(v2.length - v3.length);\n\t\t}\n\t\tconst min = Math.min(...savings);\n\t\tconst max = Math.max(...savings);\n\t\tconst avg = (savings.reduce((a, b) => a + b, 0) / savings.length).toFixed(1);\n\t\t// eslint-disable-next-line no-console\n\t\tconsole.log(`[v3-bench-summary] v2→v3 savings (RU dict, \"ок\", 5 random pubkeys): min=${min}B max=${max}B avg=${avg}B`);\n\t\texpect(Math.min(...savings)).toBeGreaterThan(0);\n\t});\n});\n"},"src/__tests__/wire-codec.bench.test.ts":{"tests":[{"id":"96","name":"wire-codec bench (informational) measures chat-msg short"},{"id":"97","name":"wire-codec bench (informational) measures chat-msg medium"},{"id":"98","name":"wire-codec bench (informational) measures chat-msg long-repeat"},{"id":"99","name":"wire-codec bench (informational) measures chat-typing"},{"id":"100","name":"wire-codec bench (informational) measures chat-receipt"},{"id":"101","name":"wire-codec bench (informational) measures chat-receipt 10 targets"},{"id":"102","name":"wire-codec bench (informational) measures with binary 32B (ThumbHash-like)"}],"source":"import { describe, it, expect, beforeAll } from 'vitest';\nimport { encode, ensureWireCodecReady } from '../codec.ts';\n\nbeforeAll(async () => {\n  await ensureWireCodecReady();\n});\n\ndescribe('wire-codec bench (informational)', () => {\n  const samples: Array<"+"{ name: string; obj: unknown }> = [\n    { name: 'chat-msg short', obj: {\n      v: 1, id: 'a'.repeat(36), ts: 1777891000000, from: 'b'.repeat(64),\n      kind: 'chat-msg', body: 'hi'\n    }},\n    { name: 'chat-msg medium', obj: {\n      v: 1, id: 'a'.repeat(36), ts: 1777891000000, from: 'b'.repeat(64),\n      kind: 'chat-msg', body: 'a'.repeat(50), nick: 'alice'\n    }},\n    { name: 'chat-msg long-repeat', obj: {\n      v: 1, id: 'a'.repeat(36), ts: 1777891000000, from: 'b'.repeat(64),\n      kind: 'chat-msg', body: 'hello world '.repeat(40), nick: 'alice'\n    }},\n    { name: 'chat-typing', obj: {\n      v: 1, id: 'a'.repeat(36), ts: 1777891000000, from: 'b'.repeat(64),\n      kind: 'chat-typing', nick: 'alice'\n    }},\n    { name: 'chat-receipt', obj: {\n      v: 1, id: 'a'.repeat(36), ts: 1777891000000, from: 'b'.repeat(64),\n      kind: 'chat-receipt', targetIds: ['x'.repeat(36)], status: 'delivered'\n    }},\n    { name: 'chat-receipt 10 targets', obj: {\n      v: 1, id: 'a'.repeat(36), ts: 1777891000000, from: 'b'.repeat(64),\n      kind: 'chat-receipt',\n      targetIds: Array.from({ length: 10 }, (_, i) => `${i}`.padStart(36, 'x')),\n      status: 'delivered'\n    }},\n    { name: 'with binary 32B (ThumbHash-like)', obj: {\n      v: 1, id: 'a'.repeat(36), ts: 1777891000000, from: 'b'.repeat(64),\n      kind: 'chat-msg', body: '', preview: new Uint8Array(32).fill(0xAB)\n    }}\n  ];\n\n  for (const { name, obj } of samples) {\n    it(`measures ${name}`, () => {\n      const json = encode(obj, { cbor: false }).length;\n      const cbor = encode(obj, { cbor: true }).length;\n      const zstd = encode(obj, { cbor: true, zstd: true }).length;\n      const cborSavings = ((1 - cbor / json) * 100).toFixed(1);\n      const zstdSavingsVsJson = ((1 - zstd / json) * 100).toFixed(1);\n      const zstdSavingsVsCbor = ((1 - zstd / cbor) * 100).toFixed(1);\n      console.log(\n        `[bench] ${name.padEnd(36)}: ` +\n        `JSON=${String(json).padStart(4)}B  ` +\n        `CBOR=${String(cbor).padStart(4)}B (-${cborSavings}%)  ` +\n        `ZSTD=${String(zstd).padStart(4)}B (-${zstdSavingsVsJson}% vs JSON, -${zstdSavingsVsCbor}% vs CBOR)`\n      );\n      expect(cbor).toBeLessThan(json);\n      expect(cbor).toBeGreaterThan(0);\n      expect(zstd).toBeGreaterThan(0);\n    });\n  }\n});\n"},"src/__tests__/errors.test.ts":{"tests":[{"id":"103","name":"WireCodecError class is instanceof Error"},{"id":"104","name":"WireCodecError class name is WireCodecError"},{"id":"105","name":"WireCodecError class code is set"},{"id":"106","name":"WireCodecError class message is set"},{"id":"107","name":"WireCodecError class details is undefined when omitted"},{"id":"108","name":"WireCodecError class details is frozen when provided"},{"id":"109","name":"WireCodecError class details is a copy (not the original object)"},{"id":"110","name":"WireCodecError class all error codes are valid WireCodecErrorCode members"},{"id":"111","name":"decodeHttpBody — EMPTY_INPUT throws WireCodecError with code EMPTY_INPUT on empty Uint8Array"},{"id":"112","name":"decodeHttpBody — PEER_ENVELOPE_FORMAT throws WireCodecError with code PEER_ENVELOPE_FORMAT for 0xC8 byte"},{"id":"113","name":"decodeHttpBody — UNKNOWN_MAGIC throws WireCodecError with code UNKNOWN_MAGIC for unrecognized magic byte"},{"id":"114","name":"decodeHttpBody — paths requiring zstd init INVALID_DICT_ID_HEADER: truncated 0xC7 frame (<"+" 3 bytes)"},{"id":"115","name":"decode — EMPTY_INPUT throws WireCodecError with code EMPTY_INPUT on empty Uint8Array"},{"id":"116","name":"loadDict — LOADER_SWAPPED_MID_FETCH throws WireCodecError with code LOADER_SWAPPED_MID_FETCH when loader is swapped mid-fetch"},{"id":"117","name":"encode — ENCODE_ZSTD_REQUIRES_CBOR throws WireCodecError with code ENCODE_ZSTD_REQUIRES_CBOR when zstd=true without cbor=true"},{"id":"118","name":"ZSTD_NOT_INITIALIZED — unreachable after module init is documented: unreachable from public API once ensureWireCodecReady() has been called"},{"id":"119","name":"decode — ZSTD_DECODE_FAILED (malformed zstd payload) throws WireCodecError ZSTD_DECODE_FAILED for malformed zstd frame after 0xC6"},{"id":"120","name":"decode — COMPRESSED_TOO_LARGE throws WireCodecError COMPRESSED_TOO_LARGE when compressed payload > 64 KiB"},{"id":"121","name":"DECOMPRESSED_TOO_LARGE — unreachable from public API is documented: reachable only if wasm decompresses more bytes than declared FCS"},{"id":"122","name":"decode — UNKNOWN_DICT_ID (0xC7 frame with unknown dict-id) throws WireCodecError UNKNOWN_DICT_ID for dict-id 0xFF not in registry"},{"id":"123","name":"decode — DICT_NOT_LOADED (known dict-id but dict evicted from cache) throws WireCodecError DICT_NOT_LOADED when dict-id 0x01 (ru) is registered but not cached"},{"id":"124","name":"loadDict — DICT_FETCH_FAILED (loader returns non-2xx) throws WireCodecError DICT_FETCH_FAILED when the loader throws that error"}],"source":"/**\n * TDD RED phase: tests for WireCodecError typed discriminated union.\n * Written BEFORE errors.ts exists — all tests fail at import time.\n *\n * Each test exercises one error code via the minimal triggerable path.\n * Tests for codes that require zstd init are deferred to integration tests\n * in http-body.test.ts / wire-codec.test.ts (which already init zstd).\n * This file focuses on: statically-triggerable paths + loader paths.\n */\nimport { describe, it, expect, beforeAll, vi } from \"vitest\";\nimport { WireCodecError } from \"../errors.js\";\nimport type { WireCodecErrorCode } from \"../errors.js\";\n\n// ---------------------------------------------------------------------------\n// 1. WireCodecError shape\n// ---------------------------------------------------------------------------\n\ndescribe(\"WireCodecError class\", () => {\n  it(\"is instanceof Error\", () => {\n    const e = new WireCodecError(\"EMPTY_INPUT\", \"test\");\n    expect(e).toBeInstanceOf(Error);\n  });\n\n  it(\"name is WireCodecError\", () => {\n    const e = new WireCodecError(\"EMPTY_INPUT\", \"test\");\n    expect(e.name).toBe(\"WireCodecError\");\n  });\n\n  it(\"code is set\", () => {\n    const e = new WireCodecError(\"UNKNOWN_MAGIC\", \"test\");\n    expect(e.code).toBe(\"UNKNOWN_MAGIC\");\n  });\n\n  it(\"message is set\", () => {\n    const e = new WireCodecError(\"EMPTY_INPUT\", \"my message\");\n    expect(e.message).toBe(\"my message\");\n  });\n\n  it(\"details is undefined when omitted\", () => {\n    const e = new WireCodecError(\"EMPTY_INPUT\", \"test\");\n    expect(e.details).toBeUndefined();\n  });\n\n  it(\"details is frozen when provided\", () => {\n    const e = new WireCodecError(\"UNKNOWN_DICT_ID\", \"test\", { dictId: 42 });\n    expect(Object.isFrozen(e.details)).toBe(true);\n    expect(e.details?.dictId).toBe(42);\n  });\n\n  it(\"details is a copy (not the original object)\", () => {\n    const original = { dictId: 42 };\n    const e = new WireCodecError(\"UNKNOWN_DICT_ID\", \"test\", original);\n    original.dictId = 99;\n    expect(e.details?.dictId).toBe(42);\n  });\n\n  it(\"all error codes are valid WireCodecErrorCode members\", () => {\n    const codes: WireCodecErrorCode[] = [\n      \"EMPTY_INPUT\",\n      \"UNKNOWN_MAGIC\",\n      \"UNKNOWN_DICT_ID\",\n      \"DICT_NOT_LOADED\",\n      \"ZSTD_DECODE_FAILED\",\n      \"DECOMPRESSED_TOO_LARGE\",\n      \"INVALID_DICT_ID_HEADER\",\n      \"LOADER_SWAPPED_MID_FETCH\",\n      \"PEER_ENVELOPE_FORMAT\",\n      \"ZSTD_NOT_INITIALIZED\",\n      \"COMPRESSED_TOO_LARGE\",\n      \"ENCODE_ZSTD_REQUIRES_CBOR\",\n      \"DICT_FETCH_FAILED\",\n    ];\n    for (const code of codes) {\n      const e = new WireCodecError(code, \"test\");\n      expect(e.code).toBe(code);\n    }\n  });\n});\n\n// ---------------------------------------------------------------------------\n// 2. decodeHttpBody / decode error paths (no zstd init needed)\n// ---------------------------------------------------------------------------\n\nimport { decodeHttpBody, decode } from \"../codec.js\";\nimport { asWireBytes, asHttpWireBytes } from \"../brands.js\";\n\ndescribe(\"decodeHttpBody — EMPTY_INPUT\", () => {\n  it(\"throws WireCodecError with code EMPTY_INPUT on empty Uint8Array\", () => {\n    expect(() => decodeHttpBody(asHttpWireBytes(new Uint8Array(0)))).toThrow(WireCodecError);\n    try {\n      decodeHttpBody(asHttpWireBytes(new Uint8Array(0)));\n    } catch (e) {\n      expect(e).toBeInstanceOf(WireCodecError);\n      expect((e as WireCodecError).code).toBe(\"EMPTY_INPUT\");\n    }\n  });\n});\n\ndescribe(\"decodeHttpBody — PEER_ENVELOPE_FORMAT\", () => {\n  it(\"throws WireCodecError with code PEER_ENVELOPE_FORMAT for 0xC8 byte\", () => {\n    const bytes = new Uint8Array([0xc8, 0x00, 0x01]);\n    expect(() => decodeHttpBody(asHttpWireBytes(bytes))).toThrow(WireCodecError);\n    try {\n      decodeHttpBody(asHttpWireBytes(bytes));\n    } catch (e) {\n      expect(e).toBeInstanceOf(WireCodecError);\n      expect((e as WireCodecError).code).toBe(\"PEER_ENVELOPE_FORMAT\");\n    }\n  });\n});\n\ndescribe(\"decodeHttpBody — UNKNOWN_MAGIC\", () => {\n  it(\"throws WireCodecError with code UNKNOWN_MAGIC for unrecognized magic byte\", () => {\n    const bytes = new Uint8Array([0xDE, 0xAD]);\n    expect(() => decodeHttpBody(asHttpWireBytes(bytes))).toThrow(WireCodecError);\n    try {\n      decodeHttpBody(asHttpWireBytes(bytes));\n    } catch (e) {\n      expect(e).toBeInstanceOf(WireCodecError);\n      expect((e as WireCodecError).code).toBe(\"UNKNOWN_MAGIC\");\n    }\n  });\n});\n\nimport { ensureWireCodecReady } from \"../codec.js\";\n\n// Tests that need zstd initialized (to get past the ZSTD_NOT_INITIALIZED gate)\ndescribe(\"decodeHttpBody — paths requiring zstd init\", () => {\n  beforeAll(async () => {\n    await ensureWireCodecReady();\n  });\n\n  it(\"INVALID_DICT_ID_HEADER: truncated 0xC7 frame (<"+" 3 bytes)\", () => {\n    const bytes = new Uint8Array([0xc7, 0x00]); // only 2 bytes, need ≥3\n    expect(() => decodeHttpBody(asHttpWireBytes(bytes))).toThrow(WireCodecError);\n    try {\n      decodeHttpBody(asHttpWireBytes(bytes));\n    } catch (e) {\n      expect(e).toBeInstanceOf(WireCodecError);\n      expect((e as WireCodecError).code).toBe(\"INVALID_DICT_ID_HEADER\");\n      expect((e as WireCodecError).details?.frameLen).toBe(2);\n    }\n  });\n});\n\ndescribe(\"decode — EMPTY_INPUT\", () => {\n  it(\"throws WireCodecError with code EMPTY_INPUT on empty Uint8Array\", () => {\n    expect(() => decode(asWireBytes(new Uint8Array(0)))).toThrow(WireCodecError);\n    try {\n      decode(asWireBytes(new Uint8Array(0)));\n    } catch (e) {\n      expect(e).toBeInstanceOf(WireCodecError);\n      expect((e as WireCodecError).code).toBe(\"EMPTY_INPUT\");\n    }\n  });\n});\n\n// ---------------------------------------------------------------------------\n// 3. Loader — LOADER_SWAPPED_MID_FETCH\n// ---------------------------------------------------------------------------\n\nimport { loadDict, setDictLoader, _resetLoaderForTesting } from \"../dicts.js\";\n\ndescribe(\"loadDict — LOADER_SWAPPED_MID_FETCH\", () => {\n  it(\"throws WireCodecError with code LOADER_SWAPPED_MID_FETCH when loader is swapped mid-fetch\", async () => {\n    _resetLoaderForTesting();\n    let resolveDict!: (v: Uint8Array) => void;\n    const slowLoader = vi.fn(\n      () => new Promise<"+"Uint8Array>((res) => { resolveDict = res; })\n    );\n    setDictLoader(slowLoader);\n    const fetchPromise = loadDict(\"zstd-dict-ru-v1\");\n    // Swap the loader — this increments the generation counter\n    setDictLoader(null);\n    // Now resolve the original fetch with valid bytes\n    resolveDict(new Uint8Array([1, 2, 3]));\n    await expect(fetchPromise).rejects.toSatisfy((e: unknown) => {\n      return e instanceof WireCodecError && (e as WireCodecError).code === \"LOADER_SWAPPED_MID_FETCH\";\n    });\n    _resetLoaderForTesting();\n  });\n});\n\n// ---------------------------------------------------------------------------\n// 4. encode — ENCODE_ZSTD_REQUIRES_CBOR\n// ---------------------------------------------------------------------------\n\nimport { encode } from \"../codec.js\";\n\ndescribe(\"encode — ENCODE_ZSTD_REQUIRES_CBOR\", () => {\n  it(\"throws WireCodecError with code ENCODE_ZSTD_REQUIRES_CBOR when zstd=true without cbor=true\", () => {\n    expect(() => encode({}, { zstd: true, cbor: false })).toThrow(WireCodecError);\n    try {\n      encode({}, { zstd: true, cbor: false });\n    } catch (e) {\n      expect(e).toBeInstanceOf(WireCodecError);\n      expect((e as WireCodecError).code).toBe(\"ENCODE_ZSTD_REQUIRES_CBOR\");\n    }\n  });\n});\n\n// ---------------------------------------------------------------------------\n// 5. Real-trigger tests for the 7 codes not previously covered\n//    Note: zstd must be initialized before these tests run.\n//    The beforeAll block in section 2 (lines above) handles this.\n// ---------------------------------------------------------------------------\n\nimport { _evictDictForTesting } from \"../dicts.js\";\n\n// ZSTD_NOT_INITIALIZED:\n// decode() checks zstdReady (module-level singleton) BEFORE processing 0xC6/0xC7\n// payloads. However, ensureWireCodecReady() is idempotent and permanent for the\n// module lifetime — once called in any test's beforeAll, the zstdReady flag is\n// set for all subsequent tests in the same vitest worker process. There is no\n// public API to reset it. As a result, ZSTD_NOT_INITIALIZED is unreachable from\n// the public API surface once any test has called ensureWireCodecReady().\n// The code path is exercised by the module's own pre-init throw contract — see\n// encode() which throws before zstdReady; the code path is verified by code\n// inspection only. A synthetic constructor test would only exercise\n// WireCodecError construction, not the actual gate logic.\n//\n// If isolation is needed in future, add a vitest `--isolate` flag per-file or\n// move this test to a dedicated file that imports codec BEFORE calling\n// ensureWireCodecReady(). For now, document the constraint here.\ndescribe(\"ZSTD_NOT_INITIALIZED — unreachable after module init\", () => {\n  it(\"is documented: unreachable from public API once ensureWireCodecReady() has been called\", () => {\n    // The code that throws ZSTD_NOT_INITIALIZED exists in decode() and encode()\n    // before the `zstdReady` gate. Once ensureWireCodecReady() resolves, `zstdReady`\n    // is permanently true for the module instance — there is no public reset.\n    // This test documents the constraint rather than attempting an unreachable path.\n    expect(true).toBe(true);\n  });\n});\n\ndescribe(\"decode — ZSTD_DECODE_FAILED (malformed zstd payload)\", () => {\n  // Need zstd initialized — reuse the ensureWireCodecReady already called above.\n  // Feed 0xC6 magic followed by bytes that are NOT a valid zstd frame.\n  it(\"throws WireCodecError ZSTD_DECODE_FAILED for malformed zstd frame after 0xC6\", async () => {\n    // 0xC6 magic + garbage (wrong zstd magic bytes — not 0xFD2FB528)\n    const frame = new Uint8Array([0xc6, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00]);\n    try {\n      decode(asWireBytes(frame));\n      expect.fail(\"Expected WireCodecError to be thrown\");\n    } catch (e) {\n      expect(e).toBeInstanceOf(WireCodecError);\n      expect((e as WireCodecError).code).toBe(\"ZSTD_DECODE_FAILED\");\n    }\n  });\n});\n\ndescribe(\"decode — COMPRESSED_TOO_LARGE\", () => {\n  it(\"throws WireCodecError COMPRESSED_TOO_LARGE when compressed payload > 64 KiB\", async () => {\n    // 0xC6 + 65 KiB of zeroes → exceeds ZSTD_MAX_COMPRESSED_BYTES (64*1024).\n    // The size check fires before validateZstdFrame, so malformed content is fine.\n    const oversized = new Uint8Array(1 + 64 * 1024 + 1);\n    oversized[0] = 0xc6;\n    try {\n      decode(asWireBytes(oversized));\n      expect.fail(\"Expected WireCodecError to be thrown\");\n    } catch (e) {\n      expect(e).toBeInstanceOf(WireCodecError);\n      expect((e as WireCodecError).code).toBe(\"COMPRESSED_TOO_LARGE\");\n      expect((e as WireCodecError).details?.limit).toBe(64 * 1024);\n    }\n  });\n});\n\n// DECOMPRESSED_TOO_LARGE:\n// This code path sits AFTER validateZstdFrame() which itself throws ZSTD_DECODE_FAILED\n// when Frame_Content_Size > ZSTD_MAX_DECOMPRESSED_BYTES (256 KiB). A crafted\n// \"zstd bomb\" with a large declared FCS is therefore rejected by validateZstdFrame\n// before reaching the decompressed-length check.\n// The only way to reach DECOMPRESSED_TOO_LARGE is if the wasm lib decompresses\n// more bytes than the FCS declared (a wasm implementation bug), which is not\n// reachable via a crafted payload from the test surface.\ndescribe(\"DECOMPRESSED_TOO_LARGE — unreachable from public API\", () => {\n  it(\"is documented: reachable only if wasm decompresses more bytes than declared FCS\", () => {\n    // validateZstdFrame() rejects FCS > 256 KiB with ZSTD_DECODE_FAILED first.\n    // Any crafted payload that could slip past (FCS ≤ cap) and decompress to > cap\n    // would require a wasm allocator bug. Not triggerable via public decode() surface.\n    expect(true).toBe(true);\n  });\n});\n\ndescribe(\"decode — UNKNOWN_DICT_ID (0xC7 frame with unknown dict-id)\", () => {\n  it(\"throws WireCodecError UNKNOWN_DICT_ID for dict-id 0xFF not in registry\", () => {\n    // 0xC7 magic + dict-id 0xFF (not registered) + 6 bytes of placeholder.\n    // The UNKNOWN_DICT_ID check fires before validateZstdFrame, so malformed\n    // zstd content after the header is irrelevant.\n    const frame = new Uint8Array([0xc7, 0xff, 0x00, 0x00, 0x00, 0x00, 0x00]);\n    try {\n      decode(asWireBytes(frame));\n      expect.fail(\"Expected WireCodecError to be thrown\");\n    } catch (e) {\n      expect(e).toBeInstanceOf(WireCodecError);\n      expect((e as WireCodecError).code).toBe(\"UNKNOWN_DICT_ID\");\n      expect((e as WireCodecError).details?.dictId).toBe(0xff);\n    }\n  });\n});\n\ndescribe(\"decode — DICT_NOT_LOADED (known dict-id but dict evicted from cache)\", () => {\n  it(\"throws WireCodecError DICT_NOT_LOADED when dict-id 0x01 (ru) is registered but not cached\", () => {\n    // Evict the ru dict from the module cache. ensureWireCodecReady() preloads\n    // it, but _evictDictForTesting removes it so getDictBytes() returns undefined.\n    _evictDictForTesting(\"zstd-dict-ru-v1\");\n    // 0xC7 + dict-id 0x01 (ru) + minimal placeholder bytes.\n    const frame = new Uint8Array([0xc7, 0x01, 0x00, 0x00, 0x00, 0x00, 0x00]);\n    try {\n      decode(asWireBytes(frame));\n      expect.fail(\"Expected WireCodecError to be thrown\");\n    } catch (e) {\n      expect(e).toBeInstanceOf(WireCodecError);\n      expect((e as WireCodecError).code).toBe(\"DICT_NOT_LOADED\");\n    }\n  });\n});\n\ndescribe(\"loadDict — DICT_FETCH_FAILED (loader returns non-2xx)\", () => {\n  it(\"throws WireCodecError DICT_FETCH_FAILED when the loader throws that error\", async () => {\n    _resetLoaderForTesting();\n    setDictLoader(async (_name) => {\n      throw new WireCodecError(\n        \"DICT_FETCH_FAILED\",\n        \"wire-dicts.loadDict: mock loader: fetch failed (404)\",\n      );\n    });\n    try {\n      await loadDict(\"zstd-dict-ru-v1\");\n      expect.fail(\"Expected WireCodecError to be thrown\");\n    } catch (e) {\n      expect(e).toBeInstanceOf(WireCodecError);\n      expect((e as WireCodecError).code).toBe(\"DICT_FETCH_FAILED\");\n    }\n    _resetLoaderForTesting();\n  });\n});\n"},"src/__tests__/dict-loader.test.ts":{"tests":[{"id":"125","name":"setDictLoader is called with the requested name and its result is returned"},{"id":"126","name":"setDictLoader result is cached — loader called only once for repeated requests"},{"id":"127","name":"setDictLoader evicting a cached dict forces the loader to be called again"},{"id":"128","name":"setDictLoader overriding the loader evicts the full cache"},{"id":"129","name":"setDictLoader concurrent calls share one loader invocation (in-flight dedup)"},{"id":"130","name":"setDictBaseUrl builds the correct URL and calls fetch"},{"id":"131","name":"setDictBaseUrl treats fetch non-ok status as a thrown error"},{"id":"132","name":"default loader (back-compat) hits /dicts/${name}.zstd when no loader is configured"},{"id":"133","name":"default loader (back-compat) back-compat: non-ok default fetch throws with the /dicts/ URL in message"},{"id":"134","name":"loader swap during in-flight fetch discards stale bytes and returns new-loader bytes on retry"}],"source":"// dict-loader.test.ts — tests for the pluggable DictLoader API (PR #2).\n//\n// Each test cleans up after itself via _resetLoaderForTesting() so that\n// module-level loader/cache state does not bleed across cases.\n\nimport { describe, it, expect, afterEach, vi } from 'vitest';\nimport {\n  type DictName,\n  loadDict,\n  getDictBytes,\n  setDictLoader,\n  setDictBaseUrl,\n  _evictDictForTesting,\n  _resetLoaderForTesting,\n} from '../dicts.ts';\n\n// Canned bytes used throughout these tests. 4 bytes chosen to be clearly\n// distinguishable from a real zstd dict without needing the wasm codec.\nconst CANNED = new Uint8Array([0xca, 0xfe, 0xba, 0xbe]);\n\nafterEach(() => {\n  _resetLoaderForTesting();\n});\n\ndescribe('setDictLoader', () => {\n  it('is called with the requested name and its result is returned', async () => {\n    const calls: DictName[] = [];\n    setDictLoader(async (name) => {\n      calls.push(name);\n      return CANNED;\n    });\n\n    const result = await loadDict('zstd-dict-ru-v1');\n    expect(calls).toEqual(['zstd-dict-ru-v1']);\n    expect(result).toEqual(CANNED);\n  });\n\n  it('result is cached — loader called only once for repeated requests', async () => {\n    let callCount = 0;\n    setDictLoader(async (_name) => {\n      callCount++;\n      return CANNED;\n    });\n\n    await loadDict('zstd-dict-fa-v1');\n    await loadDict('zstd-dict-fa-v1');\n    expect(callCount).toBe(1);\n    expect(getDictBytes('zstd-dict-fa-v1')).toEqual(CANNED);\n  });\n\n  it('evicting a cached dict forces the loader to be called again', async () => {\n    let callCount = 0;\n    setDictLoader(async (_name) => {\n      callCount++;\n      return CANNED;\n    });\n\n    await loadDict('zstd-dict-en-v1');\n    expect(callCount).toBe(1);\n\n    _evictDictForTesting('zstd-dict-en-v1');\n    expect(getDictBytes('zstd-dict-en-v1')).toBeUndefined();\n\n    await loadDict('zstd-dict-en-v1');\n    expect(callCount).toBe(2);\n  });\n\n  it('overriding the loader evicts the full cache', async () => {\n    // Seed the cache with the first loader.\n    setDictLoader(async (_name) => new Uint8Array([0x01]));\n    await loadDict('zstd-dict-ru-v1');\n    expect(getDictBytes('zstd-dict-ru-v1')).toBeDefined();\n\n    // Installing a new loader must evict the cached entry.\n    setDictLoader(async (_name) => CANNED);\n    expect(getDictBytes('zstd-dict-ru-v1')).toBeUndefined();\n\n    const result = await loadDict('zstd-dict-ru-v1');\n    expect(result).toEqual(CANNED);\n  });\n\n  it('concurrent calls share one loader invocation (in-flight dedup)', async () => {\n    let callCount = 0;\n    let resolve!: (v: Uint8Array) => void;\n    const pending = new Promise<"+"Uint8Array>((res) => {\n      resolve = res;\n    });\n    setDictLoader(async (_name) => {\n      callCount++;\n      return pending;\n    });\n\n    // Kick off 5 concurrent loads without awaiting yet.\n    const all = Promise.all([\n      loadDict('zstd-dict-ru-v1'),\n      loadDict('zstd-dict-ru-v1'),\n      loadDict('zstd-dict-ru-v1'),\n      loadDict('zstd-dict-ru-v1'),\n      loadDict('zstd-dict-ru-v1'),\n    ]);\n    resolve(CANNED);\n    const results = await all;\n\n    expect(callCount).toBe(1);\n    for (const r of results) {\n      expect(r).toEqual(CANNED);\n    }\n  });\n});\n\ndescribe('setDictBaseUrl', () => {\n  it('builds the correct URL and calls fetch', async () => {\n    const fetchedUrls: string[] = [];\n    const realFetch = globalThis.fetch;\n    globalThis.fetch = vi.fn(async (input: RequestInfo | URL): Promise<"+"Response> => {\n      const url = typeof input === 'string' ? input : input.toString();\n      fetchedUrls.push(url);\n      return new Response(CANNED, { status: 200 });\n    }) as typeof fetch;\n\n    try {\n      setDictBaseUrl('https://cdn.example.com/assets');\n      await loadDict('zstd-dict-ru-v1');\n      expect(fetchedUrls).toEqual(['https://cdn.example.com/assets/zstd-dict-ru-v1.zstd']);\n    } finally {\n      globalThis.fetch = realFetch;\n      _resetLoaderForTesting();\n    }\n  });\n\n  it('treats fetch non-ok status as a thrown error', async () => {\n    const realFetch = globalThis.fetch;\n    globalThis.fetch = vi.fn(async (): Promise<"+"Response> => {\n      return new Response(null, { status: 404 });\n    }) as typeof fetch;\n\n    try {\n      setDictBaseUrl('https://cdn.example.com/assets');\n      await expect(loadDict('zstd-dict-fa-v1')).rejects.toThrow('404');\n    } finally {\n      globalThis.fetch = realFetch;\n      _resetLoaderForTesting();\n    }\n  });\n});\n\ndescribe('default loader (back-compat)', () => {\n  it('hits /dicts/${name}.zstd when no loader is configured', async () => {\n    const fetchedUrls: string[] = [];\n    const realFetch = globalThis.fetch;\n    globalThis.fetch = vi.fn(async (input: RequestInfo | URL): Promise<"+"Response> => {\n      const url = typeof input === 'string' ? input : input.toString();\n      fetchedUrls.push(url);\n      return new Response(CANNED, { status: 200 });\n    }) as typeof fetch;\n\n    try {\n      // _resetLoaderForTesting already called in afterEach; loader is null here.\n      await loadDict('zstd-dict-en-v1');\n      expect(fetchedUrls).toEqual(['/dicts/zstd-dict-en-v1.zstd']);\n    } finally {\n      globalThis.fetch = realFetch;\n      _resetLoaderForTesting();\n    }\n  });\n\n  it('back-compat: non-ok default fetch throws with the /dicts/ URL in message', async () => {\n    const realFetch = globalThis.fetch;\n    globalThis.fetch = vi.fn(async (): Promise<"+"Response> => {\n      return new Response(null, { status: 503 });\n    }) as typeof fetch;\n\n    try {\n      await expect(loadDict('zstd-dict-ru-v1')).rejects.toThrow('/dicts/zstd-dict-ru-v1.zstd');\n    } finally {\n      globalThis.fetch = realFetch;\n      _resetLoaderForTesting();\n    }\n  });\n});\n\ndescribe('loader swap during in-flight fetch', () => {\n  it('discards stale bytes and returns new-loader bytes on retry', async () => {\n    const BYTES_A = new Uint8Array([0xaa, 0xaa]);\n    const BYTES_B = new Uint8Array([0xbb, 0xbb]);\n\n    // Loader A: pauses until we trigger resolveA.\n    let resolveA!: (b: Uint8Array) => void;\n    const aPromise = new Promise<"+"Uint8Array>((res) => { resolveA = res; });\n    setDictLoader(async (_name) => aPromise);\n\n    // Start load with loader A — do NOT await yet.\n    const firstLoad = loadDict('zstd-dict-ru-v1');\n\n    // While A is in-flight, install loader B and evict cache.\n    setDictLoader(async (_name) => BYTES_B);\n\n    // Now let A's fetch resolve.\n    resolveA(BYTES_A);\n\n    // The in-flight promise for A should reject with LOADER_SWAPPED_MID_FETCH.\n    await expect(firstLoad).rejects.toThrow('loader swapped during fetch');\n\n    // Cache must NOT contain A's stale bytes.\n    expect(getDictBytes('zstd-dict-ru-v1')).toBeUndefined();\n\n    // A fresh load uses loader B and caches B's bytes.\n    const secondLoad = await loadDict('zstd-dict-ru-v1');\n    expect(secondLoad).toEqual(BYTES_B);\n    expect(getDictBytes('zstd-dict-ru-v1')).toEqual(BYTES_B);\n  });\n});\n"},"src/__tests__/mesh-bundle.test.ts":{"tests":[{"id":"135","name":"encodeMeshBundle produces a bundle with correct magic + version + header layout"},{"id":"136","name":"encodeMeshBundle round-trips boundary tsSecOffset=0 and ttlHops=0"},{"id":"137","name":"encodeMeshBundle round-trips boundary tsSecOffset=1 (first second)"},{"id":"138","name":"encodeMeshBundle round-trips boundary tsSecOffset=3_153_600_000 (100 years)"},{"id":"139","name":"encodeMeshBundle round-trips boundary tsSecOffset=0xFFFFFFFF (u32::MAX seconds = ~136 years) and ttlHops=255"},{"id":"140","name":"encodeMeshBundle rejects tsSecOffset that is a float (0.5)"},{"id":"141","name":"encodeMeshBundle rejects tsSecOffset that is negative (-1)"},{"id":"142","name":"encodeMeshBundle rejects tsSecOffset > 0xFFFFFFFF (4294967296)"},{"id":"143","name":"encodeMeshBundle rejects tsSecOffset NaN"},{"id":"144","name":"encodeMeshBundle rejects tsSecOffset Infinity"},{"id":"145","name":"encodeMeshBundle rejects ttlHops > 255 (256)"},{"id":"146","name":"encodeMeshBundle rejects ttlHops <"+" 0 (-1)"},{"id":"147","name":"encodeMeshBundle rejects ttlHops that is a float (1.5)"},{"id":"148","name":"encodeMeshBundle rejects senderPubkey with wrong length using MESH_BUNDLE_FIELD_INVALID"},{"id":"149","name":"encodeMeshBundle rejects msgId with wrong length using MESH_BUNDLE_FIELD_INVALID"},{"id":"150","name":"encodeMeshBundle rejects channelIdHash with wrong length using MESH_BUNDLE_FIELD_INVALID"},{"id":"151","name":"encodeMeshBundle signature wrong length still uses MESH_BUNDLE_SIG_INVALID"},{"id":"152","name":"encodeMeshBundle rejects body exceeding 1500 B cap with MESH_BUNDLE_TOO_LARGE"},{"id":"153","name":"decodeMeshBundle round-trips a valid bundle"},{"id":"154","name":"decodeMeshBundle rejects bundle smaller than 125 B minimum (61 header + 0 body + 64 sig)"},{"id":"155","name":"decodeMeshBundle rejects wrong magic byte"},{"id":"156","name":"decodeMeshBundle rejects wrong version byte with MESH_BUNDLE_VERSION_UNSUPPORTED"},{"id":"157","name":"decodeMeshBundle rejects body_len that exceeds cap (9999 > 1500) with MESH_BUNDLE_TOO_LARGE"},{"id":"158","name":"decodeMeshBundle rejects bundle where body_len ≤ cap but total wire length mismatches with MESH_BUNDLE_TRUNCATED"},{"id":"159","name":"decodeMeshBundle meshBundleSignedRange throws MESH_BUNDLE_TRUNCATED on too-short wire"},{"id":"160","name":"decodeMeshBundle meshBundleSignedRange throws MESH_BUNDLE_TRUNCATED when bodyLen+61 > wire.length"},{"id":"161","name":"decodeMeshBundle meshBundleSignedRange returns correct slice on valid wire"}],"source":"import { describe, it, expect } from 'vitest';\nimport {\n  encodeMeshBundle,\n  decodeMeshBundle,\n  meshBundleSignedRange,\n  MESH_BUNDLE_MAGIC_V1,\n  MESH_BUNDLE_VERSION,\n  MESH_BUNDLE_HEADER_FIXED_LEN,\n  MESH_BUNDLE_SIG_LEN,\n} from '../mesh-bundle.ts';\nimport { WireCodecError } from '../errors.ts';\n\nconst PUBKEY = new Uint8Array(32).fill(0xaa);\nconst MSG_ID = new Uint8Array(16).fill(0xbb);\nconst SIG = new Uint8Array(64).fill(0xcc);\nconst CHANNEL_HASH = new Uint8Array([0x12, 0x34, 0x56, 0x78]);\nconst TS_OFFSET = 1_234_567; // seconds since ROOM_EPOCH\n\n// ---------------------------------------------------------------------------\n// encodeMeshBundle — happy path\n// ---------------------------------------------------------------------------\ndescribe('encodeMeshBundle', () => {\n  it('produces a bundle with correct magic + version + header layout', () => {\n    const body = new Uint8Array([0xc6, 0x00, 0x01, 0x02]);\n    const bundle = encodeMeshBundle({\n      senderPubkey: PUBKEY,\n      msgId: MSG_ID,\n      tsSecOffset: TS_OFFSET,\n      ttlHops: 7,\n      channelIdHash: CHANNEL_HASH,\n      body,\n      signature: SIG,\n    });\n    // Frame fixed overhead = 125 B (header 61 + sig 64)\n    expect(bundle[0]).toBe(MESH_BUNDLE_MAGIC_V1);\n    expect(bundle[1]).toBe(MESH_BUNDLE_VERSION);\n    expect(bundle.length).toBe(MESH_BUNDLE_HEADER_FIXED_LEN + body.length + MESH_BUNDLE_SIG_LEN);\n    // sender_pubkey starts at offset 2\n    expect(Array.from(bundle.slice(2, 34))).toEqual(Array.from(PUBKEY));\n    // msg_id at offset 34\n    expect(Array.from(bundle.slice(34, 50))).toEqual(Array.from(MSG_ID));\n    // signature at the tail\n    expect(Array.from(bundle.slice(bundle.length - 64))).toEqual(Array.from(SIG));\n  });\n\n  it('round-trips boundary tsSecOffset=0 and ttlHops=0', () => {\n    const body = new Uint8Array([0x01]);\n    const wire = encodeMeshBundle({\n      senderPubkey: PUBKEY,\n      msgId: MSG_ID,\n      tsSecOffset: 0,\n      ttlHops: 0,\n      channelIdHash: CHANNEL_HASH,\n      body,\n      signature: SIG,\n    });\n    const decoded = decodeMeshBundle(wire);\n    expect(decoded.tsSecOffset).toBe(0);\n    expect(decoded.ttlHops).toBe(0);\n  });\n\n  it('round-trips boundary tsSecOffset=1 (first second)', () => {\n    const body = new Uint8Array([0x01]);\n    const wire = encodeMeshBundle({\n      senderPubkey: PUBKEY,\n      msgId: MSG_ID,\n      tsSecOffset: 1,\n      ttlHops: 1,\n      channelIdHash: CHANNEL_HASH,\n      body,\n      signature: SIG,\n    });\n    const decoded = decodeMeshBundle(wire);\n    expect(decoded.tsSecOffset).toBe(1);\n  });\n\n  it('round-trips boundary tsSecOffset=3_153_600_000 (100 years)', () => {\n    // 100 years * 365.25 days/yr * 86400 s/day = 3_155_760_000 s\n    // Use 3_153_600_000 (100 years * 365 days * 86400 s) to stay within u32::MAX\n    const hundredYearsInSeconds = 3_153_600_000;\n    const body = new Uint8Array([0x01]);\n    const wire = encodeMeshBundle({\n      senderPubkey: PUBKEY,\n      msgId: MSG_ID,\n      tsSecOffset: hundredYearsInSeconds,\n      ttlHops: 7,\n      channelIdHash: CHANNEL_HASH,\n      body,\n      signature: SIG,\n    });\n    const decoded = decodeMeshBundle(wire);\n    expect(decoded.tsSecOffset).toBe(hundredYearsInSeconds);\n  });\n\n  it('round-trips boundary tsSecOffset=0xFFFFFFFF (u32::MAX seconds = ~136 years) and ttlHops=255', () => {\n    const body = new Uint8Array([0x01]);\n    const wire = encodeMeshBundle({\n      senderPubkey: PUBKEY,\n      msgId: MSG_ID,\n      tsSecOffset: 0xffffffff,\n      ttlHops: 255,\n      channelIdHash: CHANNEL_HASH,\n      body,\n      signature: SIG,\n    });\n    const decoded = decodeMeshBundle(wire);\n    expect(decoded.tsSecOffset).toBe(0xffffffff);\n    expect(decoded.ttlHops).toBe(255);\n  });\n\n  // -------------------------------------------------------------------------\n  // BLOCKER #1 — tsSecOffset validation (MESH_BUNDLE_FIELD_INVALID)\n  // -------------------------------------------------------------------------\n  it('rejects tsSecOffset that is a float (0.5)', () => {\n    expect(() => encodeMeshBundle({\n      senderPubkey: PUBKEY, msgId: MSG_ID, tsSecOffset: 0.5, ttlHops: 7,\n      channelIdHash: CHANNEL_HASH, body: new Uint8Array([0x01]), signature: SIG,\n    })).toThrow(expect.objectContaining({ code: 'MESH_BUNDLE_FIELD_INVALID' }));\n  });\n\n  it('rejects tsSecOffset that is negative (-1)', () => {\n    expect(() => encodeMeshBundle({\n      senderPubkey: PUBKEY, msgId: MSG_ID, tsSecOffset: -1, ttlHops: 7,\n      channelIdHash: CHANNEL_HASH, body: new Uint8Array([0x01]), signature: SIG,\n    })).toThrow(expect.objectContaining({ code: 'MESH_BUNDLE_FIELD_INVALID' }));\n  });\n\n  it('rejects tsSecOffset > 0xFFFFFFFF (4294967296)', () => {\n    expect(() => encodeMeshBundle({\n      senderPubkey: PUBKEY, msgId: MSG_ID, tsSecOffset: 4294967296, ttlHops: 7,\n      channelIdHash: CHANNEL_HASH, body: new Uint8Array([0x01]), signature: SIG,\n    })).toThrow(expect.objectContaining({ code: 'MESH_BUNDLE_FIELD_INVALID' }));\n  });\n\n  it('rejects tsSecOffset NaN', () => {\n    expect(() => encodeMeshBundle({\n      senderPubkey: PUBKEY, msgId: MSG_ID, tsSecOffset: NaN, ttlHops: 7,\n      channelIdHash: CHANNEL_HASH, body: new Uint8Array([0x01]), signature: SIG,\n    })).toThrow(expect.objectContaining({ code: 'MESH_BUNDLE_FIELD_INVALID' }));\n  });\n\n  it('rejects tsSecOffset Infinity', () => {\n    expect(() => encodeMeshBundle({\n      senderPubkey: PUBKEY, msgId: MSG_ID, tsSecOffset: Infinity, ttlHops: 7,\n      channelIdHash: CHANNEL_HASH, body: new Uint8Array([0x01]), signature: SIG,\n    })).toThrow(expect.objectContaining({ code: 'MESH_BUNDLE_FIELD_INVALID' }));\n  });\n\n  it('rejects ttlHops > 255 (256)', () => {\n    expect(() => encodeMeshBundle({\n      senderPubkey: PUBKEY, msgId: MSG_ID, tsSecOffset: TS_OFFSET, ttlHops: 256,\n      channelIdHash: CHANNEL_HASH, body: new Uint8Array([0x01]), signature: SIG,\n    })).toThrow(expect.objectContaining({ code: 'MESH_BUNDLE_FIELD_INVALID' }));\n  });\n\n  it('rejects ttlHops <"+" 0 (-1)', () => {\n    expect(() => encodeMeshBundle({\n      senderPubkey: PUBKEY, msgId: MSG_ID, tsSecOffset: TS_OFFSET, ttlHops: -1,\n      channelIdHash: CHANNEL_HASH, body: new Uint8Array([0x01]), signature: SIG,\n    })).toThrow(expect.objectContaining({ code: 'MESH_BUNDLE_FIELD_INVALID' }));\n  });\n\n  it('rejects ttlHops that is a float (1.5)', () => {\n    expect(() => encodeMeshBundle({\n      senderPubkey: PUBKEY, msgId: MSG_ID, tsSecOffset: TS_OFFSET, ttlHops: 1.5,\n      channelIdHash: CHANNEL_HASH, body: new Uint8Array([0x01]), signature: SIG,\n    })).toThrow(expect.objectContaining({ code: 'MESH_BUNDLE_FIELD_INVALID' }));\n  });\n\n  // -------------------------------------------------------------------------\n  // MAJOR #5 — non-sig fixed-array fields use MESH_BUNDLE_FIELD_INVALID\n  // -------------------------------------------------------------------------\n  it('rejects senderPubkey with wrong length using MESH_BUNDLE_FIELD_INVALID', () => {\n    expect(() => encodeMeshBundle({\n      senderPubkey: new Uint8Array(31), msgId: MSG_ID, tsSecOffset: TS_OFFSET, ttlHops: 7,\n      channelIdHash: CHANNEL_HASH, body: new Uint8Array([0x01]), signature: SIG,\n    })).toThrow(expect.objectContaining({ code: 'MESH_BUNDLE_FIELD_INVALID' }));\n  });\n\n  it('rejects msgId with wrong length using MESH_BUNDLE_FIELD_INVALID', () => {\n    expect(() => encodeMeshBundle({\n      senderPubkey: PUBKEY, msgId: new Uint8Array(15), tsSecOffset: TS_OFFSET, ttlHops: 7,\n      channelIdHash: CHANNEL_HASH, body: new Uint8Array([0x01]), signature: SIG,\n    })).toThrow(expect.objectContaining({ code: 'MESH_BUNDLE_FIELD_INVALID' }));\n  });\n\n  it('rejects channelIdHash with wrong length using MESH_BUNDLE_FIELD_INVALID', () => {\n    expect(() => encodeMeshBundle({\n      senderPubkey: PUBKEY, msgId: MSG_ID, tsSecOffset: TS_OFFSET, ttlHops: 7,\n      channelIdHash: new Uint8Array(3), body: new Uint8Array([0x01]), signature: SIG,\n    })).toThrow(expect.objectContaining({ code: 'MESH_BUNDLE_FIELD_INVALID' }));\n  });\n\n  it('signature wrong length still uses MESH_BUNDLE_SIG_INVALID', () => {\n    expect(() => encodeMeshBundle({\n      senderPubkey: PUBKEY, msgId: MSG_ID, tsSecOffset: TS_OFFSET, ttlHops: 7,\n      channelIdHash: CHANNEL_HASH, body: new Uint8Array([0x01]), signature: new Uint8Array(63),\n    })).toThrow(expect.objectContaining({ code: 'MESH_BUNDLE_SIG_INVALID' }));\n  });\n\n  it('rejects body exceeding 1500 B cap with MESH_BUNDLE_TOO_LARGE', () => {\n    const body = new Uint8Array(1501);\n    expect(() => encodeMeshBundle({\n      senderPubkey: PUBKEY, msgId: MSG_ID, tsSecOffset: TS_OFFSET, ttlHops: 7,\n      channelIdHash: CHANNEL_HASH, body, signature: SIG,\n    })).toThrow(expect.objectContaining({ code: 'MESH_BUNDLE_TOO_LARGE' }));\n  });\n});\n\n// ---------------------------------------------------------------------------\n// decodeMeshBundle\n// ---------------------------------------------------------------------------\ndescribe('decodeMeshBundle', () => {\n  it('round-trips a valid bundle', () => {\n    const body = new Uint8Array([0xc6, 0x00, 0x01, 0x02]);\n    const wire = encodeMeshBundle({\n      senderPubkey: PUBKEY,\n      msgId: MSG_ID,\n      tsSecOffset: TS_OFFSET,\n      ttlHops: 7,\n      channelIdHash: CHANNEL_HASH,\n      body,\n      signature: SIG,\n    });\n    const decoded = decodeMeshBundle(wire);\n    expect(decoded.senderPubkey).toEqual(PUBKEY);\n    expect(decoded.msgId).toEqual(MSG_ID);\n    expect(decoded.tsSecOffset).toBe(TS_OFFSET);\n    expect(decoded.ttlHops).toBe(7);\n    expect(decoded.body).toEqual(body);\n    expect(decoded.signature).toEqual(SIG);\n  });\n\n  // -------------------------------------------------------------------------\n  // MINOR #7 — min is 125 B (61 header + 0 body + 64 sig), not 189 B\n  // -------------------------------------------------------------------------\n  it('rejects bundle smaller than 125 B minimum (61 header + 0 body + 64 sig)', () => {\n    const tooShort = new Uint8Array(100);\n    tooShort[0] = MESH_BUNDLE_MAGIC_V1;\n    expect(() => decodeMeshBundle(tooShort)).toThrow(\n      expect.objectContaining({ code: 'MESH_BUNDLE_TRUNCATED' }),\n    );\n  });\n\n  it('rejects wrong magic byte', () => {\n    const wrongMagic = new Uint8Array(200);\n    wrongMagic[0] = 0xcc; // not 0xC9\n    expect(() => decodeMeshBundle(wrongMagic)).toThrow(\n      expect.objectContaining({ code: 'UNKNOWN_MAGIC' }),\n    );\n  });\n\n  // -------------------------------------------------------------------------\n  // MINOR #8 — version mismatch → MESH_BUNDLE_VERSION_UNSUPPORTED not UNKNOWN_MAGIC\n  // -------------------------------------------------------------------------\n  it('rejects wrong version byte with MESH_BUNDLE_VERSION_UNSUPPORTED', () => {\n    // Build a bundle with correct magic but wrong version\n    const body = new Uint8Array([0x01]);\n    const wire = encodeMeshBundle({\n      senderPubkey: PUBKEY, msgId: MSG_ID, tsSecOffset: TS_OFFSET, ttlHops: 7,\n      channelIdHash: CHANNEL_HASH, body, signature: SIG,\n    });\n    wire[1] = 0x02; // tamper version\n    expect(() => decodeMeshBundle(wire)).toThrow(\n      expect.objectContaining({ code: 'MESH_BUNDLE_VERSION_UNSUPPORTED' }),\n    );\n  });\n\n  // -------------------------------------------------------------------------\n  // MAJOR #2 — body_len > MAX_BODY cap path (separate test for cap violation)\n  // -------------------------------------------------------------------------\n  it('rejects body_len that exceeds cap (9999 > 1500) with MESH_BUNDLE_TOO_LARGE', () => {\n    const bundle = new Uint8Array(200);\n    bundle[0] = MESH_BUNDLE_MAGIC_V1;\n    bundle[1] = MESH_BUNDLE_VERSION;\n    // body_len = 9999 at offsets 59-60 big-endian\n    bundle[59] = 0x27;\n    bundle[60] = 0x0f;\n    expect(() => decodeMeshBundle(bundle)).toThrow(\n      expect.objectContaining({ code: 'MESH_BUNDLE_TOO_LARGE' }),\n    );\n  });\n\n  // -------------------------------------------------------------------------\n  // MAJOR #2 — body_len ≤ MAX_BODY but declared length mismatches wire length\n  // body_len=200 encoded, but wire is only 189 B (<"+" 325 B that 200-byte body requires)\n  // -------------------------------------------------------------------------\n  it('rejects bundle where body_len ≤ cap but total wire length mismatches with MESH_BUNDLE_TRUNCATED', () => {\n    // body_len=200: expectedTotal = 61+200+64 = 325 B, but wire is only 189 B\n    const bundle = new Uint8Array(189);\n    bundle[0] = MESH_BUNDLE_MAGIC_V1;\n    bundle[1] = MESH_BUNDLE_VERSION;\n    // body_len = 200 = 0x00C8\n    bundle[59] = 0x00;\n    bundle[60] = 0xc8;\n    expect(() => decodeMeshBundle(bundle)).toThrow(\n      expect.objectContaining({ code: 'MESH_BUNDLE_TRUNCATED' }),\n    );\n  });\n\n  // -------------------------------------------------------------------------\n  // MAJOR #4 — meshBundleSignedRange without bounds check is unsafe; but\n  // decodeMeshBundle validates first, so test signedRange on a valid bundle\n  // and separately on a truncated wire that bypasses decode.\n  // -------------------------------------------------------------------------\n  it('meshBundleSignedRange throws MESH_BUNDLE_TRUNCATED on too-short wire', () => {\n    const tooShort = new Uint8Array(60); // shorter than HEADER_FIXED_LEN+SIG_LEN\n    expect(() => meshBundleSignedRange(tooShort)).toThrow(\n      expect.objectContaining({ code: 'MESH_BUNDLE_TRUNCATED' }),\n    );\n  });\n\n  it('meshBundleSignedRange throws MESH_BUNDLE_TRUNCATED when bodyLen+61 > wire.length', () => {\n    // wire passes min-length check (≥125) but body_len declared is 100,\n    // so bodyLen+61 = 161 > wire.length = 130\n    const wire = new Uint8Array(130);\n    wire[0] = MESH_BUNDLE_MAGIC_V1;\n    wire[1] = MESH_BUNDLE_VERSION;\n    wire[59] = 0x00;\n    wire[60] = 100; // body_len=100 → need 61+100=161 bytes for signed range\n    expect(() => meshBundleSignedRange(wire)).toThrow(\n      expect.objectContaining({ code: 'MESH_BUNDLE_TRUNCATED' }),\n    );\n  });\n\n  it('meshBundleSignedRange returns correct slice on valid wire', () => {\n    const body = new Uint8Array([0xc6, 0x00]);\n    const wire = encodeMeshBundle({\n      senderPubkey: PUBKEY, msgId: MSG_ID, tsSecOffset: TS_OFFSET, ttlHops: 7,\n      channelIdHash: CHANNEL_HASH, body, signature: SIG,\n    });\n    const signed = meshBundleSignedRange(wire);\n    expect(signed.length).toBe(MESH_BUNDLE_HEADER_FIXED_LEN + body.length);\n    expect(signed[0]).toBe(MESH_BUNDLE_MAGIC_V1);\n  });\n});\n"},"src/__tests__/envelope-v2-forward-compat.test.ts":{"tests":[{"id":"162","name":"fromV2 — forward-compat unknown-kind sentinel returns sentinel for k=0x7F (unallocated byte)"},{"id":"163","name":"fromV2 — forward-compat unknown-kind sentinel sentinel result still includes decoded id and ts fields"},{"id":"164","name":"fromV2 — forward-compat unknown-kind sentinel returns sentinel for another unallocated byte k=0xFE"},{"id":"165","name":"fromV2 / toV2 — known-kind round-trips chat-msg round-trips unchanged"},{"id":"166","name":"fromV2 / toV2 — known-kind round-trips chat-edit round-trips unchanged"},{"id":"167","name":"fromV2 / toV2 — known-kind round-trips all known kinds in KIND_TO_BYTE round-trip without raw"},{"id":"168","name":"toV2 — send-side rejection of chat-unknown-future toV2 throws at runtime when given kind=chat-unknown-future"},{"id":"169","name":"fromV2 — corrupt frame (non-numeric k) must throw throws with descriptive message when k is null"},{"id":"170","name":"fromV2 — corrupt frame (non-numeric k) must throw throws with descriptive message when k is a string"},{"id":"171","name":"fromV2 — corrupt frame (non-numeric k) must throw throws with descriptive message when k is missing (undefined)"},{"id":"172","name":"fromV2 — corrupt frame (non-numeric k) must throw does NOT throw for a numeric unknown k — returns sentinel instead"}],"source":"// Tests for T3 — forward-compat unknown-kind sentinel in fromV2.\n//\n// Design:\n//   - fromV2 must NOT throw when it encounters a k byte not in KIND_TO_BYTE.\n//   - It must return { kind: \"chat-unknown-future\", raw: k, ... }.\n//   - Known kinds must still round-trip through toV2 / fromV2 unchanged.\n//   - toV2 must reject \"chat-unknown-future\" at the type level (and runtime).\n\nimport { describe, it, expect } from \"vitest\";\nimport {\n\tfromV2,\n\ttoV2,\n\tROOM_EPOCH,\n\tKIND_TO_BYTE,\n} from \"../envelope-v2.ts\";\n\n/** Build a minimal valid v2-shape object for a given k byte. */\nfunction makeV2Object(k: number, overrides: Record<"+"string, unknown> = {}): Record<"+"string, unknown> {\n\treturn {\n\t\tv: 2,\n\t\tk,\n\t\tid: new Uint8Array(16).fill(0xab),\n\t\tts: 1000,\n\t\tfrom: \"deadbeef\".repeat(8),\n\t\tbody: \"hello\",\n\t\t...overrides,\n\t};\n}\n\ndescribe(\"fromV2 — forward-compat unknown-kind sentinel\", () => {\n\tit(\"returns sentinel for k=0x7F (unallocated byte)\", () => {\n\t\tconst v2 = makeV2Object(0x7f);\n\t\t// RED: should NOT throw — currently throws \"unknown kind enum 0x7f\"\n\t\tconst result = fromV2(v2);\n\t\texpect(result.kind).toBe(\"chat-unknown-future\");\n\t\texpect(result.raw).toBe(0x7f);\n\t});\n\n\tit(\"sentinel result still includes decoded id and ts fields\", () => {\n\t\tconst v2 = makeV2Object(0x7f);\n\t\tconst result = fromV2(v2);\n\t\texpect(result.kind).toBe(\"chat-unknown-future\");\n\t\texpect(result.raw).toBe(0x7f);\n\t\t// id should be decoded to UUID string\n\t\texpect(typeof result.id).toBe(\"string\");\n\t\texpect((result.id as string).length).toBe(36);\n\t\t// ts should be absolute (delta + ROOM_EPOCH)\n\t\texpect(result.ts).toBe(1000 + ROOM_EPOCH);\n\t});\n\n\tit(\"returns sentinel for another unallocated byte k=0xFE\", () => {\n\t\tconst v2 = makeV2Object(0xfe);\n\t\tconst result = fromV2(v2);\n\t\texpect(result.kind).toBe(\"chat-unknown-future\");\n\t\texpect(result.raw).toBe(0xfe);\n\t});\n});\n\ndescribe(\"fromV2 / toV2 — known-kind round-trips\", () => {\n\tit(\"chat-msg round-trips unchanged\", () => {\n\t\tconst id = \"12345678-1234-1234-1234-123456789abc\";\n\t\tconst ts = ROOM_EPOCH + 5000;\n\t\tconst original: Record<"+"string, unknown> = {\n\t\t\tv: 1,\n\t\t\tid,\n\t\t\tts,\n\t\t\tfrom: \"peer1\",\n\t\t\tkind: \"chat-msg\",\n\t\t\tbody: \"hi\",\n\t\t};\n\t\tconst v2 = toV2(original);\n\t\tconst restored = fromV2(v2);\n\t\texpect(restored.kind).toBe(\"chat-msg\");\n\t\texpect(restored.id).toBe(id);\n\t\texpect(restored.ts).toBe(ts);\n\t\texpect(restored.body).toBe(\"hi\");\n\t\texpect(restored.v).toBe(1);\n\t\texpect(restored.raw).toBeUndefined();\n\t});\n\n\tit(\"chat-edit round-trips unchanged\", () => {\n\t\tconst id = \"aaaabbbb-cccc-dddd-eeee-ffffffffffff\";\n\t\tconst ts = ROOM_EPOCH + 10000;\n\t\tconst original: Record<"+"string, unknown> = {\n\t\t\tv: 1,\n\t\t\tid,\n\t\t\tts,\n\t\t\tfrom: \"peer2\",\n\t\t\tkind: \"chat-edit\",\n\t\t\tbody: \"edited text\",\n\t\t};\n\t\tconst v2 = toV2(original);\n\t\tconst restored = fromV2(v2);\n\t\texpect(restored.kind).toBe(\"chat-edit\");\n\t\texpect(restored.id).toBe(id);\n\t\texpect(restored.ts).toBe(ts);\n\t\texpect(restored.raw).toBeUndefined();\n\t});\n\n\tit(\"all known kinds in KIND_TO_BYTE round-trip without raw\", () => {\n\t\tconst id = \"00000000-0000-0000-0000-000000000001\";\n\t\tconst ts = ROOM_EPOCH + 1;\n\t\tfor (const kind of Object.keys(KIND_TO_BYTE)) {\n\t\t\tconst original: Record<"+"string, unknown> = { v: 1, id, ts, from: \"x\", kind };\n\t\t\tconst v2 = toV2(original);\n\t\t\tconst restored = fromV2(v2);\n\t\t\texpect(restored.kind).toBe(kind);\n\t\t\texpect(restored.raw).toBeUndefined();\n\t\t}\n\t});\n});\n\ndescribe(\"toV2 — send-side rejection of chat-unknown-future\", () => {\n\tit(\"toV2 throws at runtime when given kind=chat-unknown-future\", () => {\n\t\tconst id = \"12345678-1234-1234-1234-123456789abc\";\n\t\tconst ts = ROOM_EPOCH + 1;\n\t\t// Runtime guard: toV2 throws for kind not in KIND_TO_BYTE (incl. \"chat-unknown-future\")\n\t\texpect(() => toV2({ v: 1, id, ts, from: \"x\", kind: \"chat-unknown-future\" })).toThrow();\n\t});\n});\n\ndescribe(\"fromV2 — corrupt frame (non-numeric k) must throw\", () => {\n\tit(\"throws with descriptive message when k is null\", () => {\n\t\tconst v2 = makeV2Object(0x01, { k: null });\n\t\texpect(() => fromV2(v2)).toThrow(/missing or non-numeric kind byte/);\n\t});\n\n\tit(\"throws with descriptive message when k is a string\", () => {\n\t\tconst v2 = makeV2Object(0x01, { k: \"chat-msg\" });\n\t\texpect(() => fromV2(v2)).toThrow(/missing or non-numeric kind byte/);\n\t});\n\n\tit(\"throws with descriptive message when k is missing (undefined)\", () => {\n\t\tconst v2 = makeV2Object(0x01, { k: undefined });\n\t\texpect(() => fromV2(v2)).toThrow(/missing or non-numeric kind byte/);\n\t});\n\n\tit(\"does NOT throw for a numeric unknown k — returns sentinel instead\", () => {\n\t\t// Regression guard: ensure the throw path is narrow (non-numeric only).\n\t\t// Numeric unknown k is the forward-compat scenario; it must NOT throw.\n\t\tconst v2 = makeV2Object(0x7f);\n\t\texpect(() => fromV2(v2)).not.toThrow();\n\t\texpect(fromV2(v2).kind).toBe(\"chat-unknown-future\");\n\t});\n});\n"},"src/__tests__/brands.test.ts":{"tests":[{"id":"173","name":"brands asWireBytes lifts raw bytes — runtime is identical to Uint8Array"},{"id":"174","name":"brands asSealedBytes lifts raw bytes — runtime is identical to Uint8Array"},{"id":"175","name":"brands asWireBytes returns the same object reference (no copy)"},{"id":"176","name":"brands asHttpWireBytes lifts raw bytes — runtime is identical to Uint8Array"},{"id":"177","name":"brands encodeHttpBody return type is HttpWireBytes — compile-time-only check"}],"source":"import { describe, it, expect } from \"vitest\";\nimport {\n  asWireBytes,\n  asHttpWireBytes,\n  asSealedBytes,\n  encode,\n  decode,\n  encodeHttpBody,\n  decodeHttpBody,\n} from \"../index.js\";\nimport type { WireBytes, HttpWireBytes, SealedBytes } from \"../index.js\";\n\n// Type-level assertion: raw Uint8Array MUST NOT be assignable to HttpWireBytes.\n// The @ts-expect-error directive below is the compile-time gate.\n// If this directive becomes a NO-OP (tsc no longer sees an error), the\n// brand has been weakened and the test file will fail to typecheck.\n//\n// Wrapped in a never-called function so vitest doesn't execute the call\n// at module load (a raw 0x7B byte routes to JSON.parse which would throw).\nfunction _typeAssertions(): void {\n  // @ts-expect-error — raw Uint8Array cannot be passed where HttpWireBytes is required\n  decodeHttpBody(new Uint8Array([0x7b]));\n\n  // Also verify SealedBytes is a distinct brand from WireBytes:\n  // @ts-expect-error — SealedBytes cannot be passed where WireBytes is required\n  const _wb: WireBytes = new Uint8Array([0]) as SealedBytes;\n  void _wb;\n\n  // BUG #4 / B4 fitness function: encode() (peer, cbor+zstd) and\n  // encodeHttpBody() (SDK-HTTP, zstd-of-JSON) share the 0xC7 magic byte but\n  // are binary-incompatible. Before the brand split, both returned the same\n  // WireBytes type and either could silently feed the other's decoder.\n  // These two directives are the regression guard: if HttpWireBytes and\n  // WireBytes are ever merged back into one brand, both lines below stop\n  // erroring and the @ts-expect-error directives fail the typecheck.\n  // @ts-expect-error — HttpWireBytes (encodeHttpBody output) cannot be passed to decode() (expects WireBytes)\n  decode(encodeHttpBody(new Uint8Array([0x7b, 0x7d])));\n  // @ts-expect-error — WireBytes (encode output) cannot be passed to decodeHttpBody() (expects HttpWireBytes)\n  decodeHttpBody(encode({}));\n}\nvoid _typeAssertions; // suppress \"unused\" warnings\n\ndescribe(\"brands\", () => {\n  it(\"asWireBytes lifts raw bytes — runtime is identical to Uint8Array\", () => {\n    const raw = new Uint8Array([0x7b, 0x7d]);\n    const lifted = asWireBytes(raw);\n    expect(lifted instanceof Uint8Array).toBe(true);\n    expect(lifted.length).toBe(2);\n    expect(lifted[0]).toBe(0x7b);\n    expect(lifted[1]).toBe(0x7d);\n  });\n\n  it(\"asSealedBytes lifts raw bytes — runtime is identical to Uint8Array\", () => {\n    const raw = new Uint8Array([0x01, 0x02, 0x03]);\n    const lifted = asSealedBytes(raw);\n    expect(lifted instanceof Uint8Array).toBe(true);\n    expect(lifted.length).toBe(3);\n  });\n\n  it(\"asWireBytes returns the same object reference (no copy)\", () => {\n    const raw = new Uint8Array([0xc6]);\n    const lifted = asWireBytes(raw);\n    // Brand is phantom — same backing buffer, no allocation.\n    expect(lifted.buffer).toBe(raw.buffer);\n  });\n\n  it(\"asHttpWireBytes lifts raw bytes — runtime is identical to Uint8Array\", () => {\n    const raw = new Uint8Array([0xc7, 0x00, 0x01]);\n    const lifted = asHttpWireBytes(raw);\n    expect(lifted instanceof Uint8Array).toBe(true);\n    expect(lifted.length).toBe(3);\n  });\n\n  it(\"encodeHttpBody return type is HttpWireBytes — compile-time-only check\", () => {\n    // Never-called helper proves the return type at compile time.\n    // tsc will error if encodeHttpBody doesn't return HttpWireBytes.\n    function _compileCheck(): void {\n      const out = encodeHttpBody(new Uint8Array([0x7b, 0x7d]));\n      const _typed: HttpWireBytes = out;\n      void _typed;\n    }\n    void _compileCheck;\n    // Runtime: verify asHttpWireBytes is a zero-cost identity.\n    const raw = new Uint8Array([0x7b, 0x7d]);\n    const wb = asHttpWireBytes(raw);\n    expect(wb.length).toBe(2);\n  });\n});\n"}},"projectRoot":"/home/krolik/.claude-worktrees/wire-optim-roadmap/packages/wire-codec","config":{"$schema":"./node_modules/@stryker-mutator/core/schema/stryker-schema.json","_comment":"Mutation testing for @oxpulse/wire-codec — CBOR+zstd envelope codec, mesh bundles, brands. Non-blocking baseline.","packageManager":"pnpm","testRunner":"vitest","plugins":["@stryker-mutator/vitest-runner","@stryker-mutator/typescript-checker"],"checkers":["typescript"],"tsconfigFile":"tsconfig.json","typescriptChecker":{"prioritizePerformanceOverAccuracy":true},"coverageAnalysis":"perTest","ignoreStatic":true,"incremental":true,"incrementalFile":"reports/stryker-incremental.json","
