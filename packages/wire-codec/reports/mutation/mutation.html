rt":{"column":21,"line":892}}},{"id":"634","mutatorName":"BlockStatement","replacement":"{}","statusReason":"expected 1 to be 2 // Object.is equality","status":"Killed","static":false,"testsCompleted":1,"killedBy":["39"],"coveredBy":["39","51"],"location":{"end":{"column":4,"line":894},"start":{"column":37,"line":892}}},{"id":"635","mutatorName":"ConditionalExpression","replacement":"true","statusReason":"expected 2 to be 1 // Object.is equality","status":"Killed","static":false,"testsCompleted":1,"killedBy":["39"],"coveredBy":["39","51"],"location":{"end":{"column":76,"line":893},"start":{"column":9,"line":893}}},{"id":"636","mutatorName":"ConditionalExpression","replacement":"false","statusReason":"expected 1 to be 2 // Object.is equality","status":"Killed","static":false,"testsCompleted":1,"killedBy":["39"],"coveredBy":["39","51"],"location":{"end":{"column":76,"line":893},"start":{"column":9,"line":893}}},{"id":"637","mutatorName":"MethodExpression","replacement":"othersCaps.some(peer => peer.includes(\"envelope-v2\" as WireCap))","statusReason":"expected 2 to be 1 // Object.is equality","status":"Killed","static":false,"testsCompleted":1,"killedBy":["39"],"coveredBy":["39","51"],"location":{"end":{"column":76,"line":893},"start":{"column":9,"line":893}}},{"id":"638","mutatorName":"ArrowFunction","replacement":"() => undefined","statusReason":"expected 1 to be 2 // Object.is equality","status":"Killed","static":false,"testsCompleted":1,"killedBy":["39"],"coveredBy":["39","51"],"location":{"end":{"column":75,"line":893},"start":{"column":26,"line":893}}}],"source":"// wire-codec.ts — binary wire codec with JSON/CBOR/zstd auto-detection.\n//\n// Encoder paths (selected via opts):\n//   {} (default)              → JSON (legacy default)\n//   { cbor: true }            → bare CBOR\n//   { cbor: true, zstd: true} → zstd-of-CBOR, prefixed with magic byte 0xC6\n//   { cbor:true, zstd:true, dict:'zstd-dict-ru-v1' }\n//                             → zstd-of-CBOR with shared dict, prefixed 0xC7 0x01\n//                               (Phase 2.E.B; falls back to 0xC6 if dict not loaded)\n//\n// Decoder routes by first byte:\n//   0x7B '{' or 0x5B '['      → JSON (legacy / bare arrays/objects)\n//   0xC6                      → zstd-of-CBOR dictless (strip 1B, decompress, decode)\n//   0xC7                      → zstd-of-CBOR with dict (strip 2B incl. dict-id)\n//   else                      → bare CBOR\n//\n// Magic byte 0xC6 chosen because:\n//   - It is an unassigned CBOR tag (major type 6, additional info 6).\n//   - Top-level chat envelopes are maps, whose CBOR header is 0xA0–0xBB\n//     (small map) or 0xB8/0xB9 (longer maps). Verified empirically on\n//     representative envelopes — first byte falls in 0xA0–0xBB range.\n//   - JSON top bytes are 0x7B / 0x5B. No collision.\n//\n// Async init: zstd-wasm requires `await ensureWireCodecReady()` once at app\n// boot before encoding/decoding zstd payloads. Until ready, encode() with\n// zstd:true throws; decode() of a zstd-prefixed payload throws.\n//\n// Shared dictionary registry lives in `wire-dicts.ts` (split out per FOLLOWUPS\n// #12.5 once Phase 2.E.C/D added FA + EN dicts). DictName is orthogonal to\n// WireCap — dict selection is a sub-option of the cbor+zstd cap, negotiated\n// independently in negotiateDict.\n\n// cbor-x/index-no-eval: same API as cbor-x but omits the `new Function('')`\n// probe and compiled-decoder paths that trigger CSP script-src violations.\n// See: https://github.com/kriszyp/cbor-x#no-eval-build\nimport { Encoder as CborEncoder, decode as cborDecode } from \"cbor-x/index-no-eval\";\nimport {\n  init as zstdInit,\n  compress as zstdCompress,\n  decompress as zstdDecompress,\n  createCCtx,\n  createDCtx,\n  compressUsingDict,\n  decompressUsingDict,\n} from \"@bokuweb/zstd-wasm\";\nimport {\n  ALL_DICTS,\n  DICT_ID_TO_NAME,\n  DICT_NAME_TO_ID,\n  getDictBytes,\n  loadDict,\n  type DictName,\n} from \"./dicts\";\nimport { canEncodeAsV2, toV2, fromV2 } from \"./envelope-v2\";\nimport { canEncodeAsV3, toV3, fromV3 } from \"./envelope-v2\";\nimport { WireCodecError } from \"./errors.js\";\nimport { asWireBytes, asHttpWireBytes } from \"./brands\";\nimport type { WireBytes, HttpWireBytes } from \"./brands\";\n\nexport type { DictName };\n\nexport type WireCap =\n  | \"json\"\n  | \"cbor\"\n  | \"cbor+zstd\"\n  | \"zstd-dict-ru-v1\"\n  | \"zstd-dict-fa-v1\"\n  | \"zstd-dict-en-v1\"\n  | \"envelope-v2\"\n  | \"envelope-v3\";\n\n/** All capabilities this build can encode AND decode.\n *  Note: dict caps are advertised statically (build-time). At encode time, if the\n *  dict isn't actually loaded (offline / fetch reject), the encoder silently emits\n *  0xC6 instead of 0xC7. Decoder side carries all dicts post-preload, so the\n *  worst case is \"negotiation succeeds, sender downgrades, receiver decodes 0xC6\n *  fine\" — no protocol break. */\nexport const ALL_CAPS: readonly WireCap[] = [\n  \"json\",\n  \"cbor\",\n  \"cbor+zstd\",\n  \"zstd-dict-ru-v1\",\n  \"zstd-dict-fa-v1\",\n  \"zstd-dict-en-v1\",\n  \"envelope-v2\",\n  \"envelope-v3\",\n] as const;\n\nexport interface EncodeOpts {\n  /** Emit CBOR instead of JSON. Default: false. */\n  cbor?: boolean;\n  /** Wrap CBOR with zstd compression. Requires cbor=true. Default: false. */\n  zstd?: boolean;\n  /** Use a shared zstd dict. Requires zstd=true. Falls back to 0xC6 if dict not loaded. */\n  dict?: DictName;\n  /** Phase 2.F.A: envelope wire-shape version. 2 → 0xC8 magic + compact id/ts/k.\n   *  Requires zstd=true. Falls back to v1 (0xC6/0xC7) per-frame if value isn't\n   *  v2-encodable (unknown kind, non-UUID id, ts outside uint32 window). Default: 1.\n   *\n   *  Phase 2.F.B: envelope=3 → 0xCA magic + compact id/ts/k/f (peer-index).\n   *  Requires zstd=true AND peerIndex. Falls back to v2 (then v1) per-frame if\n   *  value isn't v3-encodable (unknown kind, non-UUID id, ts outside uint32\n   *  window, missing/empty `from`, peerIndex out of uint8 range). */\n  envelope?: 1 | 2 | 3;\n  /** Phase 2.F.B: uint8 peer-index for envelope-v3. Required when envelope=3.\n   *  Must be 0..255. Ignored for envelope=1/2. */\n  peerIndex?: number;\n}\n\n/** Phase 2.F.B: decode options. `resolvePeer` maps the uint8 peer-index (the\n *  `f` field in envelope-v3) back to the 64-char hex pubkey string via the\n *  ratchet's peer_index_map. If a v3 frame is decoded without a resolver, or\n *  the resolver returns undefined (peer not in map), `from` is set to undefined\n *  and `f` is preserved on the output for caller diagnostics — the caller MUST\n *  drop such frames (same as chat-unknown-future).\n *\n *  Backward-compatible: decode(bytes) with no opts works for all pre-v3 magic\n *  bytes (JSON / CBOR / 0xC6 / 0xC7 / 0xC8 / 0xC9). */\nexport interface DecodeOpts {\n  resolvePeer?: (peerIndex: number) => string | undefined;\n}\n\nconst enc = new TextEncoder();\nconst dec = new TextDecoder();\nconst sharedCborEncoder = new CborEncoder({\n  mapsAsObjects: true,\n  useRecords: false,\n});\n\nconst JSON_OPEN_BRACE = 0x7b; // '{'\nconst JSON_OPEN_BRACKET = 0x5b; // '['\nconst ZSTD_MAGIC_PREFIX = 0xc6; // cbor + zstd (dictless), envelope-v1\nconst ZSTD_DICT_MAGIC_PREFIX = 0xc7; // cbor + zstd + shared-dict, envelope-v1 (Phase 2.E.B)\n// Phase 2.F.A: envelope-v2. Magic byte + 1-byte dict-id (0x00 = dictless).\nconst ZSTD_V2_MAGIC_PREFIX = 0xc8;\n// Phase 2.F.B: envelope-v3 (peer-index compaction). Magic byte + 1-byte dict-id\n// (0x00 = dictless) + 1-byte peer-index. Same zstd-of-CBOR payload shape as v2\n// but with `f` (uint8) replacing `from` (64-char hex string) inside the CBOR.\nconst ZSTD_V3_MAGIC_PREFIX = 0xca;\n// MESH_BUNDLE_MAGIC_V1 / MESH_BUNDLE_VERSION live in `./mesh-bundle.ts` and are\n// re-exported from `./index.ts`. The duplicates here were dead.\nconst ZSTD_LEVEL = 3;\n\n// Decompression-bomb hard caps. Threat model: post-AEAD malicious-but-authorized\n// group peer crafts a small zstd frame whose decompressed size dwarfs the input.\n//\n// `@bokuweb/zstd-wasm` mallocs the destination buffer from the frame's declared\n// Frame_Content_Size BEFORE the JS wrapper returns control (verified empirically\n// in dist/esm/simple/decompress.js: `malloc(contentSize)` runs prior to any\n// post-call length check). A 16-byte hostile frame can therefore declare 4 GB\n// and crash the wasm allocator before any JS-side cap fires.\n//\n// Defenses, in order:\n//   1. Reject oversized COMPRESSED input early — prevents the \"valid 64 KB\n//      frame that legitimately decompresses to 100×\" amplification path.\n//   2. Parse the zstd frame header per RFC 8878 §3.1.1 in pure JS BEFORE\n//      handing bytes to the wasm lib; reject if Frame_Content_Size exceeds\n//      ZSTD_MAX_DECOMPRESSED_BYTES OR if FCS is absent (we never produce\n//      streaming frames legitimately, so missing FCS is a hostile-payload\n//      tell). This closes the malloc-before-check hole.\n//   3. Pass `defaultHeapSize: ZSTD_MAX_DECOMPRESSED_BYTES` to lib calls so\n//      that even if a frame somehow lacks FCS and slips past (2), the wasm\n//      heap is bounded.\n//   4. Re-check decompressed length on output — catches the case where a\n//      smaller-than-cap input decodes to something obviously bogus before\n//      the bytes hit cborDecode.\n//\n// Real envelopes today: chat-msg / pay / typing <"+"2 KB plain, <"+"1 KB compressed.\n// Caps sit ~30× above legitimate, well below any realistic wasm budget.\nconst ZSTD_MAX_COMPRESSED_BYTES = 64 * 1024;\nconst ZSTD_MAX_DECOMPRESSED_BYTES = 256 * 1024;\nconst ZSTD_DECOMPRESS_OPTS = { defaultHeapSize: ZSTD_MAX_DECOMPRESSED_BYTES };\n\n// zstd frame magic, little-endian (RFC 8878 §3.1.1).\n// 0x28 0xB5 0x2F 0xFD on the wire = 0xFD2FB528 LE.\nconst ZSTD_MAGIC_BYTES = [0x28, 0xb5, 0x2f, 0xfd] as const;\n\n/**\n * Parse a zstd frame header (RFC 8878 §3.1.1) and reject hostile shapes.\n *\n * Validates:\n *   - Magic_Number == 0xFD2FB528.\n *   - Frame_Content_Size present (we never emit streaming frames).\n *   - Frame_Content_Size <"+"= maxDecompressed.\n *\n * Skips Window_Descriptor (when Single_Segment=0) and Dictionary_ID bytes\n * to land on the FCS field. Throws on any layout we don't understand.\n *\n * The lib's `_malloc(declared FCS)` runs BEFORE the JS wrapper returns, so\n * this validator MUST be called before zstdDecompress / decompressUsingDict.\n */\nfunction validateZstdFrame(bytes: Uint8Array, maxDecompressed: number): void {\n  if (bytes.length <"+" 6) {\n    throw new WireCodecError(\n      \"ZSTD_DECODE_FAILED\",\n      \"wire-codec.decode: zstd frame truncated (header <"+" 6 bytes)\",\n    );\n  }\n  for (let i = 0; i <"+" 4; i++) {\n    if (bytes[i] !== ZSTD_MAGIC_BYTES[i]) {\n      throw new WireCodecError(\n        \"ZSTD_DECODE_FAILED\",\n        \"wire-codec.decode: zstd magic mismatch\",\n      );\n    }\n  }\n  const fhd = bytes[4]!;\n  const fcsFlag = (fhd >> 6) & 0x03;          // bits 7-6\n  const singleSegment = (fhd >> 5) & 0x01;    // bit 5\n  // bits 4-3 reserved/unused, bit 2 content-checksum, bits 1-0 dict-id flag.\n  const dictIdFlag = fhd & 0x03;\n\n  let cursor = 5;\n  // Window_Descriptor: 1 byte iff Single_Segment=0.\n  if (singleSegment === 0) cursor += 1;\n  // Dictionary_ID: 0/1/2/4 bytes per dictIdFlag.\n  const dictIdBytes = dictIdFlag === 0 ? 0 : dictIdFlag === 1 ? 1 : dictIdFlag === 2 ? 2 : 4;\n  cursor += dictIdBytes;\n\n  // Frame_Content_Size: 0/1/2/4/8 bytes.\n  // fcsFlag=0 + singleSegment=1 → 1 byte (FCS present).\n  // fcsFlag=0 + singleSegment=0 → 0 bytes (FCS ABSENT — reject).\n  // fcsFlag=1 → 2 bytes (read u16 LE then add 256 per spec).\n  // fcsFlag=2 → 4 bytes.\n  // fcsFlag=3 → 8 bytes.\n  let fcsFieldSize: number;\n  if (fcsFlag === 0) fcsFieldSize = singleSegment === 1 ? 1 : 0;\n  else if (fcsFlag === 1) fcsFieldSize = 2;\n  else if (fcsFlag === 2) fcsFieldSize = 4;\n  else fcsFieldSize = 8;\n\n  if (fcsFieldSize === 0) {\n    throw new WireCodecError(\n      \"ZSTD_DECODE_FAILED\",\n      \"wire-codec.decode: zstd frame omits Frame_Content_Size (streaming) — rejected\",\n    );\n  }\n  if (cursor + fcsFieldSize > bytes.length) {\n    throw new WireCodecError(\n      \"ZSTD_DECODE_FAILED\",\n      \"wire-codec.decode: zstd frame truncated before FCS\",\n    );\n  }\n\n  // Read FCS little-endian. Use BigInt for the 8-byte case; everything else\n  // fits in a JS number (≤ 2^32-1).\n  let fcs: number | bigint;\n  if (fcsFieldSize === 1) {\n    fcs = bytes[cursor]!;\n  } else if (fcsFieldSize === 2) {\n    fcs = (bytes[cursor]! | (bytes[cursor + 1]! <"+"<"+" 8)) + 256; // RFC 8878: add 256\n  } else if (fcsFieldSize === 4) {\n    fcs =\n      bytes[cursor]! |\n      (bytes[cursor + 1]! <"+"<"+" 8) |\n      (bytes[cursor + 2]! <"+"<"+" 16) |\n      // shifting into bit-31 produces a negative i32; use unsigned multiply.\n      bytes[cursor + 3]! * 0x01000000;\n  } else {\n    // 8 bytes: assemble LE BigInt.\n    let v = 0n;\n    for (let i = 7; i >= 0; i--) v = (v <"+"<"+" 8n) | BigInt(bytes[cursor + i]!);\n    fcs = v;\n  }\n\n  const maxBig = BigInt(maxDecompressed);\n  const fcsBig = typeof fcs === \"bigint\" ? fcs : BigInt(fcs);\n  if (fcsBig > maxBig) {\n    throw new WireCodecError(\n      \"ZSTD_DECODE_FAILED\",\n      `wire-codec.decode: zstd Frame_Content_Size ${fcsBig.toString()} exceeds cap ${maxDecompressed}`,\n      { limit: maxDecompressed, fcs: fcsBig.toString() },\n    );\n  }\n}\n\n// Module-singleton zstd contexts. zstd-wasm's compressUsingDict /\n// decompressUsingDict / zstdCompress / zstdDecompress are SYNCHRONOUS calls —\n// JS event-loop semantics guarantee no concurrent reentry into the same handle.\n// If a future refactor introduces a streaming variant or `await` between handle\n// creation and use, two interleaved {de,com}pressions WILL corrupt the context.\n// Treat these handles as part of the readiness contract: created once in\n// ensureWireCodecReady, used synchronously per-call, never freed.\nlet zstdReadyPromise: Promise<"+"void> | null = null;\nlet zstdReady = false;\nlet cctxHandle: number | null = null;\nlet dctxHandle: number | null = null;\n\n/**\n * Initialize zstd-wasm + eagerly preload all shipped shared dicts (≤16KB each).\n * Idempotent: safe to call multiple times. Must be awaited before encode/decode\n * of zstd payloads. Per-dict preload failures are non-fatal: encoder silently\n * falls back to 0xC6 dictless on cache-miss (see ALL_CAPS comment).\n */\nexport async function ensureWireCodecReady(): Promise<"+"void> {\n  if (zstdReady) return;\n  if (!zstdReadyPromise) {\n    zstdReadyPromise = zstdInit().then(async () => {\n      cctxHandle = createCCtx();\n      dctxHandle = createDCtx();\n      // Eagerly preload shipped dicts so the first send doesn't pay fetch latency.\n      // Failures are non-fatal: dict cap silently degrades to dictless.\n      for (const name of ALL_DICTS) {\n        try { await loadDict(name); } catch { /* fallback to dictless */ }\n      }\n      zstdReady = true;\n    });\n  }\n  return zstdReadyPromise;\n}\n\nexport function encode(value: unknown, opts: EncodeOpts = {}): WireBytes {\n  if (opts.zstd && !opts.cbor) {\n    throw new WireCodecError(\n      \"ENCODE_ZSTD_REQUIRES_CBOR\",\n      \"wire-codec.encode: zstd requires cbor=true\",\n    );\n  }\n  if (opts.zstd) {\n    if (!zstdReady) {\n      throw new WireCodecError(\n        \"ZSTD_NOT_INITIALIZED\",\n        \"wire-codec.encode: zstd not initialized — await ensureWireCodecReady() first\",\n      );\n    }\n    // Phase 2.F.B: per-frame opportunistic v3 envelope (peer-index compaction).\n    // If envelope=3 AND peerIndex is a valid uint8 AND the value is v3-encodable,\n    // emit 0xCA. Falls back to v2 (then v1) per-frame — no protocol break.\n    const useV3 =\n      opts.envelope === 3 &&\n      typeof opts.peerIndex === \"number\" &&\n      canEncodeAsV3(value, opts.peerIndex);\n    // v2 fallback: when envelope=3 fails v3 checks, try v2 (if value is\n    // v2-encodable). Also handles envelope=2 directly.\n    const useV2 =\n      !useV3 &&\n      (opts.envelope === 2 || opts.envelope === 3) &&\n      canEncodeAsV2(value);\n    if (useV3) {\n      const cborSrc = toV3(value as Record<"+"string, unknown>, opts.peerIndex!);\n      const cborBytes = sharedCborEncoder.encode(cborSrc);\n      // 0xCA + dict-id byte (0x00 = dictless) + peer-index byte.\n      let compressed: Uint8Array;\n      let dictId = 0x00;\n      if (opts.dict !== undefined) {\n        const dictBytes = getDictBytes(opts.dict);\n        const id = DICT_NAME_TO_ID[opts.dict];\n        if (dictBytes !== undefined && id !== undefined && cctxHandle !== null) {\n          compressed = compressUsingDict(cctxHandle, cborBytes, dictBytes, ZSTD_LEVEL);\n          dictId = id;\n        } else {\n          compressed = zstdCompress(cborBytes, ZSTD_LEVEL);\n        }\n      } else {\n        compressed = zstdCompress(cborBytes, ZSTD_LEVEL);\n      }\n      const out = new Uint8Array(3 + compressed.length);\n      out[0] = ZSTD_V3_MAGIC_PREFIX;\n      out[1] = dictId;\n      out[2] = opts.peerIndex! & 0xff;\n      out.set(compressed, 3);\n      return asWireBytes(out);\n    }\n    // Phase 2.F.A: per-frame opportunistic v2 envelope. If the value can't fit\n    // the v2 shape (unknown kind / bad id / ts out of window) we silently emit\n    // v1 — byte-identical to pre-2.F.A output, no protocol break.\n    const cborSrc = useV2 ? toV2(value as Record<"+"string, unknown>) : value;\n    const cborBytes = sharedCborEncoder.encode(cborSrc);\n    if (useV2) {\n      // 0xC8 + dict-id byte (0x00 = dictless). All C1 caps still apply via decode.\n      let compressed: Uint8Array;\n      let dictId = 0x00;\n      if (opts.dict !== undefined) {\n        const dictBytes = getDictBytes(opts.dict);\n        const id = DICT_NAME_TO_ID[opts.dict];\n        if (dictBytes !== undefined && id !== undefined && cctxHandle !== null) {\n          compressed = compressUsingDict(cctxHandle, cborBytes, dictBytes, ZSTD_LEVEL);\n          dictId = id;\n        } else {\n          compressed = zstdCompress(cborBytes, ZSTD_LEVEL);\n        }\n      } else {\n        compressed = zstdCompress(cborBytes, ZSTD_LEVEL);\n      }\n      const out = new Uint8Array(2 + compressed.length);\n      out[0] = ZSTD_V2_MAGIC_PREFIX;\n      out[1] = dictId;\n      out.set(compressed, 2);\n      return asWireBytes(out);\n    }\n    // Dict path (0xC7 + dict-id): used only when dict is in cache. On miss we\n    // silently fall back to 0xC6 — keeps the encoder sync and tolerant of\n    // preload failures (offline, fetch reject, etc.).\n    if (opts.dict !== undefined) {\n      const dictBytes = getDictBytes(opts.dict);\n      const dictId = DICT_NAME_TO_ID[opts.dict];\n      if (dictBytes !== undefined && dictId !== undefined && cctxHandle !== null) {\n        const compressed = compressUsingDict(cctxHandle, cborBytes, dictBytes, ZSTD_LEVEL);\n        const out = new Uint8Array(2 + compressed.length);\n        out[0] = ZSTD_DICT_MAGIC_PREFIX;\n        out[1] = dictId;\n        out.set(compressed, 2);\n        return asWireBytes(out);\n      }\n      // Fall through to dictless path.\n    }\n    const compressed = zstdCompress(cborBytes, ZSTD_LEVEL);\n    const out = new Uint8Array(1 + compressed.length);\n    out[0] = ZSTD_MAGIC_PREFIX;\n    out.set(compressed, 1);\n    return asWireBytes(out);\n  }\n  if (opts.cbor) {\n    return asWireBytes(sharedCborEncoder.encode(value) as Uint8Array);\n  }\n  return asWireBytes(enc.encode(JSON.stringify(value)));\n}\n\nexport function decode(bytes: WireBytes, opts?: DecodeOpts): unknown {\n  if (bytes.length === 0) {\n    throw new WireCodecError(\"EMPTY_INPUT\", \"wire-codec.decode: empty input\");\n  }\n  const first = bytes[0];\n  if (first === JSON_OPEN_BRACE || first === JSON_OPEN_BRACKET) {\n    return JSON.parse(dec.decode(bytes));\n  }\n  if (first === ZSTD_V3_MAGIC_PREFIX) {\n    if (!zstdReady) {\n      throw new WireCodecError(\n        \"ZSTD_NOT_INITIALIZED\",\n        \"wire-codec.decode: zstd-v3 payload received before ensureWireCodecReady()\",\n      );\n    }\n    if (bytes.length <"+" 3) {\n      throw new WireCodecError(\n        \"ZSTD_DECODE_FAILED\",\n        \"wire-codec.decode: truncated zstd-v3 frame (need 3 header bytes)\",\n      );\n    }\n    if (bytes.length - 3 > ZSTD_MAX_COMPRESSED_BYTES) {\n      throw new WireCodecError(\n        \"COMPRESSED_TOO_LARGE\",\n        \"wire-codec.decode: zstd-v3 payload exceeds compressed-size cap\",\n        { limit: ZSTD_MAX_COMPRESSED_BYTES, size: bytes.length - 3 },\n      );\n    }\n    const dictId = bytes[1]!;\n    // bytes[2] = peer-index — carried on the wire for observer consistency\n    // with the SFrame header, but the authoritative `f` is INSIDE the CBOR\n    // envelope (ciphertext). The outer byte is informational; fromV3 reads\n    // `f` from the decoded CBOR.\n    const compressed = bytes.subarray(3);\n    validateZstdFrame(compressed, ZSTD_MAX_DECOMPRESSED_BYTES);\n    let cborBytes: Uint8Array;\n    if (dictId === 0x00) {\n      cborBytes = zstdDecompress(compressed, ZSTD_DECOMPRESS_OPTS);\n    } else {\n      const dictName = DICT_ID_TO_NAME[dictId];\n      if (dictName === undefined) {\n        throw new WireCodecError(\n          \"UNKNOWN_DICT_ID\",\n          `wire-codec.decode: unknown zstd dict-id 0x${dictId.toString(16)} (v3)`,\n          { dictId },\n        );\n      }\n      const dictBytes = getDictBytes(dictName);\n      if (dictBytes === undefined) {\n        throw new WireCodecError(\n          \"DICT_NOT_LOADED\",\n          `wire-codec.decode: dict ${dictName} not loaded — protocol error (negotiation should have prevented this)`,\n        );\n      }\n      if (dctxHandle === null) {\n        throw new WireCodecError(\n          \"ZSTD_NOT_INITIALIZED\",\n          \"wire-codec.decode: zstd-v3 dict path not initialized\",\n        );\n      }\n      cborBytes = decompressUsingDict(dctxHandle, compress pected 199 to be 198 // Object.is equality","status":"Killed","static":false,"testsCompleted":1,"killedBy":["19"],"coveredBy":["19","28","123","127"],"location":{"end":{"column":2,"line":193},"start":{"column":60,"line":191}}},{"id":"685","mutatorName":"BlockStatement","replacement":"{}","statusReason":"expected [ Array(1) ] to deeply equal [ '/dicts/zstd-dict-en-v1.zstd' ]","status":"Killed","static":false,"testsCompleted":8,"killedBy":["132"],"coveredBy":["116","124","125","126","127","128","129","130","131","132","133","134"],"location":{"end":{"column":2,"line":204},"start":{"column":48,"line":199}}}],"source":"// wire-dicts.ts — shared zstd dictionary registry for the wire codec.\n//\n// Extracted from wire-codec.ts (FOLLOWUPS #12.5) once FA + EN dicts joined RU,\n// pushing wire-codec past the 300-LOC hard escape. The codec module owns the\n// encode/decode logic; this module owns the per-dict state (cache, fetch, name↔id\n// maps, list of shipped dicts).\n//\n// Wire dict-id byte registry — STABLE: never renumber, these go on the wire.\n//   0x01 = zstd-dict-ru-v1   (Phase 2.E.A)\n//   0x02 = zstd-dict-fa-v1   (Phase 2.E.C)\n//   0x03 = zstd-dict-en-v1   (Phase 2.E.D)\n//\n// All clients ship ALL three dictionaries (~48 KB total). Per-language gating\n// would fingerprint the user's language at handshake; carrying every dict makes\n// the dict-id leak benign — observer only learns \"this client supports all\n// Privacy design: dicts are\n// topology-neutral (no per-user or per-language sub-negotiation at handshake).\n\nimport { WireCodecError } from \"./errors.js\";\n\n/**\n * Named shared dictionaries available in this build.\n * DictName is intentionally separate from WireCap — it is a sub-option of the\n * cbor+zstd cap, negotiated independently in Phase 2.E.B (negotiateDict).\n */\nexport type DictName =\n  | \"zstd-dict-ru-v1\"\n  | \"zstd-dict-fa-v1\"\n  | \"zstd-dict-en-v1\";\n\n/** Dictionaries shipped in this build, in negotiation-priority order. */\nexport const ALL_DICTS: readonly DictName[] = [\n  \"zstd-dict-ru-v1\",\n  \"zstd-dict-fa-v1\",\n  \"zstd-dict-en-v1\",\n] as const;\n\n/** Wire dict-id byte registry. Stable: never renumber — these go on the wire. */\nexport const DICT_NAME_TO_ID: Record<"+"DictName, number> = {\n  \"zstd-dict-ru-v1\": 0x01,\n  \"zstd-dict-fa-v1\": 0x02,\n  \"zstd-dict-en-v1\": 0x03,\n};\n\nexport const DICT_ID_TO_NAME: Record<"+"number, DictName> = {\n  0x01: \"zstd-dict-ru-v1\",\n  0x02: \"zstd-dict-fa-v1\",\n  0x03: \"zstd-dict-en-v1\",\n};\n\n// ---------------------------------------------------------------------------\n// Pluggable loader API (PR #2)\n// ---------------------------------------------------------------------------\n\n/**\n * A function that asynchronously resolves a named dictionary to its raw bytes.\n * Implementations may read from the filesystem, fetch from a CDN, load from a\n * bundled asset, etc.  Throw to signal failure; the caller will propagate.\n */\nexport type DictLoader = (name: DictName) => Promise<"+"Uint8Array>;\n\n// Active loader. null = use the built-in default fetch(/dicts/${name}.zstd).\nlet _loader: DictLoader | null = null;\n\n// Generation counter — incremented on every setDictLoader() call.\n// loadDict() snapshots this at IIFE creation; if it changes before the fetch\n// completes, the result is discarded (stale-loader guard).\nlet _loaderGeneration = 0;\n\n/**\n * Override the dict loader for all subsequent loadDict() calls.\n * The last call wins; setDictBaseUrl() is a convenience wrapper around this.\n * Clears the dict cache so that the new loader is used on next access\n * (full eviction is safe — dicts are immutable, so a reload just re-populates).\n * Also increments an internal generation counter so that any in-flight load\n * started with the old loader discards its result rather than polluting the\n * new-loader cache.\n */\nexport function setDictLoader(loader: DictLoader | null): void {\n  _loader = loader;\n  _loaderGeneration++;\n  dictCache.clear();\n  inFlight.clear();\n}\n\n/**\n * Convenience wrapper: configure a fetch-based loader pointing at `baseUrl`.\n * The resolved URL for a dict named `n` will be `${baseUrl}/${n}.zstd`.\n * Equivalent to calling setDictLoader() with a fetch implementation.\n * Calling this evicts the existing dict cache so the new base URL takes effect\n * on the next loadDict() call.\n */\nexport function setDictBaseUrl(baseUrl: string): void {\n  setDictLoader(async (name: DictName): Promise<"+"Uint8Array> => {\n    const url = `${baseUrl}/${name}.zstd`;\n    const resp = await fetch(url);\n    if (!resp.ok) {\n      throw new WireCodecError(\n        \"DICT_FETCH_FAILED\",\n        `wire-dicts.loadDict: failed to fetch ${url} (${resp.status})`,\n      );\n    }\n    return new Uint8Array(await resp.arrayBuffer());\n  });\n}\n\n// ---------------------------------------------------------------------------\n// Cache + load internals\n// ---------------------------------------------------------------------------\n\n// Process-local dict cache. NO eviction by design — at most 3 × 16 KiB = 48 KiB\n// retained for the SW lifetime. Acceptable: dicts are small, immutable, and\n// shipped as static assets versioned by SW CACHE bumps. Long-running sessions\n// (hours) pay zero per-message dict overhead after the eager preload completes.\nconst dictCache = new Map<"+"DictName, Uint8Array>();\n// In-flight fetch dedup: concurrent loadDict callers join one network round-\n// trip. Map holds the pending Promise; entry is cleared on settle so a\n// transient-failed dict can be retried later.\nconst inFlight = new Map<"+"DictName, Promise<"+"Uint8Array>>();\n\n/**\n * Fetch and cache a shared zstd dictionary by name.\n * Idempotent: subsequent calls return the cached bytes without re-fetching.\n * Concurrent calls share one in-flight fetch (no duplicate network round-trips).\n * Throws on fetch failure — caller (ensureWireCodecReady) swallows individual\n * failures so a missing dict silently degrades to the dictless 0xC6 path.\n *\n * Uses the configured DictLoader if set (see setDictLoader / setDictBaseUrl);\n * falls back to fetch(`/dicts/${name}.zstd`) to preserve existing web/ shim\n * behaviour when no loader is configured.\n *\n * Race safety: if setDictLoader() is called while a fetch is in flight, the\n * in-flight result is discarded (throws 'dict load aborted: loader swapped\n * during fetch') rather than written into the new-loader cache. The inFlight\n * entry is cleared in the finally block so callers can immediately retry with\n * the new loader.\n */\nexport async function loadDict(name: DictName): Promise<"+"Uint8Array> {\n  const cached = dictCache.get(name);\n  if (cached !== undefined) return cached;\n  const pending = inFlight.get(name);\n  if (pending !== undefined) return pending;\n  const fetchOnce = (async () => {\n    // Capture both the generation and the loader reference at call time.\n    // Using loaderAtStart ensures the fetch uses the exact function that was\n    // active when loadDict() was called, not whatever _loader is when the\n    // await resolves (which would be a second, subtler race).\n    const generationAtStart = _loaderGeneration;\n    const loaderAtStart = _loader;\n    try {\n      let buf: Uint8Array;\n      if (loaderAtStart !== null) {\n        buf = await loaderAtStart(name);\n      } else {\n        // Default: fetch from /dicts/ — preserves existing web/ shim behaviour.\n        const resp = await fetch(`/dicts/${name}.zstd`);\n        if (!resp.ok) {\n          throw new WireCodecError(\n            \"DICT_FETCH_FAILED\",\n            `wire-dicts.loadDict: failed to fetch /dicts/${name}.zstd (${resp.status})`,\n          );\n        }\n        buf = new Uint8Array(await resp.arrayBuffer());\n      }\n      // Guard: if the loader was swapped while we were awaiting, discard the\n      // result — writing stale bytes into the new-loader cache would corrupt it.\n      if (_loa v2 wire compat. */\nexport const ROOM_EPOCH = 1_767_225_600_000;\n\n/** Stable wire IDs for envelope-v2 `k` byte. Never renumber existing entries. */\nexport const KIND_TO_BYTE: Readonly<"+"Record<"+"string, number>> = Object.freeze({\n\t\"chat-msg\": 0x01,\n\t\"chat-edit\": 0x02,\n\t\"chat-delete\": 0x03,\n\t\"chat-reaction\": 0x04,\n\t\"chat-receipt\": 0x05,\n\t\"chat-typing\": 0x06,\n\t\"chat-history\": 0x07,\n\t\"chat-history-request\": 0x08,\n\t// pay-* (LN / BOLT-12)\n\t\"pay-quote-request\": 0x10,\n\t\"pay-quote\": 0x11,\n\t\"pay-paid\": 0x12,\n\t\"pay-confirmed\": 0x13,\n\t\"pay-cancel\": 0x14,\n\t\"pay-offer-publish\": 0x15,\n\t\"pay-offer-pay-request\": 0x16,\n\t// cashu-*\n\t\"cashu-token-send\": 0x20,\n\t\"cashu-token-claim\": 0x21,\n\t\"cashu-token-bounce\": 0x22,\n\t// evm-pay-*\n\t\"evm-pay-quote-request\": 0x30,\n\t\"evm-pay-quote\": 0x31,\n\t\"evm-pay-paid\": 0x32,\n\t\"evm-pay-confirmed\": 0x33,\n\t\"evm-pay-cancel\": 0x34,\n\t// xmr-pay-*\n\t\"xmr-pay-quote-request\": 0x40,\n\t\"xmr-pay-quote\": 0x41,\n\t\"xmr-pay-paid\": 0x42,\n\t\"xmr-pay-confirmed\": 0x43,\n\t\"xmr-pay-cancel\": 0x44,\n});\n\nexport const BYTE_TO_KIND: Readonly<"+"Record<"+"number, string>> = Object.freeze(\n\tObject.fromEntries(Object.entries(KIND_TO_BYTE).map(([k, v]) => [v, k])),\n);\n\n/**\n * The set of kind strings that toV2 accepts for encoding.\n * \"chat-unknown-future\" is intentionally excluded — it is a receive-only sentinel\n * that must never be originated by this client.\n */\nexport type ChatKindEncodable = keyof typeof KIND_TO_BYTE;\n\n/** Parse a 36-char UUID string into 16 raw bytes. Returns null on malformed input. */\nexport function uuidToBytes(s: string): Uint8Array | null {\n\tif (typeof s !== \"string\" || s.length !== 36) return null;\n\tconst hex = s.replace(/-/g, \"\");\n\tif (hex.length !== 32) return null;\n\tconst out = new Uint8Array(16);\n\tfor (let i = 0; i <"+" 16; i++) {\n\t\tconst b = parseInt(hex.slice(i * 2, i * 2 + 2), 16);\n\t\tif (Numbe annelIdHash: Uint8Array; // 4 B\n  body: Uint8Array; // <"+"= 1500 B\n  signature: Uint8Array; // 64 B\n}\n\nexport interface MeshBundleDecoded {\n  senderPubkey: Uint8Array;\n  msgId: Uint8Array;\n  tsSecOffset: number;\n  ttlHops: number;\n  channelIdHash: Uint8Array;\n  body: Uint8Array;\n  signature: Uint8Array;\n}\n\nexport function encodeMeshBundle(args: MeshBundleEncodeArgs): Uint8Array {\n  // Fixed-array field validation -- wrong lengths are data/key errors, not sig errors\n  if (args.senderPubkey.length !== 32) {\n    throw new WireCodecError('MESH_BUNDLE_FIELD_INVALID', 'senderPubkey must be 32 bytes', {\n      field: 'senderPubkey', length: args.senderPubkey.length, expected: 32,\n    });\n  }\n  if (args.msgId.length !== 16) {\n    throw new WireCodecError('MESH_BUNDLE_FIELD_INVALID', 'msgId must be 16 bytes', {\n      field: 'msgId', length: args.msgId.length, expected: 16,\n    });\n  }\n  if (args.channelIdHash.length !== 4) {\n    throw new WireCodecError('MESH_BUNDLE_FIELD_INVALID', 'channelIdHash must be 4 bytes', {\n      field: 'channelIdHash', length: args.channelIdHash.length, expected: 4,\n    });\n  }\n  // Signature wrong length is a sig error (caller passed a bad signature)\n  if (args.signature.length !== MESH_BUNDLE_SIG_LEN) {\n    throw new WireCodecError('MESH_BUNDLE_SIG_INVALID', 'signature must be 64 bytes', {\n      length: args.signature.length,\n    });\n  }\n  // Numeric field validation -- must be integers in their wire ranges\n  if (!Number.isInteger(args.tsSecOffset) || args.tsSecOffset <"+" 0 || args.tsSecOffset > 0xffffffff) {\n    throw new WireCodecError(\n      'MESH_BUNDLE_FIELD_INVALID',\n      'tsSecOffset must be an integer in [0, 0xFFFFFFFF]',\n      { field: 'tsSecOffset', value: args.tsSecOffset },\n    );\n  }\n  if (!Number.isInteger(args.ttlHops) || args.ttlHops <"+" 0 || args.ttlHops > 255) {\n    throw new WireCodecError(\n      'MESH_BUNDLE_FIELD_INVALID',\n      'ttlHops must be an integer in [0, 255]',\n      { field: 'ttlHops', value: args.ttlHops },\n    );\n  }\n  if (args.body.length > MESH_BUNDLE_MAX_BODY) {\n    throw new WireCodecError(\n      'MESH_BUNDLE_TOO_LARGE',\n      ` body exceeds ` + MESH_BUNDLE_MAX_BODY + ` B cap`,\n      { size: args.body.length, cap: MESH_BUNDLE_MAX_BODY },\n    );\n  }\n\n  const total = MESH_BUNDLE_HEADER_FIXED_LEN + args.body.length + MESH_BUNDLE_SIG_LEN;\n  const out = new Uint8Array(total);\n  out[0] = MESH_BUNDLE_MAGIC_V1;\n  out[1] = MESH_BUNDLE_VERSION;\n  out.set(args.senderPubkey, 2);\n  out.set(args.msgId, 34);\n  // ts_s_offset u32 BE\n  out[50] = (args.tsSecOffset >>> 24) & 0xff;\n  out[51] = (args.tsSecOffset >>> 16) & 0xff;\n  out[52] = (args.tsSecOffset >>> 8) & 0xff;\n  out[53] = args.tsSecOffset & 0xff;\n  out[54] = args.ttlHops & 0xff;\n  out.set(args.channelIdHash, 55);\n  // body_len u16 BE\n  out[59] = (args.body.length >>> 8) & 0xff;\n  out[60] = args.body.length & 0xff;\n  out.set(args.body, MESH_BUNDLE_HEADER_FIXED_LEN);\n  out.set(args.signature, MESH_BUNDLE_HEADER_FIXED_LEN + args.body.length);\n  return out;\n}\n\nexport function decodeMeshBundle(wire: Uint8Array): MeshBundleDecoded {\n  // Must be at least 125 B: 61 B header + 0 B body + 64 B sig\n  if (wire.length <"+" MESH_BUNDLE_HEADER_FIXED_LEN + MESH_BUNDLE_SIG_LEN) {\n    throw new WireCodecError('MESH_BUNDLE_TRUNCATED', 'bundle below minimum size', {\n      size: wire.length,\n      min: MESH_BUNDLE_HEADER_FIXED_LEN + MESH_BUNDLE_SIG_LEN,\n    });\n  }\n  if (wire[0] !== MESH_BUNDLE_MAGIC_V1) {\n    throw new WireCodecError('UNKNOWN_MAGIC', 'mesh-bundle magic byte mismatch', {\n      magic: wire[0]!,\n    });\n  }\n  if (wire[1] !== MESH_BUNDLE_VERSION) {\n    throw new WireCodecError('MESH_BUNDLE_VERSION_UNSUPPORTED', 'mesh-bundle version not supported', {\n      version: wire[1]!,\n      supported: MESH_BUNDLE_VERSION,\n    });\n  }\n  const bodyLen = (wire[59]! <"+"<"+" 8) | wire[60]!;\n  if (bodyLen > MESH_BUNDLE_MAX_BODY) {\n    // Cap violation -- body_len in header exceeds protocol maximum\n    throw new WireCodecError('MESH_BUNDLE_TOO_LARGE', 'body_len exceeds cap', {\n      bodyLen,\n      cap: MESH_BUNDLE_MAX_BODY,\n    });\n  }\n  const expectedTotal = MESH_BUNDLE_HEADER_FIXED_LEN + bodyLen + MESH_BUNDLE_SIG_LEN;\n  if (wire.length !== expectedTotal) {\n    // Wire length mismatches declared body_len -- bundle is truncated or malformed\n    throw new WireCodecError('MESH_BUNDLE_TRUNCATED', 'bundle size mismatches header body_len', {\n      actual: wire.length,\n      expected: expectedTotal,\n    });\n  }\n  const tsSecOffset =\n    (((wire[50]! <"+"<"+" 24) | (wire[51]! <"+"<"+" 16) | (wire[52]! <"+"<"+" 8) | wire[53]!) >>> 0);\n  return {\n    senderPubkey: wire.slice(2, 34),\n    msgId: wire.slice(34, 50),\n    tsSecOffset,\n    ttlHops: wire[54]!,\n    channelIdHash: wire.slice(55, 59),\n    body: wire.slice(MESH_BUNDLE_HEADER_FIXED_LEN, MESH_BUNDLE_HEADER_FIXED_LEN + bodyLen),\n    signature: wire.slice(\n      MESH_BUNDLE_HEADER_FIXED_LEN + bodyLen,\n      MESH_BUNDLE_HEADER_FIXED_LEN + bodyLen + MESH_BUNDLE_SIG_LEN,\n    ),\n  };\n}\n\n/**\n * Returns the byte range that must be covered by the Ed25519 signature:\n * bytes[0 .. 61+bodyLen) -- everything from MAGIC up to and including the body.\n * Caller signs this range and verifies with sender_pubkey + signature field.\n *\n * Throws MESH_BUNDLE_TRUNCATED if the wire buffer is too short to safely slice.\n */\nexport function meshBundleSignedRange(wire: Uint8Array): Uint8Array {\n  if (wire.length <"+" MESH_BUNDLE_HEADER_FIXED_LEN + MESH_BUNDLE_SIG_LEN) {\n    throw new WireCodecError('MESH_BUNDLE_TRUNCATED', 'wire too short to read body_len', {\n      size: wire.length,\n      min: MESH_BUNDLE_HEADER_FIXED_LEN + MESH_BUNDLE_SIG_LEN,\n    });\n  }\n  const bodyLen = (wire[59]! <"+"<"+" 8) | wire[60]!;\n  if (bodyLen + MESH_BUNDLE_HEADER_FIXED_LEN > wire.length) {\n    throw new WireCodecError('MESH_BUNDLE_TRUNCATED', 'wire too short for declared body_len', {\n      bodyLen,\n      required: bodyLen + MESH_BUNDLE_HEADER_FIXED_LEN,\n      actual: wire.length,\n    });\n  }\n  return wire.slice(0, MESH_BUNDLE_HEADER_FIXED_LEN + bodyLen);\n}\n"},"src/errors.ts":{"language":"typescript","mutants":[{"id":"958","mutatorName":"BlockStatement","replacement":"{}","statusReason":"src/errors.ts(72,12): error TS2564: Property 'code' has no initializer and is not definitely assigned in the constructor.\nsrc/errors.ts(75,3): error TS2377: Constructors for derived classes must contain a 'super' call.\n","status":"CompileError","static":false,"coveredBy":["11","20","21","22","23","24","42","43","55","56","57","73","103","104","105","106","107","108","109","110","111","112","113","114","115","116","117","119","120","122","123","124","131","133","134","140","141","142","143","144","145","146","147","148","149","150","151","152","154","155","156","157","158","159","160"],"location":{"end":{"column":4,"line":84},"start":{"column":5,"line":79}}},{"id":"959","mutatorName":"StringLiteral","replacement":"\"\"","statusReason":"expected '' to be 'WireCodecError' // Object.is equality","status":"Killed","static":false,"testsCompleted":37,"killedBy":["104"],"coveredBy":["11","20","21","22","23","24","42","43","55","56","57","73","103","104","105","106","107","108","109","110","111","112","113","114","115","116","117","119","120","122","123","124","131","133","134","140","141","142","143","144","145","146","147","148","149","150","151","152","154","155","156","157","158","159","160"],"location":{"end":{"column":33,"line":81},"start":{"column":17,"line":81}}},{"id":"960","mutatorName":"ConditionalExpression","replacement":"true","statusReason":"expected {} to be undefined","status":"Killed","static":false,"testsCompleted":16,"killedBy":["107"],"coveredBy":["11","20","21","22","23","24","42","43","55","56","57","73","103","104","105","106","107","108","109","110","111","112","113","114","115","116","117","119","120","122","123","12 ror for the wire-codec package.\n *\n * All throws in codec.ts and dicts.ts use this class instead of plain Error,\n * so callers can switch on `code` rather than matching message strings.\n *\n * Code registry (stable — used on catch sites and in tests):\n *\n *   EMPTY_INPUT              — decode/decodeHttpBody received a zero-length buffer.\n *   UNKNOWN_MAGIC            — first byte is not a recognized codec marker.\n *   PEER_ENVELOPE_FORMAT     — 0xC8 (peer envelope-v2) passed to decodeHttpBody;\n *                              caller should use decode() instead.\n *   INVALID_DICT_ID_HEADER   — 0xC7 frame is too short to contain the dict-id\n *                              header bytes (need ≥ 3 bytes for server protocol\n *                              or ≥ 2 bytes for peer protocol).\n *   UNKNOWN_DICT_ID          — dict-id byte/word has no registered entry.\n *   DICT_NOT_LOADED          — dict is registered but has not been fetched yet.\n *   ZSTD_NOT_INITIALIZED     — a zstd operation was attempted before\n *                              ensureWireCodecReady() resolved.\n *   ZSTD_DECODE_FAILED       — zstd frame is malformed (bad magic, truncated,\n *                              missing FCS, FCS exceeds cap, or wasm error).\n *   COMPRESSED_TOO_LARGE     — compressed input exceeds the hard cap before\n *                              decompression (distinct from DECOMPRESSED_TOO_LARGE).\n *   DECOMPRESSED_TOO_LARGE   — decompressed output exceeds the hard cap.\n *   LOADER_SWAPPED_MID_FETCH — setDictLoader() was called while a loadDict()\n *                              fetch was in flight; the stale result is discarded.\n *   ENCODE_ZSTD_REQUIRES_CBOR — encode() called with zstd:true but cbor:false.\n *   DICT_FETCH_FAILED        — fetch() for a named dict returned a non-2xx status.\n *                              Distinct from DICT_NOT_LOADED (never fetched) and\n *                              LOADER_SWAPPED_MID_FETCH (discarded stale result).\n *   MESH_BUNDLE_FIELD_INVALID — encode-side field failed validation: tsSecOffset must be\n *                              a safe integer in [0, 0xFFFFFFFF]; ttlHops in [0, 255];\n *                              fixed-array fields (pubkey/msgId/channelIdHash) have\n *                              wrong byte length. details.field names the bad field.\n *   MESH_BUNDLE_TRUNCATED    — decoded bundle is shorter than its declared body_len\n *                              implies (distinct from cap violation).\n *   MESH_BUNDLE_VERSION_UNSUPPORTED — version byte is not 0x01.\n */\nexport type WireCodecErrorCode =\n  | \"EMPTY_INPUT\"\n  | \"UNKNOWN_MAGIC\"\n  | \"UNKNOWN_DICT_ID\"\n  | \"DICT_NOT_LOADED\"\n  | \"ZSTD_DECODE_FAILED\"\n  | \"DECOMPRESSED_TOO_LARGE\"\n  | \"INVALID_DICT_ID_HEADER\"\n  | \"LOADER_SWAPPED_MID_FETCH\"\n  | \"PEER_ENVELOPE_FORMAT\"\n  | \"ZSTD_NOT_INITIALIZED\"\n  | \"COMPRESSED_TOO_LARGE\"\n  | \"ENCODE_ZSTD_REQUIRES_CBOR\"\n  | \"DICT_FETCH_FAILED\"\n  | \"MESH_BUNDLE_SIG_INVALID\"\n  | \"MESH_BUNDLE_STALE\"\n  | \"MESH_BUNDLE_TOO_LARGE\"\n  | \"MESH_BUNDLE_TRUNCATED\"\n  | \"MESH_BUNDLE_FIELD_INVALID\"\n  | \"MESH_BUNDLE_VERSION_UNSUPPORTED\";\n\n/**\n * Allowed value types in WireCodecError details.\n * Restricted to primitives — no binary buffers (Uint8Array, ArrayBuffer, etc.)\n * may appear in error details, as details may be logged or serialized.\n */\nexport type WireCodecErrorDetail = string | number | boolean;\n\nexport interface WireCodecErrorDetails {\n  readonly [key: string]: WireCodecErrorDetail;\n}\n\nexport class WireCodecError extends Error {\n  readonly code: WireCodecErrorCode;\n  readonly details?: Readonly<"+"WireCodecErrorDetails>;\n\n  constructor(\n    code: WireCodecErrorCode,\n    message: string,\n    details?: WireCodecErrorDetails,\n  ) {\n    super(message);\n    this.name = \"WireCodecError\";\n    this.code = code;\n    this.details = details !== undefined ? Object.freeze({ ...details }) : undefined;\n  }\n}\n"}},"schemaVersion":"1.0","thresholds":{"high":80,"low":60,"break":0},"testFiles":{"src/__tests__/wire-codec.test.ts":{"tests":[{"id":"0","name":"wire-codec JSON-encodes by default, decodes back"},{"id":"1","name":"wire-codec opts.cbor=true emits CBOR"},{"id":"2","name":"wire-codec decode accepts both JSON and CBOR"},{"id":"3","name":"wire-codec CBOR is smaller than JSON for typical envelope"},{"id":"4","name":"wire-codec CBOR envelope first byte is in map-header range (0xA0-0xBB)"},{"id":"5","name":"wire-codec preserves Uint8Array natively in CBOR"},{"id":"6","name":"wire-codec decode throws on truly malformed bytes"},{"id":"7","name":"wire-codec decode tolerates legacy string input (TextEncoder bytes of JSON)"},{"id":"8","name":"wire-codec decode accepts JSON arrays too"},{"id":"9","name":"wire-codec — zstd encodes with cbor+zstd, decodes back"},{"id":"10","name":"wire-codec — zstd zstd actually shrinks larger payloads"},{"id":"11","name":"wire-codec — zstd throws if zstd without cbor"},{"id":"12","name":"wire-codec — zstd preserves Uint8Array through zstd round-trip"},{"id":"13","name":"negotiateCap picks highest mutual"},{"id":"14","name":"negotiateCap falls back to json when no overlap"},{"id":"15","name":"negotiateCap falls back to json if mutual list excludes higher tiers"},{"id":"16","name":"capToOpts maps caps to encode opts"},{"id":"17","name":"capToOpts round-trips via encode/decode for each cap"},{"id":"18","name":"Phase 2.E.B — zstd dict negotiation + encoder encodes with shared dict, prefixes 0xC7 + dict-id, round-trips"},{"id":"19","name":"Phase 2.E.B — zstd dict negotiation + encoder falls back to 0xC6 when requested dict is not loaded"},{"id":"20","name":"Phase 2.E.B — zstd dict negotiation + encoder decode of unknown dict-id throws explicit protocol error"},{"id":"21","name":"Phase 2.E.B — zstd dict negotiation + encoder rejects a zstd frame whose compressed length exceeds the cap (bomb defense)"},{"id":"22","name":"Phase 2.E.B — zstd dict negotiation + encoder rejects an oversized zstd-dict frame"},{"id":"23","name":"Phase 2.E.B — zstd dict negotiation + encoder rejects a tiny zstd frame whose declared FCS exceeds the decompressed cap (bomb defense)"},{"id":"24","name":"Phase 2.E.B — zstd dict negotiation + encoder rejects a zstd frame that omits Frame_Content_Size (streaming, FCS absent)"},{"id":"25","name":"Phase 2.E.B — zstd dict negotiation + encoder ALL_DICTS lists shipped dicts (ru/fa/en post-Phase 2.E.C/D)"},{"id":"26","name":"Phase 2.E.B — zstd dict negotiation + encoder encodes with FA dict, prefixes 0xC7 0x02, round-trips"},{"id":"27","name":"Phase 2.E.B — zstd dict negotiation + encoder encodes with EN dict, prefixes 0xC7 0x03, round-trips"},{"id":"28","name":"Phase 2.E.B — zstd dict negotiation + encoder loadDict de-dupes concurrent fetches for the same dict (in-flight Promise)"},{"id":"29","name":"negotiateDict (room-wide intersection) picks shared dict when every peer supports it"},{"id":"30","name":"negotiateDict (room-wide intersection) returns undefined when at least one peer lacks the dict"},{"id":"31","name":"negotiateDict (room-wide intersection) returns undefined when only old peers (no caps array) are present"},{"id":"32","name":"negotiateDict (room-wide intersection) zero peers (solo room) → undefined (nothing to negotiate against)"},{"id":"33","name":"negotiateDict (room-wide intersection) order-deterministic: shuffled mine + peer cap arrays converge on same priority"},{"id":"34","name":"Phase 2.F.A — envelope-v2 (0xC8 magic, compact id/ts/k) roundtrip dictless (0xC8 0x00)"},{"id":"35","name":"Phase 2.F.A — envelope-v2 (0xC8 magic, compact id/ts/k) roundtrip with each shipped dict (0xC8 0x01/0x02/0x03)"},{"id":"36","name":"Phase 2.F.A — envelope-v2 (0xC8 magic, compact id/ts/k) every shipped kind round-trips through enum and back"},{"id":"37","name":"Phase 2.F.A — envelope-v2 (0xC8 magic, compact id/ts/k) kind enum byte values are stable wire IDs (renumber === silent corruption at scale)"},{"id":"38","name":"Phase 2.F.A — envelope-v2 (0xC8 magic, compact id/ts/k) v2 frames are smaller than v1 for short RU messages"},{"id":"39","name":"Phase 2.F.A — envelope-v2 (0xC8 magic, compact id/ts/k) negotiateEnvelopeVersion: 2 only when every peer advertises envelope-v2"},{"id":"40","name":"Phase 2.F.A — envelope-v2 (0xC8 magic, compact id/ts/k) decoder accepts mixed-roster v2 frames even when room sends v1"},{"id":"41","name":"Phase 2.F.A — envelope-v2 (0xC8 magic, compact id/ts/k) decoder of 0xC8 0x00 with unknown enum byte returns forward-compat sentinel"},{"id":"42","name":"Phase 2.F.A — envelope-v2 (0xC8 magic, compact id/ts/k) rejects 0xC8 frame whose compressed length exceeds the cap"},{"id":"43","name":"Phase 2.F.A — envelope-v2 (0xC8 magic, compact id/ts/k) rejects 0xC8 frame with bomb-shape FCS = 4 GiB"},{"id":"44","name":"Phase 2.F.A — envelope-v2 (0xC8 magic, compact id/ts/k) encoder falls back to v1 when value isn't v2-encodable"},{"id":"45","name":"Phase 2.F.A — envelope-v2 (0xC8 magic, compact id/ts/k) encoder falls back to v1 when ts is before ROOM_EPOCH"},{"id":"46","name":"Phase 2.F.A — envelope-v2 (0xC8 magic, compact id/ts/k) preserves unknown fields through v2 round-trip (forward-compat passthrough)"},{"id":"47","name":"Phase 2.F.A — envelope-v2 (0xC8 magic, compact id/ts/k) backwards-compat: envelope=1 byte-identical to default zstd path"},{"id":"48","name":"Phase 2.F.B — envelope-v3 (0xCA magic, peer-index compaction) roundtrip dictless (0xCA 0x00 <"+"peerIndex>)"},{"id":"49","name":"Phase 2.F.B — envelope-v3 (0xCA magic, peer-index compaction) roundtrip with each shipped dict (0xCA 0x01/0x02/0x03 <"+"peerIndex>)"},{"id":"50","name":"Phase 2.F.B — envelope-v3 (0xCA magic, peer-index compaction) v3 frames are smaller than v2 (peer-index replaces 64-char hex)"},{"id":"51","name":"Phase 2.F.B — envelope-v3 (0xCA magic, peer-index compaction) negotiateEnvelopeVersion: 3 when all peers advertise envelope-v3, 2 when v2-only, 1 otherwise"},{"id":"52","name":"Phase 2.F.B — envelope-v3 (0xCA magic, peer-index compaction) decoder without resolvePeer returns from=undefined + preserves f"},{"id":"53","name":"Phase 2.F.B — envelope-v3 (0xCA magic, peer-index compaction) decoder with resolvePeer returning undefined (peer not in map) → from=undefined + f preserved"},{"id":"54","name":"Phase 2.F.B — envelope-v3 (0xCA magic, peer-index compaction) decoder of 0xCA with unknown enum byte returns forward-compat sentinel"},{"id":"55","name":"Phase 2.F.B — envelope-v3 (0xCA magic, peer-index compaction) rejects 0xCA frame whose compressed length exceeds the cap"},{"id":"56","name":"Phase 2.F.B — envelope-v3 (0xCA magic, peer-index compaction) rejects 0xCA frame with bomb-shape FCS = 4 GiB"},{"id":"57","name":"Phase 2.F.B — envelope-v3 (0xCA magic, peer-index compaction) rejects truncated 0xCA frame (<"+" 3 header bytes)"},{"id":"58","name":"Phase 2.F.B — envelope-v3 (0xCA magic, peer-index compaction) encoder falls back to v2 when peerIndex is missing"},{"id":"59","name":"Phase 2.F.B — envelope-v3 (0xCA magic, peer-index compaction) encoder falls back to v2 when peerIndex is out of uint8 range"},{"id":"60","name":"Phase 2.F.B — envelope-v3 (0xCA magic, peer-index compaction) encoder falls back to v2 when from is missing (v2 does not require from)"},{"id":"61","name":"Phase 2.F.B — envelope-v3 (0xCA magic, peer-index compaction) encoder falls back to v1 when kind is unknown"},{"id":"62","name":"Phase 2.F.B — envelope-v3 (0xCA magic, peer-index compaction) preserves unknown fields through v3 round-trip"},{"id":"63","name":"Phase 2.F.B — envelope-v3 (0xCA magic, peer-index compaction) decoder accepts mixed-roster v3/v2/v1 frames (decoder branches independent of negotiation)"},{"id":"64","name":"Phase 2.F.B — envelope-v3 (0xCA magic, peer-index compaction) 0xCA magic byte is distinct from 0xC8 (v2) and 0xC9 (mesh-bundle)"},{"id":"65","name":"canonicalizeEnvelope (A9) two key-order permutations encode to identical bytes"},{"id":"66","name":"canonicalizeEnvelope (A9) without canonicalization, cbor-x emits insertion order (regression baseline)"},{"id":"67","name":"canonicalizeEnvelope (A9) preserves array order, recurses through nested arrays/objects"},{"id":"68","name":"canonicalizeEnvelope (A9) passes Uint8Array through unchanged"}],"source":"import { describe, it, expect, beforeAll } from 'vitest';\nimport { readFileSync } from 'node:fs';\nimport { asWireBytes } from '../brands.ts';\nimport { fileURLToPath } from 'node:url';\nimport { join, dirname } from 'node:path';\n\n// Mock global.fetch BEFORE ensureWireCodecReady() runs. All three shipped\n// dicts (ru/fa/en) resolve from the local static FS so encoder roundtrip tests\n// per language work. The \"fallback to 0xC6\" test below uses an explicit cache\n// clear (loadDict miss path) instead of unmocking fetch — keeping the mock\n// uniform avoids ordering coupling between describe blocks.\nconst __dirname = dirname(fileURLToPath(import.meta.url));\nconst DICTS_DIR = join(__dirname, '..', '..', 'dicts');\nconst realFetch = globalThis.fetch;\nconst MOCKED_DICTS = ['zstd-dict-ru-v1', 'zstd-dict-fa-v1', 'zstd-dict-en-v1'] as const;\nglobalThis.fetch = (async (input: RequestInfo | URL): Promise<"+"Response> => {\n  const url = typeof input === 'string' ? input : input.toString();\n  for (const name of MOCKED_DICTS) {\n    if (url.endsWith(`/dicts/${name}.zstd`)) {\n      const buf = readFileSync(join(DICTS_DIR, `${name}.zstd`));\n      const u8 = new Uint8Array(buf.buffer, buf.byteOffset, buf.byteLength);\n      return new Response(u8, { status: 200 });\n    }\n  }\n  return realFetch(input);\n}) as typeof fetch;\nimport {\n  encode,\n  decode,\n  isCborMagic,\n  negotiateCap,\n  negotiateDict,\n  negotiateEnvelopeVersion,\n  capToOpts,\n  canonicalizeEnvelope,\n  ensureWireCodecReady,\n  ALL_CAPS,\n  type WireCap,\n} from '../codec.ts';\nimport { ALL_DICTS } from '../dicts.ts';\nimport { ROOM_EPOCH, KIND_TO_BYTE } from '../envelope-v2.ts';\n\nbeforeAll(async () => {\n  await ensureWireCodecReady();\n});\n\ndescribe('wire-codec', () => {\n  it('JSON-encodes by default, decodes back', () => {\n    const obj = { v: 1, kind: 'chat-msg', body: 'hi' };\n    const bytes = encode(obj);\n    expect(bytes[0]).toBe(0x7B);  // '{' — JSON\n    expect(decode(bytes)).toEqual(obj);\n  });\n\n  it('opts.cbor=true emits CBOR', () => {\n    const obj = { v: 1, kind: 'chat-msg', body: 'hi' };\n    const bytes = encode(obj, { cbor: true });\n    expect(bytes[0]).not.toBe(0x7B);\n    expect(isCborMagic(bytes)).toBe(true);\n    expect(decode(bytes)).toEqual(obj);\n  });\n\n  it('decode accepts both JSON and CBOR', () => {\n    const obj = { v: 1, kind: 'chat-msg', body: 'hello world' };\n    const json = encode(obj, { cbor: false });\n    const cbor = encode(obj, { cbor: true });\n    expect(decode(json)).toEqual(obj);\n    expect(decode(cbor)).toEqual(obj);\n  });\n\n  it('CBOR is smaller than JSON for typical envelope', () => {\n    const env = {\n      v: 1,\n      id: '01234567-89ab-cdef-0123-456789abcdef',\n      ts: 1777891000000,\n      from: 'a'.repeat(64),\n      kind: 'chat-msg',\n      body: 'hello'\n    };\n    const json = encode(env, { cbor: false });\n    const cbor = encode(env, { cbor: true });\n    expect(cbor.length).toBeLessThan(json.length);\n  });\n\n  it('CBOR envelope first byte is in map-header range (0xA0-0xBB)', () => {\n    // Load-bearing for the magic-byte sniff: top-level envelopes must be maps.\n    const env = {\n      v: 1,\n      id: 'a'.repeat(36),\n      ts: 1777891000000,\n      from: 'b'.repeat(64),\n      kind: 'chat-msg',\n      body: 'hello',\n    };\n    const cbor = encode(env, { cbor: true });\n    expect(cbor[0]).toBeGreaterThanOrEqual(0xA0);\n    expect(cbor[0]).toBeLessThanOrEqual(0xBB);\n  });\n\n  it('preserves Uint8Array natively in CBOR', () => {\n    const obj = { kind: 'cashu-token-send', token: new Uint8Array([1, 2, 3, 4]) };\n    const cbor = encode(obj, { cbor: true });\n    const decoded = decode(cbor) as { kind: string; token: Uint8Array };\n    expect(decoded.token).toBeInstanceOf(Uint8Array);\n    expect(Array.from(decoded.token)).toEqual([1, 2, 3, 4]);\n  });\n\n  it('decode throws on truly malformed bytes', () => {\n    expect(() => decode(asWireBytes(new Uint8Array([0xFF, 0xFE, 0xFD, 0xFC, 0xFB])))).toThrow();\n  });\n\n  it('decode tolerates legacy string input (TextEncoder bytes of JSON)', () => {\n    const json = '{\"v\":1,\"kind\":\"chat-msg\"}';\n    const bytes = new TextEncoder().encode(json);\n    expect(decode(asWireBytes(bytes))).toEqual({ v: 1, kind: 'chat-msg' });\n  });\n\n  it('decode accepts JSON arrays too', () => {\n    const obj = [{ v: 1, kind: 'chat-msg' }, { v: 1, kind: 'chat-typing' }];\n    const bytes = encode(obj);\n    expect(bytes[0]).toBe(0x5B);  // '['\n    expect(decode(bytes)).toEqual(obj);\n  });\n});\n\ndescribe('wire-codec — zstd', () => {\n  it('encodes with cbor+zstd, decodes back', () => {\n    const obj = {\n      v: 1,\n      id: 'a'.repeat(36),\n      ts: 1777891000000,\n      from: 'b'.repeat(64),\n      kind: 'chat-msg',\n      body: 'hello world'.repeat(10),\n    };\n    const bytes = encode(obj, { cbor: true, zstd: true });\n    expect(bytes[0]).toBe(0xC6);\n    expect(decode(bytes)).toEqual(obj);\n  });\n\n  it('zstd actually shrinks larger payloads', () => {\n    const obj = {\n      v: 1,\n      id: 'a'.repeat(36),\n      kind: 'chat-msg',\n      body: 'hello '.repeat(100),\n    };\n    const cbor = encode(obj, { cbor: true });\n    const zstd = encode(obj, { cbor: true, zstd: true });\n    expect(zstd.length).toBeLessThan(cbor.length);\n  });\n\n  it('throws if zstd without cbor', () => {\n    expect(() => encode({}, { zstd: true })).toThrow(/zstd requires cbor/);\n  });\n\n  it('preserves Uint8Array through zstd round-trip', () => {\n    const obj = {\n      kind: 'cashu-token-send',\n      token: new Uint8Array(64).fill(0xAB),\n    };\n    const bytes = encode(obj, { cbor: true, zstd: true });\n    const decoded = decode(bytes) as { kind: string; token: Uint8Array };\n    expect(decoded.token).toBeInstanceOf(Uint8Array);\n    expect(decoded.token.length).toBe(64);\n    expect(decoded.token[0]).toBe(0xAB);\n  });\n});\n\ndescribe('negotiateCap', () => {\n  it('picks highest mutual', () => {\n    expect(negotiateCap(['json', 'cbor'], ['json', 'cbor'])).toBe('cbor');\n    expect(negotiateCap(['json', 'cbor', 'cbor+zstd'], ['json', 'cbor'])).toBe('cbor');\n    expect(negotiateCap(['json'], ['cbor', 'cbor+zstd'])).toBe('json');\n    expect(negotiateCap(['cbor+zstd'], ['cbor+zstd'])).toBe('cbor+zstd');\n    expect(negotiateCap(ALL_CAPS, ALL_CAPS)).toBe('cbor+zstd');\n  });\n\n  it('falls back to json when no overlap', () => {\n    // Both lists empty — degenerate case\n    expect(negotiateCap([] as WireCap[], [] as WireCap[])).toBe('json');\n  });\n\n  it('falls back to json if mutual list excludes higher tiers', () => {\n    expect(negotiateCap(['cbor'], ['json'])).toBe('json');\n  });\n});\n\ndescribe('capToOpts', () => {\n  it('maps caps to encode opts', () => {\n    expect(capToOpts('json')).toEqual({ cbor: false, zstd: false });\n    expect(capToOpts('cbor')).toEqual({ cbor: true, zstd: false });\n    expect(capToOpts('cbor+zstd')).toEqual({ cbor: true, zstd: true });\n  });\n\n  it('round-trips via encode/decode for each cap', () => {\n    const env = { v: 1, kind: 'chat-msg', body: 'round trip' };\n    for (const cap of ALL_CAPS) {\n      const bytes = encode(env, capToOpts(cap));\n      expect(decode(bytes)).toEqual(env);\n    }\n  });\n});\n\ndescribe('Phase 2.E.B — zstd dict negotiation + encoder', () => {\n  it('encodes with shared dict, prefixes 0xC7 + dict-id, round-trips', () => {\n    const env = {\n      v: 1, kind: 'chat-msg', from: 'a'.repeat(64),\n      body: 'Привет, как дела? Уже еду к тебе, буду через 20 минут.',\n    };\n    const bytes = encode(env, { cbor: true, zstd: true, dict: 'zstd-dict-ru-v1' });\n    expect(bytes[0]).toBe(0xC7);\n    expect(bytes[1]).toBe(0x01); // ru-v1\n    expect(decode(bytes)).toEqual(env);\n  });\n\n  it('falls back to 0xC6 when requested dict is not loaded', async () => {\n    // Simulate the preload-failure scenario by evicting fa from the cache.\n    // Encoder requested fa-v1 → cache miss → silent fallback to dictless 0xC6.\n    // Next call triggers re-load via getDictBytes(undefined) path.\n    const { _evictDictForTesting, loadDict } = await import('../dicts.ts');\n    _evictDictForTesting('zstd-dict-fa-v1');\n    try {\n      const env = { v: 1, kind: 'chat-msg', body: 'fallback test' };\n      const bytes = encode(env, { cbor: true, zstd: true, dict: 'zstd-dict-fa-v1' });\n      expect(bytes[0]).toBe(0xC6); // dictless magic\n      expect(decode(bytes)).toEqual(env);\n    } finally {\n      // Restore so subsequent tests in this run get fa back.\n      await loadDict('zstd-dict-fa-v1');\n    }\n  });\n\n  it('decode of unknown dict-id throws explicit protocol error', () => {\n    // Hand-craft a 0xC7 frame with bogus dict-id 0xFE.\n    const bogus = new Uint8Array([0xC7, 0xFE, 0x00, 0x00]);\n    expect(() => decode(asWireBytes(bogus))).toThrow(/unknown zstd dict-id/);\n  });\n\n  it('rejects a zstd frame whose compressed length exceeds the cap (bomb defense)', () => {\n    // Construct a 0xC6 frame larger than ZSTD_MAX_COMPRESSED_BYTES (64 KB).\n    // Body content does not matter — the cap MUST trip before zstdDecompress\n    // is invoked. Real envelopes are <"+"2 KB; 70 KB compressed is unambiguously\n    // hostile.\n    const big = new Uint8Array(70 * 1024);\n    big[0] = 0xC6;\n    expect(() => decode(asWireBytes(big))).toThrow(/exceeds compressed-size cap/);\n  });\n\n  it('rejects an oversized zstd-dict frame', () => {\n    const big = new Uint8Array(70 * 1024);\n    big[0] = 0xC7;\n    big[1] = 0x01;\n    expect(() => decode(asWireBytes(big))).toThrow(/exceeds compressed-size cap/);\n  });\n\n  it('rejects a tiny zstd frame whose declared FCS exceeds the decompressed cap (bomb defense)', () => {\n    // Real attack shape — small compressed input, huge declared FCS. Without\n    // JS-side header parse, @bokuweb/zstd-wasm's `decompress()` mallocs the\n    // dst buffer from this declared size BEFORE returning to JS. Validator\n    // must trip before any wasm call.\n    //\n    // Frame layout (RFC 8878 §3.1.1):\n    //   Magic_Number      : 28 B5 2F FD\n    //   Frame_Header_Desc : FCS_flag=3 (8 bytes), Single_Segment=0,\n    //                       no checksum, no dict-id  → 0xC0\n    //   Window_Descriptor : 0x40 (small; consumed because Single_Segment=0)\n    //   Frame_Content_Size: 8 bytes LE = 0xFFFFFFFF (4 GiB-1)\n    //   ...trailing junk (validator must reject before reading bodies)\n    const bomb = new Uint8Array([\n      0x28, 0xb5, 0x2f, 0xfd,            // magic\n      0xc0,                              // FHD: FCS_flag=3, single_segment=0\n      0x40,                              // window descriptor\n      0xff, 0xff, 0xff, 0xff,            // FCS LE bytes 0..3 = 4 GiB-1\n      0x00, 0x00, 0x00, 0x00,            // FCS LE bytes 4..7\n      0x00, 0x00, 0x00,                  // junk body — never reached\n    ]);\n    // Wrap with 0xC6 magic prefix as the wire-codec expects.\n    const wire = new Uint8Array(1 + bomb.length);\n    wire[0] = 0xC6;\n    wire.set(bomb, 1);\n    expect(() => decode(asWireBytes(wire))).toThrow(/Frame_Content_Size .* exceeds cap/);\n  });\n\n  it('rejects a zstd frame that omits Frame_Content_Size (streaming, FCS absent)', () => {\n    // FHD: FCS_flag=0, Single_Segment=0 → FCS field is 0 bytes (absent).\n    // We never emit such frames; reject as protocol error.\n    const frame = new Uint8Array([\n      0x28, 0xb5, 0x2f, 0xfd,            // magic\n      0x00,                              // FHD: all zero → FCS absent\n      0x40,                              // window descriptor\n      0x00, 0x00, 0x00,                  // junk\n    ]);\n    const wire = new Uint8Array(1 + frame.length);\n    wire[0] = 0xC6;\n    wire.set(frame, 1);\n    expect(() => decode(asWireBytes(wire))).toThrow(/omits Frame_Content_Size/);\n  });\n\n  it('ALL_DICTS lists shipped dicts (ru/fa/en post-Phase 2.E.C/D)', () => {\n    expect(ALL_DICTS).toEqual(['zstd-dict-ru-v1', 'zstd-dict-fa-v1', 'zstd-dict-en-v1']);\n  });\n\n  it('encodes with FA dict, prefixes 0xC7 0x02, round-trips', () => {\n    const env = {\n      v: 1, kind: 'chat-msg', from: 'a'.repeat(64),\n      body: 'سلام، حالت چطوره؟ من تا ده دقیقه دیگه میرسم.',\n    };\n    const bytes = encode(env, { cbor: true, zstd: true, dict: 'zstd-dict-fa-v1' });\n    expect(bytes[0]).toBe(0xC7);\n    expect(bytes[1]).toBe(0x02); // fa-v1\n    expect(decode(bytes)).toEqual(env);\n  });\n\n  it('encodes with EN dict, prefixes 0xC7 0x03, round-trips', () => {\n    const env = {\n      v: 1, kind: 'chat-msg', from: 'a'.repeat(64),\n      body: \"hey, on my way — be there in 10 min\",\n    };\n    const bytes = encode(env, { cbor: true, zstd: true, dict: 'zstd-dict-en-v1' });\n    expect(bytes[0]).toBe(0xC7);\n    expect(bytes[1]).toBe(0x03); // en-v1\n    expect(decode(bytes)).toEqual(env);\n  });\n\n  it('loadDict de-dupes concurrent fetches for the same dict (in-flight Promise)', async () => {\n    // Audit hardening: prior to the dedup, two simultaneous loadDict() calls\n    // for the same name issued two HTTP fetches. With dedup, both share one.\n    const { _evictDictForTesting, loadDict } = await import('../dicts.ts');\n    _evictDictForTesting('zstd-dict-fa-v1');\n\n    let fetchCount = 0;\n    const realFetch = globalThis.fetch;\n    globalThis.fetch = (async (input: RequestInfo | URL): Promise<"+"Response> => {\n      const url = typeof input === 'string' ? input : input.toString();\n      if (url.endsWith('/dicts/zstd-dict-fa-v1.zstd')) {\n        fetchCount++;\n        // Yield control so concurrent callers all enqueue before the first\n        // resolves — exercises the rders. Result MUST be priority-\n    // driven (ALL_DICTS = [ru, fa, en]), not driven by `mine` ordering — otherwise\n    // peer A picks ru-v1, peer B picks fa-v1, and frames are mutually undecodable.\n    const allCaps: readonly WireCap[] = ['cbor', 'cbor+zstd', 'zstd-dict-en-v1', 'zstd-dict-fa-v1', 'zstd-dict-ru-v1'];\n    const peerA = ['zstd-dict-fa-v1', 'cbor', 'zstd-dict-ru-v1', 'cbor+zstd', 'zstd-dict-en-v1'] as const;\n    const peerB = ['zstd-dict-en-v1', 'zstd-dict-ru-v1', 'cbor+zstd', 'cbor', 'zstd-dict-fa-v1'] as const;\n    expect(negotiateDict(allCaps, [peerA as readonly WireCap[]])).toBe('zstd-dict-ru-v1');\n    expect(negotiateDict(allCaps, [peerB as readonly WireCap[]])).toBe('zstd-dict-ru-v1');\n    expect(negotiateDict(allCaps, [peerA as readonly WireCap[], peerB as readonly WireCap[]])).toBe('zstd-dict-ru-v1');\n  });\n});\n\n// ─── Phase 2.F.A — envelope-v2 compaction ─────────────────────────────────────\n\ndescribe('Phase 2.F.A — envelope-v2 (0xC8 magic, compact id/ts/k)', () => {\n  // A representative chat-msg envelope, all fields v2-encodable.\n  const sampleEnv = (over: Partial<"+"Record<"+"string, unknown>> = {}) => ({\n    v: 1,\n    id: '01234567-89ab-cdef-0123-456789abcdef',\n    ts: ROOM_EPOCH + 60_000, // 1 minute past epoch\n    from: 'a'.repeat(64),\n    kind: 'chat-msg',\n    body: 'Привет',\n    ...over,\n  });\n\n  it('roundtrip dictless (0xC8 0x00)', () => {\n    const env = sampleEnv();\n    const bytes = encode(env, { cbor: true, zstd: true, envelope: 2 });\n    expect(bytes[0]).toBe(0xC8);\n    expect(bytes[1]).toBe(0x00);\n    expect(decode(bytes)).toEqual(env);\n  });\n\n  it('roundtrip with each shipped dict (0xC8 0x01/0x02/0x03)', () => {\n    const cases: Array<"+"{ dict: 'zstd-dict-ru-v1' | 'zstd-dict-fa-v1' | 'zstd-dict-en-v1'; id: number; body: string }> = [\n      { dict: 'zstd-dict-ru-v1', id: 0x01, body: 'Привет, как дела? Уже еду к тебе, буду через 20 минут.' },\n      { dict: 'zstd-dict-fa-v1', id: 0x02, body: 'سلام، حالت چطوره؟ من تا ده دقیقه دیگه میرسم.' },\n      { dict: 'zstd-dict-en-v1', id: 0x03, body: 'hey, on my way — be there in 10 min' },\n    ];\n    for (const c of cases) {\n      const env = sampleEnv({ body: c.body });\n      const bytes = encode(env, { cbor: true, zstd: true, envelope: 2, dict: c.dict });\n      expect(bytes[0]).toBe(0xC8);\n      expect(bytes[1]).toBe(c.id);\n      expect(decode(bytes)).toEqual(env);\n    }\n  });\n\n  it('every shipped kind round-trips through enum and back', () => {\n    for (const kind of Object.keys(KIND_TO_BYTE)) {\n      const env = sampleEnv({ kind });\n      const bytes = encode(env, { cbor: true, zstd: true, envelope: 2 });\n      expect(bytes[0]).toBe(0xC8);\n      expect(decode(bytes)).toEqual(env);\n    }\n  });\n\n  it('kind enum byte values are stable wire IDs (renumber === silent corruption at scale)', () => {\n    // Frozen-constant gate: tests above use KIND_TO_BYTE itself as the oracle,\n    // so an off-by-one bump (e.g. chat-edit becoming 0x03 + chat-delete 0x04)\n    // would still pass round-trip. THIS test pins each literal byte explicitly.\n    // If you renumber, you break wire compat with every shipped client. DON'T.\n    expect(KIND_TO_BYTE['chat-msg']).toBe(0x01);\n    expect(KIND_TO_BYTE['chat-edit']).toBe(0x02);\n    expect(KIND_TO_BYTE['chat-delete']).toBe(0x03);\n    expect(KIND_TO_BYTE['chat-reaction']).toBe(0x04);\n    expect(KIND_TO_BYTE['chat-receipt']).toBe(0x05);\n    expect(KIND_TO_BYTE['chat-typing']).toBe(0x06);\n    expect(KIND_TO_BYTE['chat-history']).toBe(0x07);\n    expect(KIND_TO_BYTE['chat-history-request']).toBe(0x08);\n    // Payment kinds — provisional until first prod payment frame ships,\n    // see docs/FOLLOWUPS.md A11. After ship: lock these the same way.\n    expect(KIND_TO_BYTE['pay-quote-request']).toBe(0x10);\n    expect(KIND_TO_BYTE['pay-quote']).toBe(0x11);\n    expect(KIND_TO_BYTE['pay-paid']).toBe(0x12);\n    expect(KIND_TO_BYTE['pay-confirmed']).toBe(0x13);\n    expect(KIND_TO_BYTE['pay-cancel']).toBe(0x14);\n    expect(KIND_TO_BYTE['pay-offer-publish']).toBe(0x15);\n    expect(KIND_TO_BYTE['pay-offer-pay-request']).toBe(0x16);\n    expect(KIND_TO_BYTE['cashu-token-send']).toBe(0x20);\n    expect(KIND_TO_BYTE['cashu-token-claim']).toBe(0x21);\n    expect(KIND_TO_BYTE['cashu-token-bounce']).toBe(0x22);\n    expect(KIND_TO_BYTE['evm-pay-quote-request']).toBe(0x30);\n    expect(KIND_TO_BYTE['evm-pay-quote']).toBe(0x31);\n    expect(KIND_TO_BYTE['evm-pay-paid']).toBe(0x32);\n    expect(KIND_TO_BYTE['evm-pay-confirmed']).toBe(0x33);\n    expect(KIND_TO_BYTE['evm-pay-cancel']).toBe(0x34);\n    expect(KIND_TO_BYTE['xmr-pay-quote-request']).toBe(0x40);\n    expect(KIND_TO_BYTE['xmr-pay-quote']).toBe(0x41);\n    expect(KIND_TO_BYTE['xmr-pay-paid']).toBe(0x42);\n    expect(KIND_TO_BYTE['xmr-pay-confirmed']).toBe(0x43);\n    expect(KIND_TO_BYTE['xmr-pay-cancel']).toBe(0x44);\n  });\n\n  it('v2 frames are smaller than v1 for short RU messages', () => {\n    const inputs = ['ок', 'Привет', 'Да', 'Хорошо'];\n    for (const body of inputs) {\n      const env = sampleEnv({ body });\n      const v1 = encode(env, { cbor: true, zstd: true, envelope: 1 });\n      const v2 = encode(env, { cbor: true, zstd: true, envelope: 2 });\n      // eslint-disable-next-line no-console\n      console.log(`[2FA-size] body=\"${body}\": v1=${v1.length}B v2=${v2.length}B Δ=${v1.length - v2.length}B`);\n      expect(v2.length).toBeLessThan(v1.length);\n    }\n  });\n\n  it('negotiateEnvelopeVersion: 2 only when every peer advertises envelope-v2', () => {\n    const mineV2: readonly WireCap[] = ALL_CAPS;\n    const mineV1: readonly WireCap[] = ['cbor', 'cbor+zstd'];\n    expect(negotiateEnvelopeVersion(mineV2, [['cbor', 'cbor+zstd', 'envelope-v2']])).toBe(2);\n    expect(negotiateEnvelopeVersion(mineV2, [['cbor', 'cbor+zstd', 'envelope-v2'], ['cbor', 'envelope-v2']])).toBe(2);\n    expect(negotiateEnvelopeVersion(mineV2, [['cbor', 'cbor+zstd']])).toBe(1);\n    expect(negotiateEnvelopeVersion(mineV2, [['envelope-v2'], ['cbor']])).toBe(1);\n    // I lack envelope-v2 → always 1.\n    expect(negotiateEnvelopeVersion(mineV1, [['envelope-v2']])).toBe(1);\n    // Empty roster → 1 (defensive: matches solo-pin shape in useBurnerChat).\n    expect(negotiateEnvelopeVersion(mineV2, [])).toBe(1);\n  });\n\n  it('decoder accepts mixed-roster v2 frames even when room sends v1', () => {\n    // A peer with envelope-v2 cap will accept both v1 (legacy fallback) and v2\n    // self-test frames. Verifies decoder branches don't depend on negotiation.\n    const env = sampleEnv();\n    const v1 = encode(env, { cbor: true, zstd: true, envelope: 1 });\n    const v2 = encode(env, { cbor: true, zstd: true, envelope: 2 });\n    expect(decode(v1)).toEqual(env);\n    expect(decode(v2)).toEqual(env);\n  });\n\n  it('decoder of 0xC8 0x00 with unknown enum byte returns forward-compat sentinel', async () => {\n    // Forge a v2 frame whose `k` is 0xFF (unassigned). Encode dictless via\n    // direct CBOR + zstd, prefix manually.\n    const { Encoder } = await import('cbor-x');\n    const { compress } = await import('@bokuweb/zstd-wasm');\n    const cborEnc = new Encoder({ mapsAsObjects: true, useRecords: false });\n    const bogus = {\n      v: 2,\n      id: new Uint8Array(16),\n      ts: 60_000,\n      from: 'a'.repeat(64),\n      k: 0xFF,\n      body: 'x',\n    };\n    const cbor = cborEnc.encode(bogus);\n    const zst = compress(cbor, 3);\n    const wire = new Uint8Array(2 + zst.length);\n    wire[0] = 0xC8;\n    wire[1] = 0x00;\n    wire.set(zst, 2);\n    const result = decode(asWireBytes(wire));\n    expect(result).toBeDefined();\n    expect((result as Record<"+"string, unknown>).kind).toBe(\"chat-unknown-future\");\n    expect((result as Record<"+"string, unknown>).raw).toBe(0xFF);\n  });\n\n  it('rejects 0xC8 frame whose compressed length exceeds the cap', () => {\n    const big = new Uint8Array(70 * 1024);\n    big[0] = 0xC8;\n    big[1] = 0x00;\n    expect(() => decode(asWireBytes(big))).toThrow(/exceeds compressed-size cap/);\n  });\n\n  it('rejects 0xC8 frame with bomb-shape FCS = 4 GiB', () => {\n    const bomb = new Uint8Array([\n      0x28, 0xb5, 0x2f, 0xfd,\n      0xc0, 0x40,\n      0xff, 0xff, 0xff, 0xff,\n      0x00, 0x00, 0x00, 0x00,\n      0x00, 0x00, 0x00,\n    ]);\n    const wire = new Uint8Array(2 + bomb.length);\n    wire[0] = 0xC8;\n    wire[1] = 0x00;\n    wire.set(bomb, 2);\n    expect(() => decode(asWireBytes(wire))).toThrow(/Frame_Content_Size .* exceeds cap/);\n  });\n\n  it('encoder falls back to v1 when value isn\\'t v2-encodable', () => {\n    // Unknown kind → silent v1 fallback (per-frame, opportunistic).\n    const env = { v: 1, id: '01234567-89ab-cdef-0123-456789abcdef', ts: ROOM_EPOCH, from: 'a'.repeat(64), kind: 'future-kind', body: 'x' };\n    const bytes = encode(env, { cbor: true, zstd: true, envelope: 2 });\n    // 0xC6 (dictless v1) — NOT 0xC8.\n    expect(bytes[0]).toBe(0xC6);\n    expect(decode(bytes)).toEqual(env);\n  });\n\n  it('encoder falls back to v1 when ts is before ROOM_EPOCH', () => {\n    const env = { v: 1, id: '01234567-89ab-cdef-0123-456789abcdef', ts: ROOM_EPOCH - 1, from: 'x'.repeat(64), kind: 'chat-msg', body: 'x' };\n    const bytes = encode(env, { cbor: true, zstd: true, envelope: 2 });\n    expect(bytes[0]).toBe(0xC6);\n    expect(decode(bytes)).toEqual(env);\n  });\n\n  it('preserves unknown fields through v2 round-trip (forward-compat passthrough)', () => {\n    const env = sampleEnv({ futureField: 'survive', nested: { a: 1, b: [1, 2, 3] } });\n    const bytes = encode(env, { cbor: true, zstd: true, envelope: 2 });\n    expect(decode(bytes)).toEqual(env);\n  });\n\n  it('backwards-compat: envelope=1 byte-identical to default zstd path', () => {\n    // Old peers MUST receive byte-for-byte identical Phase 2.E.B output.\n    const env = sampleEnv();\n    const a = encode(env, { cbor: true, zstd: true });\n    const b = encode(env, { cbor: true, zstd: true, envelope: 1 });\n    expect(a).toEqual(b);\n  });\n});\n\n// ─── Phase 2.F.B — envelope-v3 (peer-index compaction) ───────────────────────\n\ndescribe('Phase 2.F.B — envelope-v3 (0xCA magic, peer-index compaction)', () => {\n  const sampleEnv = (over: Partial<"+"Record<"+"string, unknown>> = {}) => ({\n    v: 1,\n    id: '01234567-89ab-cdef-0123-456789abcdef',\n    ts: ROOM_EPOCH + 60_000,\n    from: 'a'.repeat(64),\n    kind: 'chat-msg',\n    body: 'Привет',\n    ...over,\n  });\n\n  // Simulated ratchet peer_index_map: uint8 → 64-char hex pubkey.\n  const PEER_MAP: Record<"+"number, string> = {\n    0: 'a'.repeat(64),\n    1: 'b'.repeat(64),\n    42: 'c'.repeat(64),\n  };\n  const resolvePeer = (idx: number) => PEER_MAP[idx];\n\n  it('roundtrip dictless (0xCA 0x00 <"+"peerIndex>)', () => {\n    const env = sampleEnv();\n    const bytes = encode(env, { cbor: true, zstd: true, envelope: 3, peerIndex: 0 });\n    expect(bytes[0]).toBe(0xCA);\n    expect(bytes[1]).toBe(0x00);\n    expect(bytes[2]).toBe(0x00);\n    const decoded = decode(bytes, { resolvePeer }) as Record<"+"string, unknown>;\n    expect(decoded.from).toBe(env.from);\n    expect(decoded.kind).toBe(env.kind);\n    expect(decoded.body).toBe(env.body);\n    expect(decoded.id).toBe(env.id);\n    expect(decoded.ts).toBe(env.ts);\n    expect(decoded.v).toBe(1);\n  });\n\n  it('roundtrip with each shipped dict (0xCA 0x01/0x02/0x03 <"+"peerIndex>)', () => {\n    const cases: Array<"+"{ dict: 'zstd-dict-ru-v1' | 'zstd-dict-fa-v1' | 'zstd-dict-en-v1'; id: number; body: string }> = [\n      { dict: 'zstd-dict-ru-v1', id: 0x01, body: 'Привет, как дела? Уже еду к тебе, буду через 20 минут.' },\n      { dict: 'zstd-dict-fa-v1', id: 0x02, body: 'سلام، حالت چطوره؟ من تا ده دقیقه دیگه میرسم.' },\n      { dict: 'zstd-dict-en-v1', id: 0x03, body: 'hey, on my way — be there in 10 min' },\n    ];\n    for (const c of cases) {\n      const env = sampleEnv({ body: c.body });\n      const bytes = encode(env, { cbor: true, zstd: true, envelope: 3, peerIndex: 1, dict: c.dict });\n      expect(bytes[0]).toBe(0xCA);\n      expect(bytes[1]).toBe(c.id);\n      expect(bytes[2]).toBe(0x01);\n      const decoded = decode(bytes, { resolvePeer }) as Record<"+"string, unknown>;\n      expect(decoded.from).toBe(PEER_MAP[1]);\n      expect(decoded.body).toBe(c.body);\n    }\n  });\n\n  it('v3 frames are smaller than v2 (peer-index replaces 64-char hex)', () => {\n    const inputs = ['ок', 'Привет', 'Да'];\n    for (const body of inputs) {\n      const env = sampleEnv({ body });\n      const v2 = encode(env, { cbor: true, zstd: true, envelope: 2 });\n      const v3 = encode(env, { cbor: true, zstd: true, envelope: 3, peerIndex: 0 });\n      // eslint-disable-next-line no-console\n      console.log(`[2FB-size] body=\"${body}\": v2=${v2.length}B v3=${v3.length}B Δ=${v2.length - v3.length}B`);\n      expect(v3.length).toBeLessThan(v2.length);\n    }\n  });\n\n  it('negotiateEnvelopeVersion: 3 when all peers advertise envelope-v3, 2 when v2-only, 1 otherwise', () => {\n    const mineV3: readonly WireCap[] = ALL_CAPS;\n    const mineV2: readonly WireCap[] = ['cbor', 'cbor+zstd', 'envelope-v2'];\n    const mineV1: readonly WireCap[] = ['cbor', 'cbor+zstd'];\n    // v3 universal → 3\n    expect(negotiateEnvelopeVersion(mineV3, [['cbor', 'cbor+zstd', 'envelope-v2', 'envelope-v3']])).toBe(3);\n    expect(negotiateEnvelopeVersion(mineV3, [['envelope-v3'], ['envelope-v2', 'envelope-v3']])).toBe(3);\n    // v3 not universal but v2 universal → 2\n    expect(negotiateEnvelopeVersion(mineV3, [['cbor', 'cbor+zstd', 'envelope-v2']])).toBe(2);\n    expect(negotiateEnvelopeVersion(mineV3, [['envelope-v2', 'envelope-v3'], ['envelope-v2']])).toBe(2);\n    // neither universal → 1\n    expect(negotiateEnvelopeVersion(mineV3, [['cbor', 'cbor+zstd']])).toBe(1);\n    // I lack v3 but have v2, peers have v3 → 2 (I can't encode v3, fall to v2)\n    expect(negotiateEnvelopeVersion(mineV2, [['envelope-v3']])).toBe(1);\n    /
