# Changesets-based auto-release pipeline.
#
# Two-phase flow:
#   Phase 1 — Version PR:
#     Push to main with pending changesets → changesets/action opens (or
#     updates) a "Version Packages" pull request that bumps package.json
#     versions + generates CHANGELOG entries. No publish happens yet.
#
#   Phase 2 — Publish:
#     Merging the "Version Packages" PR triggers this workflow again; since
#     there are now no pending changesets, changesets/action runs the publish
#     command instead: `pnpm build && node scripts/release-npm-packages.mjs`.
#     The custom publisher uses npm OIDC trusted publishing (no token needed).
#
# npm Trusted Publishing (OIDC) — no token required.
#
# npm's OIDC flow:
#   - This workflow requests an OIDC token (id-token: write).
#   - `npm publish <tarball> --access public` exchanges that token with npm's
#     OIDC endpoint, which checks that THIS workflow file + THIS repo is the
#     registered trusted publisher for the package. No NPM_TOKEN needed.
#
# Provenance attestation:
#   --provenance requires a PUBLIC source repo. While this repo is private,
#   do NOT set NPM_PROVENANCE=1 here. Flip to NPM_PROVENANCE=1 when the repo
#   goes public (and update the npm "Environment name" field on the trusted
#   publisher to "release" or leave it blank).
#
# Trusted publishers configured on npm (npmjs.com → package → Publishing) —
# ALL 7 packages, each → anatolykoptev/oxpulse-chat-sdk  workflow: release.yml
# environment: release (as of 2026-07-21):
#   @oxpulse/wire-codec  @oxpulse/chat-sdk  @oxpulse/chat-widget  @oxpulse/voice-core
#   @oxpulse/crypto-primitives  @oxpulse/url-contract  @oxpulse/intro-protocol
# All are bootstrapped + trusted-publisher-configured, so SOFT_PACKAGES_OIDC in
# scripts/release-npm-packages.mjs is EMPTY — every OIDC publish failure is fatal.
# Bootstrap note: a brand-new package needs ONE manual `npm publish` (token
# mode) before the trusted-publisher UI is reachable from its settings page;
# add it to SOFT_PACKAGES_OIDC until its trusted publisher is configured.
#
# GitHub Releases note:
#   changesets/action creates GitHub Releases automatically when the publish
#   command emits "New tag: <name>@<version>" lines. The custom OIDC publisher
#   (release-npm-packages.mjs) does NOT emit those lines (and intentionally
#   skips git-tagging in OIDC mode — see tagAndPush() comment in that file).
#   Therefore GitHub Releases are NOT auto-created by this pipeline. npm
#   publishes still work correctly. GitHub Releases are a future follow-up.

name: Release (npm OIDC + Changesets)

on:
  push:
    branches:
      - main
    # Loop-safety. An EARLIER version of this comment claimed the guarantee came
    # from the built-in GITHUB_TOKEN (GitHub does not re-trigger `on: push`
    # workflows for GITHUB_TOKEN-authored pushes) and warned that an App token
    # "WILL loop". That was wrong, and it was actively harmful: it told the next
    # person not to make the correct change. The App token is now wired
    # (see "Mint krolik-release-bot token" below) and there is no loop, because:
    #
    #   1. This workflow never pushes to `main`. The version phase pushes the
    #      bump commit to the SIDE BRANCH `changeset-release/main` and opens a
    #      PR from it (PR #226's headRefName is exactly that). A push to a side
    #      branch cannot match `branches: [main]` no matter who authored it.
    #   2. The publish phase pushes nothing at all. The custom OIDC publisher
    #      early-returns out of tagAndPush() in OIDC mode (see
    #      scripts/release-npm-packages.mjs), and changesets/action is
    #      configured with createGithubReleases: false, so no tag is pushed
    #      either.
    #
    # So the only push to `main` in the whole cycle is a human merging the
    # Version Packages PR — one trigger per release, by construction. The
    # branch filter is the SECOND line of defence, not the first; the first is
    # that no step here writes to `main`. If you ever add a step that commits
    # to `main` (e.g. regenerating a lockfile on the release commit), that
    # invariant is what you are breaking — re-derive the loop analysis then,
    # and do not rely on token identity to save you.
    #
    # Deliberately NOT added as a belt-and-braces guard: skipping the job when
    # the head commit was authored by the bot. It would wedge the pipeline the
    # day anyone enables auto-merge on the Version Packages PR (the merge commit
    # would then be bot-authored and the publish would silently never run) —
    # trading a loop we cannot reach for a silent no-publish we can. The
    # `concurrency` group below is the safe bound instead: it serialises release
    # runs so even an unforeseen re-trigger cannot fan out.
  # Manual fallback: trigger a publish run directly without waiting for a
  # Version Packages PR, e.g. to re-publish after a transient npm outage.
  # NOTE: this path runs the same test gate as any other run — see the
  # "Typecheck"/"Test" steps below. It used to publish to npm with zero tests
  # executed on that tree.
  workflow_dispatch:

# Serialise release runs. Publishing is not safely concurrent (two runs would
# race the same npm versions and the same CDN directory), and never cancel one
# in flight — a cancelled run can leave some packages published and others not.
concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest

    # Permissions widening vs. the previous publish-only workflow:
    #   contents: write   — changesets/action must push the version bump commit
    #                       when creating/updating the "Version Packages" PR.
    #                       The old workflow had contents: read (no PR needed).
    #   pull-requests: write — changesets/action opens and labels the PR.
    #   id-token: write   — same as before: npm OIDC token exchange.
    # Blast-radius note: these permissions are scoped to this single job.
    # The environment: release gate (required reviewer) provides the human
    # checkpoint before any publish step runs.
    permissions:
      contents: write
      pull-requests: write
      id-token: write

    # Gates this job behind the "release" environment.
    # Set a required reviewer in repo Settings → Environments → release.
    # If no protection rules are configured, GitHub auto-creates the environment
    # and the job runs immediately — harmless and forward-compatible.
    # npm trusted-publisher "Environment name" field: leave BLANK or set to "release".
    environment: release

    steps:
      - name: Checkout
        # SHA-pinned for supply-chain hardening (holds id-token: write).
        # v4.3.1
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          # Full history required: changesets/action compares against the base
          # branch to detect which changesets are new.
          fetch-depth: 0

      - name: Set up Node.js 24
        # v4.4.0
        #
        # Was 22.x. Bumped to 24.x because this workflow now runs the test suite
        # before publishing, and part of that suite (the SEC-CR-003 durable-replay
        # tests) needs the Web Locks API, which node 22 does not have — the same
        # reason preflight.yml selects nvm node 24 on the self-hosted runner. On
        # node 22 the added gate would fail for a runtime reason rather than a
        # code reason, which is the worst kind of gate. Publishing itself is
        # unaffected: it runs through npm >= 11.5.1 (installed below) and OIDC.
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.x'
          # registry-url puts the npm config in place; OIDC mode does NOT use
          # NODE_AUTH_TOKEN, but the registry URL is still needed for `npm view`.
          registry-url: 'https://registry.npmjs.org'

      - name: Enable corepack and install pnpm 10.33.2
        run: |
          corepack enable
          corepack prepare pnpm@10.33.2 --activate

      # npm >= 11.5.1 is required for OIDC trusted publishing.
      # The ubuntu-latest runner ships an older npm; upgrade explicitly.
      - name: Upgrade npm to latest (>= 11.5.1 required for OIDC)
        run: |
          npm i -g npm@latest
          NPM_VER=$(npm --version)
          echo "npm version: $NPM_VER"
          echo "NPM_VER=$NPM_VER" >> "$GITHUB_ENV"

      - name: Assert npm >= 11.5.1
        env:
          NPM_VER: ${{ env.NPM_VER }}
        run: |
          python3 - <<'EOF'
          import sys, os
          ver = os.environ["NPM_VER"].split(".")
          major, minor, patch = int(ver[0]), int(ver[1]), int(ver[2]) if len(ver) > 2 else 0
          required = (11, 5, 1)
          if (major, minor, patch) < required:
              print(f"FATAL: npm {major}.{minor}.{patch} < 11.5.1 — OIDC publish not supported", file=sys.stderr)
              sys.exit(1)
          print(f"npm version OK: {major}.{minor}.{patch} >= 11.5.1")
          EOF

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      # ── Test gate (LOAD-BEARING) ─────────────────────────────────────────────
      # Until this existed, NOTHING on the publish path ran a test. preflight.yml
      # triggers on `pull_request` only, so a `workflow_dispatch` re-publish — the
      # documented manual fallback above — shipped to npm having executed zero
      # tests on that tree. Combined with the release PR getting no CI runs at all
      # (the GITHUB_TOKEN-authored-PR problem the App token below fixes), the
      # release pipeline had no gate whatsoever.
      #
      # These steps mirror preflight.yml exactly. Keep them in sync: if a test
      # needs a fixture provisioned there, it needs it here too.
      - name: Assert Web Locks available
        run: |
          node --version
          node -e "if (typeof navigator?.locks?.request !== 'function') { console.error('node lacks Web Locks (need node >= 24) — SEC-CR-003 tests would silently lose coverage'); process.exit(1) }"

      # build:cdn is NOT part of the root build script, but
      # chat-widget/src/__tests__/{cdn-bundle,browser-regex-compat}.test.ts assert
      # against the dist-cdn/index.js artifact — provision it (never skip the test).
      - name: Build (gate)
        run: |
          pnpm build
          pnpm --filter @oxpulse/chat-widget build:cdn

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      # ── Release identity ─────────────────────────────────────────────────────
      # Fleet standard: releases are signed by the krolik-release-bot GitHub App
      # (App 4335933), not by the built-in GITHUB_TOKEN and not by a personal PAT.
      #
      # The concrete reason here, not just consistency: a pull request opened by
      # GITHUB_TOKEN gets NO workflow runs — GitHub suppresses them to prevent
      # recursion. That is why the "Version Packages" PR #226 sat at
      # mergeStateStatus UNSTABLE with zero checks and was merged on that basis.
      # An App-opened PR does get CI runs, so preflight.yml actually gates the
      # release PR.
      #
      # Credentials are provisioned per repo as the variable RELEASE_BOT_APP_ID
      # and the secret RELEASE_BOT_PRIVATE_KEY. The action masks the minted token
      # in logs and revokes it when the job ends.
      #
      # Not touched by this: the npm publish path, which authenticates with OIDC
      # (id-token: write) and never sees any GitHub token.
      - name: Mint krolik-release-bot token
        # SHA-pinned. v2.2.2
        # Source: https://github.com/actions/create-github-app-token/releases/tag/v2.2.2
        id: bot-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349
        with:
          app-id: ${{ vars.RELEASE_BOT_APP_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}

      - name: Create Version PR or Publish
        # SHA-pinned. v1.9.0
        # Source: https://github.com/changesets/action/releases/tag/v1.9.0
        id: changesets
        uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d
        with:
          # version: runs `changeset version` inside the action to bump
          # package.json files and generate CHANGELOG entries when a Version
          # Packages PR is being created or updated.
          version: pnpm changeset version
          # publish: runs ONLY when there are no pending changesets (i.e. after
          # the Version Packages PR is merged). Build MUST precede publish
          # because pnpm pack (used by release-npm-packages.mjs in OIDC mode)
          # does NOT run prepublishOnly — dist/ must already exist.
          #
          # Must be a SINGLE npm script, not "pnpm build && node …": changesets/
          # action runs the publish command via argv tokenisation, NOT a shell,
          # so a literal "&&" is passed as an argument (pnpm forwards it into each
          # child `tsc`, breaking the build with TS5112). The `release:ci` script
          # body IS executed by sh, so the "&&" inside it works correctly.
          publish: pnpm release:ci
          # createGithubReleases: false — the OIDC publisher (release-npm-packages.mjs)
          # deliberately does NOT create git tags in CI (tagAndPush() early-returns in
          # OIDC_MODE). But it still logs "New tag: <pkg>@<ver>" so changesets/action
          # sets outputs.published=true (which the CDN publish steps below gate on).
          # With createGithubReleases at its default (true), the action parses those
          # "New tag:" lines and tries to `git push origin <tag>` for each — tags that
          # were never created — failing the job with "src refspec … does not match any"
          # AFTER npm publish already succeeded, which then SKIPS the widget-CDN steps.
          # Setting false keeps published=true (CDN steps run) without the tag push.
          # GitHub Releases are not created by this pipeline anyway (see the header note).
          createGithubReleases: false
        env:
          # krolik-release-bot App installation token, NOT secrets.GITHUB_TOKEN.
          # This is what makes the Version Packages PR receive CI runs — see the
          # "Mint krolik-release-bot token" step above for why that matters and
          # the `on:` block for why it does not create a trigger loop.
          GITHUB_TOKEN: ${{ steps.bot-token.outputs.token }}
          # TRUSTED_PUBLISH=1 activates the OIDC path in release-npm-packages.mjs.
          # NPM_TOKEN must NOT be set (the whole point is to publish without it).
          #
          # NPM_PROVENANCE: intentionally absent — provenance requires a PUBLIC
          # source repo. Set NPM_PROVENANCE=1 here when this repo goes public.
          TRUSTED_PUBLISH: '1'

      # ── CDN publish (Phase 3) ────────────────────────────────────────────────
      # Deliberately UNGATED on steps.changesets.outputs.published. That output
      # is set true when release-npm-packages.mjs emits a "New tag:" line for
      # ANY package published this run — it is a proxy for "did SOME package
      # publish", not "does the widget CDN need deploying":
      #   - A release that bumps ONLY chat-widget (no wire-codec/chat-sdk churn)
      #     only gets published=true if chat-widget's OWN publish succeeds and
      #     emits its own "New tag:" line. Relying on that coupling is fragile —
      #     it depends on chat-widget's OIDC publish path staying healthy on
      #     every run, not on whether the CDN bundle actually needs updating.
      #   - This is not hypothetical: at the time this was first discovered,
      #     chat-widget was still un-bootstrapped on npm (in SOFT_PACKAGES_OIDC,
      #     see release-npm-packages.mjs), so it structurally could never emit
      #     "New tag:" — the first real CDN deploy attempt gated on this signal
      #     and silently skipped, because wire-codec/chat-sdk were already at
      #     registry-parity that run and widget couldn't contribute published=true
      #     either. chat-widget has since been bootstrapped (npm + trusted
      #     publisher configured — SOFT_PACKAGES_OIDC is now empty), which fixes
      #     that specific failure mode, but the underlying fragility (CDN deploy
      #     coupled to an unrelated package's publish signal) is still the wrong
      #     shape, so the ungating below stays regardless.
      #
      # Fix: run these steps on every push to main / workflow_dispatch. Two
      # separate problems needed separate fixes:
      #   (a) chat-widget's CDN bundle imports @oxpulse/chat-sdk's dist/, which
      #       only `release:ci`'s `pnpm build` produces — never built on a
      #       "version" phase push (pending changesets, publish not invoked).
      #       Fixed by "Build workspace packages" below, running UNCONDITIONALLY
      #       before "Build CDN bundle", so dist/ always exists regardless of
      #       which phase this run is.
      #   (b) `latest/` is a mutable plain-rsync-overwrite pointer (no
      #       --ignore-existing) — running its update unconditionally would
      #       clobber it with un-released, pre-bump bytes during the entire
      #       Version-PR window. Fixed INSIDE publish-widget-cdn.mjs: it probes
      #       the live CDN (an HTTPS HEAD on the versioned URL) and advances
      #       `latest/` ONLY when that probe confirms the version was absent
      #       beforehand (a genuinely new release) — never on "already live" or
      #       on an indeterminate/network-error result. The versioned dir itself
      #       is NOT gated on this probe — it deploys unconditionally on every
      #       run, relying solely on --ignore-existing (no-op when complete,
      #       self-heals a partial prior deploy). See the script header and
      #       probeDeployedState()'s doc comment for the full reasoning,
      #       including the known residual: if the ONE run that would have seen
      #       "absent" instead sees an indeterminate result (a CDN network
      #       blip), `latest/` can be stranded on the previous version with no
      #       automatic recovery — the script emits a GHA ::warning:: annotation
      #       specifically on that indeterminate case (never on the routine
      #       "already live" case, which would cry wolf on every ordinary push)
      #       so a genuine strand is operator-visible without opening the raw
      #       log, rather than silently retrying forever (a full self-heal for
      #       `latest/` itself would need a
      #       public read-and-compare against the remote's currently-live
      #       version, which isn't determinable from the versioned-dir's
      #       immutable-SRI alone — judged not worth the added complexity for
      #       how rare the window is).
      #
      # Soft-skip: if CDN_DEPLOY_KEY secret is absent the publisher logs a
      # clear message and exits 0 — the release is not failed.  This lets the
      # workflow merge safely BEFORE the operator installs the deploy key.
      #
      # Deploy strategy: rsync-only (no ssh mv, no ssh rm-rf).  The authorized_keys
      # jail is command="rrsync -wo …",restrict — rrsync rejects any
      # SSH_ORIGINAL_COMMAND whose first token is not "rsync".  Shell commands
      # (mv, rm, cat) are unconditionally refused.
      #
      # Immutability: widget/<version>/ is deployed with rsync --ignore-existing,
      # unconditionally, on every run — this IS the idempotency mechanism for the
      # versioned dir (not a backstop to some other gate). Files already present
      # on the remote are never overwritten; files missing from a partial prior
      # deploy get uploaded.
      #
      # latest/: deployed with plain rsync overwrite (intentionally mutable
      # pointer), gated on publish-widget-cdn.mjs's live-CDN probe confirming
      # this version was absent beforehand — see (b) above.
      #
      # Operator setup required (one-time, before this step goes live):
      #   1. Generate ed25519 key pair:
      #        ssh-keygen -t ed25519 -f cdn_deploy_key -C "cdn-deploy@oxpulse-chat-sdk" -N ""
      #   2. Install public key on the box (~/.ssh/authorized_keys), jailed to
      #      the CDN dir via rrsync:
      #        command="rrsync -wo /home/krolik/deploy/krolik-server/files/cdn-oxpulse",restrict ssh-ed25519 <PUBKEY> cdn-deploy@oxpulse-chat-sdk
      #   3. Add GH secrets (repo → Settings → Secrets → Actions):
      #        CDN_DEPLOY_KEY   — content of cdn_deploy_key (private key, PEM)
      #        CDN_SSH_HOST     — 192.9.243.148
      #        CDN_SSH_USER     — krolik
      #        CDN_SSH_PORT     — box's sshd port (optional — publish-widget-cdn.mjs
      #                           defaults to "22" if unset; this box uses a
      #                           non-default port, check sshd_config)
      #        CDN_SSH_HOST_KEY — box's host public key, WITHOUT the hostname
      #                           prefix (cat /etc/ssh/ssh_host_ed25519_key.pub
      #                           on the box, or ssh-keyscan and strip the
      #                           leading "host:port " token). Pinned into a
      #                           throwaway known_hosts so StrictHostKeyChecking=yes
      #                           succeeds on a fresh runner — see
      #                           publish-widget-cdn.mjs header for why this is
      #                           NOT a bare ssh-keyscan (TOFU) call.

      - name: Build workspace packages
        # Unconditional: chat-widget's CDN bundle imports @oxpulse/chat-sdk's
        # dist/ (a value import, not types-only), which otherwise only exists
        # when release:ci's own `pnpm build` ran — i.e. never on a "version"
        # phase push (pending changesets, publish command not invoked). Without
        # this, "Build CDN bundle" fails to resolve @oxpulse/chat-sdk on every
        # ordinary feature merge that carries a changeset.
        run: pnpm build

      - name: Build CDN bundle
        run: pnpm --filter @oxpulse/chat-widget build:cdn

      - name: Publish widget bundle to cdn.oxpulse.chat
        env:
          CDN_SSH_HOST: ${{ secrets.CDN_SSH_HOST }}
          CDN_SSH_USER: ${{ secrets.CDN_SSH_USER }}
          CDN_SSH_PORT: ${{ secrets.CDN_SSH_PORT }}
          CDN_SSH_HOST_KEY: ${{ secrets.CDN_SSH_HOST_KEY }}
          CDN_DEPLOY_KEY: ${{ secrets.CDN_DEPLOY_KEY }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: node scripts/publish-widget-cdn.mjs
