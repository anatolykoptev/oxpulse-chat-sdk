name: preflight
# PR test gate on the krolik self-hosted runner (fleet rule: tests run in CI,
# never skip-to-green). Runner: ~/actions-runner-oxpulse-chat-sdk on krolik,
# systemd user unit actions-runner-oxpulse-chat-sdk.service.
#
# Private repo on the free plan → no branch-protection enforcement; the gate
# is procedural: never merge a red preflight.
on:
  pull_request:
    branches: [main]

concurrency:
  group: preflight-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preflight:
    runs-on: [self-hosted, krolik]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # The runner's systemd service has a bare PATH (/usr/bin first), where
      # node is the system v22 — which lacks the Web Locks API that the
      # SEC-CR-003 durable-replay tests (and corepack's pnpm shim) need.
      # Select the box's nvm node 24 explicitly and fail LOUD if the runtime
      # still lacks navigator.locks, so env drift breaks here — not as
      # mysterious test failures.
      - name: Select node 24 (nvm)
        run: |
          export NVM_DIR="$HOME/.nvm"
          . "$NVM_DIR/nvm.sh"
          nvm use 24
          echo "$(dirname "$(command -v node)")" >> "$GITHUB_PATH"

      - name: Assert Web Locks available
        run: |
          node --version
          node -e "if (typeof navigator?.locks?.request !== 'function') { console.error('node lacks Web Locks (need node >= 24) — SEC-CR-003 tests would silently lose coverage'); process.exit(1) }"

      - name: Install
        run: |
          corepack enable
          pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test
