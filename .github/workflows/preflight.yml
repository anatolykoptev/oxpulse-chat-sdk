name: preflight
# PR test gate on free GitHub-hosted ARM runner (public repo = unlimited minutes).
# arm64 = prod-box parity. Fleet rule: tests run in CI, never skip-to-green.
on:
  pull_request:
    branches: [main]

concurrency:
  group: preflight-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Assert Web Locks available
        run: |
          node --version
          node -e "if (typeof navigator?.locks?.request !== 'function') { console.error('node lacks Web Locks (need node >= 24) — SEC-CR-003 tests would silently lose coverage'); process.exit(1) }"

      - name: Install
        run: pnpm install --frozen-lockfile

      # build:cdn is NOT part of the root build script, but
      # chat-widget/src/__tests__/cdn-bundle.test.ts asserts against the
      # dist-cdn/index.js artifact — provision it (never skip the test).
      - name: Build
        run: |
          pnpm build
          pnpm --filter @oxpulse/chat-widget build:cdn

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test
