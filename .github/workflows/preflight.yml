name: preflight
# PR test gate on free GitHub-hosted ARM runner (public repo = unlimited minutes).
# arm64 = prod-box parity. Fleet rule: tests run in CI, never skip-to-green.
on:
  pull_request:
    branches: [main]
  # Also gate `main` itself. A PR is only ever tested against the base it was
  # branched from, and `required_status_checks.strict` is false, so a green PR
  # merges even when main has moved underneath it. Two PRs that are each green
  # can therefore produce a red main, and nothing would run to say so:
  # 2026-08-07, #267 and #270 were each green against a main lacking the other,
  # and the breakage surfaced only when an unrelated one-line changeset PR (#273)
  # happened to run the merged tree.
  #
  # This does NOT prevent the merge — it detects it immediately instead of at the
  # next unrelated PR. Prevention would be `strict: true` on the required check,
  # which forces every PR to rebase whenever main moves; that is a merge-ergonomics
  # tradeoff, deliberately left to the operator rather than taken here.
  push:
    branches: [main]

concurrency:
  # Keyed by ref, so a main push and a PR run never cancel each other.
  group: preflight-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Assert Web Locks available
        run: |
          node --version
          node -e "if (typeof navigator?.locks?.request !== 'function') { console.error('node lacks Web Locks (need node >= 24) — SEC-CR-003 tests would silently lose coverage'); process.exit(1) }"

      - name: Install
        run: pnpm install --frozen-lockfile

      # Guard: no workspace package may declare publishConfig.directory.
      # It makes `pnpm pack` fail with ERR_PNPM_NO_IMPORTER_MANIFEST_FOUND,
      # breaking the release script. Derives the package list from
      # pnpm-workspace.yaml — not a hand-written array — so a new package
      # nobody registered is still checked. See issue #321.
      - name: Assert no publishConfig.directory
        run: pnpm lint:manifests

      # build:cdn is NOT part of the root build script, but
      # chat-widget/src/__tests__/cdn-bundle.test.ts asserts against the
      # dist-cdn/index.js artifact — provision it (never skip the test).
      - name: Build
        run: |
          pnpm build
          pnpm --filter @oxpulse/chat-widget build:cdn

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test
