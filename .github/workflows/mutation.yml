name: mutation
# Stryker mutation testing — non-blocking baseline (continue-on-error).
# Matrix: each package runs in its own job (parallel), serial mutants within
# each (concurrency: 1 in stryker.config.json). After baseline, raise
# thresholds.break and remove continue-on-error.
on:
  pull_request:
    paths:
      - "packages/*/src/**/*.ts"
      - "packages/*/stryker.config.json"
      - "packages/*/vitest.stryker.config.mjs"
      - ".github/workflows/mutation.yml"

concurrency:
  group: mutation-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  mutation:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    continue-on-error: true

    strategy:
      fail-fast: false
      matrix:
        package:
          - chat-sdk
          - chat-widget
          - crypto-primitives
          - intro-protocol
          - url-contract
          - voice-core
          - wire-codec

    steps:
      - uses: actions/checkout@v5

      # NO `version:` — pnpm/action-setup@v6 auto-detects from packageManager
      # in package.json. Specifying both causes ERR_PNPM_BAD_PM_VERSION.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build workspace
        run: pnpm build

      - name: Run Stryker (${{ matrix.package }})
        working-directory: packages/${{ matrix.package }}
        run: pnpm stryker || echo "::warning::Stryker failed for ${{ matrix.package }} (non-blocking baseline)"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stryker-report-${{ matrix.package }}
          path: packages/${{ matrix.package }}/reports/mutation/
          retention-days: 14
